x="512" y="110" width="6" height="70" rx="3" fill="#F59E0B"/><text class="mono" x="532" y="139" font-size="15" font-weight="700" fill="#F59E0B">feed</text><text class="m" x="532" y="161" font-size="12.5">Public change feed</text><rect class="card" x="512" y="200" width="212" height="70" rx="12"/><rect x="512" y="200" width="6" height="70" rx="3" fill="#10B981"/><text class="mono" x="532" y="229" font-size="15" font-weight="700" fill="#10B981">publisher</text><text class="m" x="532" y="251" font-size="12.5">Authenticated writes</text><rect class="card" x="756" y="280" width="212" height="70" rx="12"/><rect x="756" y="280" width="6" height="70" rx="3" fill="#9333EA"/><text class="mono" x="776" y="309" font-size="15" font-weight="700" fill="#9333EA">mcp-write</text><text class="m" x="776" y="331" font-size="12.5">AI writes with approval</text>
<text class="m" x="32" y="440" font-size="13">Start with core + publication. Feed, writes, Sync, and MCP can be added one at a time.</text>
</svg>
