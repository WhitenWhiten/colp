<text x="40" y="52" font-size="22" font-weight="700" fill="#1f2328">COLP の全体像</text>
<text x="40" y="80" font-size="15" fill="#59636e">1 つのサーバーに 4 種類のクライアント。接続ごとに、個別に実装できるプロファイルがあります。</text>
