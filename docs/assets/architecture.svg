<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">How COLP fits together</title>
<desc id="desc">One server, four kinds of clients. Each connection is a profile you can implement on its own.</desc>
<style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Noto Sans Mono', 'Droid Sans Fallback', monospace}.frame{fill:#ffffff;stroke:#d0d7de}.card{fill:#f6f8fa;stroke:#d0d7de}.inner{fill:#ffffff;stroke:#d8dee4}.h{fill:#1f2328;font-weight:700}.b{fill:#1f2328}.m{fill:#59636e}.ln{stroke:#8c959f;fill:none}.lnf{fill:#8c959f}@media (prefers-color-scheme: dark){.frame{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.inner{fill:#0d1117;stroke:#3d444d}.h,.b{fill:#e6edf3}.m{fill:#9198a1}.ln{stroke:#6e7681}.lnf{fill:#6e7681}}</style>
<defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="lnf"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="999" height="559" rx="16"/>
<text class="h" x="32" y="48" font-size="21">How COLP fits together</text>
<text class="m" x="32" y="74" font-size="14">One server, four kinds of clients. Each connection is a profile you can implement on its own.</text>
<rect class="card" x="360" y="104" width="280" height="372" rx="18"/><g transform="translate(378 122) scale(0.46875)"><rect width="64" height="64" rx="16" fill="url(#mark)"/><path d="M21 14h22a3 3 0 0 1 3 3v35.5a1.5 1.5 0 0 1-2.4 1.2L32 45l-11.6 8.7A1.5 1.5 0 0 1 18 52.5V17a3 3 0 0 1 3-3z" fill="#fff"/><rect x="24" y="22" width="16" height="3.2" rx="1.6" fill="#6366F1"/><rect x="24" y="29" width="11" height="3.2" rx="1.6" fill="#14B8A6"/><rect x="24" y="36" width="14" height="3.2" rx="1.6" fill="#8B5CF6"/></g><text class="h" x="420" y="138" font-size="17">COLP server</text><text class="m" x="420" y="158" font-size="12.5">any conforming implementation</text><rect class="inner" x="376" y="180" width="248" height="62" rx="12"/><rect x="376" y="194" width="4" height="34" rx="2" fill="#0EA5E9"/><text class="h" x="392" y="206" font-size="14">Manifest</text><text class="m mono" x="392" y="226" font-size="11.5">/.well-known/collection-protocol</text><rect class="inner" x="376" y="252" width="248" height="62" rx="12"/><rect x="376" y="266" width="4" height="34" rx="2" fill="#6366F1"/><text class="h" x="392" y="278" font-size="14">Data model</text><text class="m" x="392" y="298" font-size="12">Collections · Nodes · Sidecars</text><rect class="inner" x="376" y="324" width="248" height="62" rx="12"/><rect x="376" y="338" width="4" height="34" rx="2" fill="#EC4899"/><text class="h" x="392" y="350" font-size="14">Change log</text><text class="m" x="392" y="370" font-size="12">Operations · Revisions · Tombstones</text><rect class="inner" x="376" y="396" width="248" height="62" rx="12"/><rect x="376" y="410" width="4" height="34" rx="2" fill="#10B981"/><text class="h" x="392" y="422" font-size="14">Security</text><text class="m" x="392" y="442" font-size="12">Scopes · ACL · Rate limits · Audit</text>
<rect class="card" x="20" y="130" width="220" height="112" rx="14"/><text class="h" x="38" y="162" font-size="16">Browser bookmarks</text><text class="m" x="38" y="184" font-size="12.5">Chromium · Firefox · Safari</text><rect x="38" y="202" width="48" height="22" rx="11" fill="#EC4899" fill-opacity="0.13" stroke="#EC4899" stroke-opacity="0.55"/><text x="62" y="217.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#EC4899" class="mono">sync</text><rect class="card" x="20" y="338" width="220" height="112" rx="14"/><text class="h" x="38" y="370" font-size="16">Apps and scripts</text><text class="m" x="38" y="392" font-size="12.5">create, edit, release</text><rect x="38" y="410" width="82" height="22" rx="11" fill="#10B981" fill-opacity="0.13" stroke="#10B981" stroke-opacity="0.55"/><text x="79" y="425.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#10B981" class="mono">publisher</text><rect class="card" x="760" y="130" width="220" height="112" rx="14"/><text class="h" x="778" y="162" font-size="16">Readers and websites</text><text class="m" x="778" y="184" font-size="12.5">pages · JSON Feed · Atom</text><rect x="778" y="202" width="96" height="22" rx="11" fill="#0EA5E9" fill-opacity="0.13" stroke="#0EA5E9" stroke-opacity="0.55"/><text x="826" y="217.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0EA5E9" class="mono">publication</text><rect x="880" y="202" width="48" height="22" rx="11" fill="#F59E0B" fill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.55"/><text x="904" y="217.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F59E0B" class="mono">feed</text><rect class="card" x="760" y="338" width="220" height="112" rx="14"/><text class="h" x="778" y="370" font-size="16">AI assistants</text><text class="m" x="778" y="392" font-size="12.5">any MCP client</text><rect x="778" y="410" width="75" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.13" stroke="#8B5CF6" stroke-opacity="0.55"/><text x="815.5" y="425.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8B5CF6" class="mono">mcp-read</text><rect x="859" y="410" width="82" height="22" rx="11" fill="#9333EA" fill-opacity="0.13" stroke="#9333EA" stroke-opacity="0.55"/><text x="900" y="425.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9333EA" class="mono">mcp-write</text><line class="ln" x1="244" y1="186" x2="356" y2="186" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="m" x="300" y="176" font-size="12" text-anchor="middle">push · pull · ack</text><line class="ln" x1="244" y1="394" x2="356" y2="394" stroke-width="2" marker-end="url(#arrow)"/><text class="m" x="300" y="384" font-size="12" text-anchor="middle">conditional writes</text><line class="ln" x1="644" y1="186" x2="756" y2="186" stroke-width="2" marker-end="url(#arrow)"/><text class="m" x="700" y="176" font-size="12" text-anchor="middle">snapshots · feeds</text><line class="ln" x1="644" y1="394" x2="756" y2="394" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="m" x="700" y="384" font-size="12" text-anchor="middle">plan → commit</text>
<text class="m" x="32" y="526" font-size="13">Implement only what you need: a static site serving core + publication is already a complete COLP server.</text>
</svg>
