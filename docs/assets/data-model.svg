<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Data model</title>
<desc id="desc">A Collection is an ordered tree of Nodes, plus sidecar data that browsers cannot store.</desc>
<style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Noto Sans Mono', 'Droid Sans Fallback', monospace}.frame{fill:#ffffff;stroke:#d0d7de}.card{fill:#f6f8fa;stroke:#d0d7de}.inner{fill:#ffffff;stroke:#d8dee4}.h{fill:#1f2328;font-weight:700}.b{fill:#1f2328}.m{fill:#59636e}.ln{stroke:#8c959f;fill:none}.lnf{fill:#8c959f}@media (prefers-color-scheme: dark){.frame{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.inner{fill:#0d1117;stroke:#3d444d}.h,.b{fill:#e6edf3}.m{fill:#9198a1}.ln{stroke:#6e7681}.lnf{fill:#6e7681}}</style>
<defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="lnf"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="999" height="499" rx="16"/>
<text class="h" x="32" y="48" font-size="21">Data model</text>
<text class="m" x="32" y="74" font-size="14">A Collection is an ordered tree of Nodes, plus sidecar data that browsers cannot store.</text>
<rect class="card" x="24" y="100" width="560" height="324" rx="16"/><path class="ln" d="M60 149V174H74" stroke-width="1.5"/><path class="ln" d="M90 185V210H104" stroke-width="1.5"/><path class="ln" d="M120 221V246H134" stroke-width="1.5"/><path class="ln" d="M120 221V282H134" stroke-width="1.5"/><path class="ln" d="M120 221V318H134" stroke-width="1.5"/><path class="ln" d="M90 185V354H104" stroke-width="1.5"/><path class="ln" d="M120 365V390H134" stroke-width="1.5"/><rect x="48" y="127" width="89" height="22" rx="11" fill="#6366F1" fill-opacity="0.13" stroke="#6366F1" stroke-opacity="0.55"/><text x="92.5" y="142.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6366F1" class="mono">collection</text><text class="b" x="147" y="143" font-size="14" font-weight="700">Interface Systems</text><text class="m mono" x="304.00160000000005" y="142" font-size="11.5">visibility: public</text><rect x="78" y="163" width="48" height="22" rx="11" fill="#64748B" fill-opacity="0.13" stroke="#64748B" stroke-opacity="0.55"/><text x="102" y="178.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748B" class="mono">root</text><rect x="108" y="199" width="61" height="22" rx="11" fill="#F59E0B" fill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.55"/><text x="138.5" y="214.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F59E0B" class="mono">folder</text><text class="b" x="179" y="215" font-size="14">Bookmarks bar</text><text class="m mono" x="294.80240000000003" y="214" font-size="11.5">bookmarks-bar</text><rect x="138" y="235" width="75" height="22" rx="11" fill="#0EA5E9" fill-opacity="0.13" stroke="#0EA5E9" stroke-opacity="0.55"/><text x="175.5" y="250.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0EA5E9" class="mono">bookmark</text><text class="b" x="223" y="251" font-size="14">Design Tokens</text><text class="m mono" x="340.2864" y="250" font-size="11.5">url · tags · position</text><rect x="138" y="271" width="82" height="22" rx="11" fill="#64748B" fill-opacity="0.13" stroke="#64748B" stroke-opacity="0.55"/><text x="179" y="286.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748B" class="mono">separator</text><rect x="138" y="307" width="55" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.13" stroke="#8B5CF6" stroke-opacity="0.55"/><text x="165.5" y="322.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8B5CF6" class="mono">alias</text><text class="b" x="203" y="323" font-size="14">→ Motion Guide</text><rect x="108" y="343" width="61" height="22" rx="11" fill="#F59E0B" fill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.55"/><text x="138.5" y="358.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F59E0B" class="mono">folder</text><text class="b" x="179" y="359" font-size="14">Other bookmarks</text><text class="m mono" x="310.8296" y="358" font-size="11.5">other-bookmarks</text><rect x="138" y="379" width="75" height="22" rx="11" fill="#0EA5E9" fill-opacity="0.13" stroke="#0EA5E9" stroke-opacity="0.55"/><text x="175.5" y="394.14" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0EA5E9" class="mono">bookmark</text><text class="b" x="223" y="395" font-size="14">Motion Guide</text>
<path class="ln" d="M548 246C590 246 580 150 618 150" stroke-width="1.5" stroke-dasharray="4 4"/><rect class="card" x="620" y="100" width="356" height="98" rx="14"/><rect x="620" y="118" width="4" height="62" rx="2" fill="#F43F5E"/><text class="h" x="640" y="130" font-size="15">Annotation</text><text class="mono" x="640" y="154" font-size="11.5" fill="#F43F5E">note · summary · highlight · rating</text><text class="m" x="640" y="178" font-size="12.5">Notes on any node, with provenance for AI notes.</text><path class="ln" d="M548 246C590 246 580 264 618 264" stroke-width="1.5" stroke-dasharray="4 4"/><rect class="card" x="620" y="214" width="356" height="98" rx="14"/><rect x="620" y="232" width="4" height="62" rx="2" fill="#14B8A6"/><text class="h" x="640" y="244" font-size="15">Attachment</text><text class="mono" x="640" y="268" font-size="11.5" fill="#14B8A6">rel · url · mimeType · digest</text><text class="m" x="640" y="292" font-size="12.5">Metadata for files and page captures.</text><path class="ln" d="M548 246C590 246 580 378 618 378" stroke-width="1.5" stroke-dasharray="4 4"/><rect class="card" x="620" y="328" width="356" height="98" rx="14"/><rect x="620" y="346" width="4" height="62" rx="2" fill="#65A30D"/><text class="h" x="640" y="358" font-size="15">Relation</text><text class="mono" x="640" y="382" font-size="11.5" fill="#65A30D">related · supports · derived_from · …</text><text class="m" x="640" y="406" font-size="12.5">Typed links between two nodes.</text><circle cx="548" cy="246" r="3.5" class="lnf"/>
<text class="m" x="32" y="458" font-size="13">Order uses opaque position keys, so concurrent inserts never renumber siblings.</text><text class="m" x="32" y="480" font-size="13">Deletes leave tombstones, so every replica learns about them before they are purged.</text>
</svg>
