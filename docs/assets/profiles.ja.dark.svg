<text x="58" y="96" font-size="16" font-weight="700" fill="#a5b4fc" class="mono">core</text>
<text x="58" y="118" font-size="14" fill="#9198a1">データモデルと Snapshot</text>
<rect x="274" y="70" width="210" height="60" rx="12" fill="#151b23" stroke="#3d444d"/>
<rect x="286" y="82" width="4" height="36" rx="2" fill="#38bdf8"/>
<text x="300" y="96" font-size="16" font-weight="700" fill="#7dd3fc" class="mono">publication</text>
<text x="300" y="118" font-size="14" fill="#9198a1">探索と読み取り API</text>
<rect x="516" y="70" width="210" height="60" rx="12" fill="#151b23" stroke="#3d444d"/>
<rect x="528" y="82" width="4" height="36" rx="2" fill="#fbbf24"/>
