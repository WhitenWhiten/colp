<text x="784" y="216" font-size="16" font-weight="700" fill="#d8b4fe" class="mono">mcp-write</text>
<text x="784" y="238" font-size="14" fill="#9198a1">承認付きの AI 書き込み</text>
<text x="32" y="404" font-size="14" fill="#9198a1">各プロファイルは、矢印の出元にあるプロファイルの上に成り立ちます。サーバーは完全に満たすプロファイルだけを宣言します。</text>
