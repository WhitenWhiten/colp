<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">双向同步</title>
<desc id="desc">副本之间交换的是操作，而不是整棵树。每一步都幂等，可以安全重试。</desc>
<style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Droid Sans Fallback', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Noto Sans Mono', 'Droid Sans Fallback', monospace}.frame{fill:#ffffff;stroke:#d0d7de}.card{fill:#f6f8fa;stroke:#d0d7de}.inner{fill:#ffffff;stroke:#d8dee4}.h{fill:#1f2328;font-weight:700}.b{fill:#1f2328}.m{fill:#59636e}.ln{stroke:#8c959f;fill:none}.lnf{fill:#8c959f}@media (prefers-color-scheme: dark){.frame{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.inner{fill:#0d1117;stroke:#3d444d}.h,.b{fill:#e6edf3}.m{fill:#9198a1}.ln{stroke:#6e7681}.lnf{fill:#6e7681}}</style>
<defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#6366F1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="lnf"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="999" height="629" rx="16"/>
<text class="h" x="32" y="48" font-size="21">双向同步</text>
<text class="m" x="32" y="74" font-size="14">副本之间交换的是操作，而不是整棵树。每一步都幂等，可以安全重试。</text>
<rect class="card" x="50" y="98" width="300" height="62" rx="14"/><rect x="50" y="98" width="300" height="5" rx="2.5" fill="#EC4899"/><text class="h" x="200" y="126" font-size="16" text-anchor="middle">浏览器副本</text><text class="m" x="200" y="147" font-size="12.5" text-anchor="middle">适配器 + 本地 Sidecar</text><rect class="card" x="650" y="98" width="300" height="62" rx="14"/><rect x="650" y="98" width="300" height="5" rx="2.5" fill="#6366F1"/><text class="h" x="800" y="126" font-size="16" text-anchor="middle">COLP 服务器</text><text class="m" x="800" y="147" font-size="12.5" text-anchor="middle">权威状态 + 操作日志</text><line class="ln" x1="200" y1="160" x2="200" y2="600" stroke-width="1.5" stroke-dasharray="5 5"/><line class="ln" x1="800" y1="160" x2="800" y2="600" stroke-width="1.5" stroke-dasharray="5 5"/><line class="ln" x1="204" y1="214" x2="794" y2="214" stroke-width="2" marker-end="url(#arrow)"/><circle cx="464.64" cy="198" r="10" fill="#EC4899"/><text x="464.64" y="202" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text class="h" x="482.64" y="203" font-size="14">打开会话</text><text class="m" x="500" y="234" font-size="12" text-anchor="middle">副本绑定、作用域、协议版本</text><text class="m mono" x="812" y="218" font-size="11">syncSessions</text><line class="ln" x1="796" y1="288" x2="206" y2="288" stroke-width="2" marker-end="url(#arrow)"/><circle cx="472.48" cy="272" r="10" fill="#6366F1"/><text x="472.48" y="276" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text class="h" x="490.48" y="277" font-size="14">初始化</text><text class="m" x="500" y="308" font-size="12" text-anchor="middle">一份完整的 Sync Snapshot</text><text class="m mono" x="812" y="292" font-size="11">syncSnapshot</text><rect class="inner" x="60" y="334" width="420" height="48" rx="12" stroke-dasharray="4 3"/><text class="b" x="270" y="364" font-size="13" text-anchor="middle">用户编辑书签 → 本地队列中的操作（seq 1, 2, 3）</text><line class="ln" x1="204" y1="434" x2="794" y2="434" stroke-width="2" marker-end="url(#arrow)"/><circle cx="464.64" cy="418" r="10" fill="#EC4899"/><text x="464.64" y="422" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text class="h" x="482.64" y="423" font-size="14">推送操作</text><text class="m" x="500" y="454" font-size="12" text-anchor="middle">逐条结果：applied · rebased · conflicted</text><text class="m mono" x="812" y="438" font-size="11">syncPush</text><line class="ln" x1="796" y1="504" x2="206" y2="504" stroke-width="2" marker-end="url(#arrow)"/><circle cx="464.64" cy="488" r="10" fill="#6366F1"/><text x="464.64" y="492" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text class="h" x="482.64" y="493" font-size="14">拉取变更</text><text class="m" x="500" y="524" font-size="12" text-anchor="middle">游标之后的操作与冲突</text><text class="m mono" x="812" y="508" font-size="11">syncPull</text><line class="ln" x1="204" y1="574" x2="794" y2="574" stroke-width="2" marker-end="url(#arrow)"/><circle cx="464.64" cy="558" r="10" fill="#EC4899"/><text x="464.64" y="562" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text class="h" x="482.64" y="563" font-size="14">确认进度</text><text class="m" x="500" y="594" font-size="12" text-anchor="middle">服务器据此清理旧墓碑</text><text class="m mono" x="812" y="578" font-size="11">syncAck</text>
</svg>
