<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">How COLP fits together</title>
<desc id="desc">Four kinds of clients connect to one COLP server, each through its own profile. Browser bookmarks sync with it; apps and scripts write to it through publisher; readers and websites read snapshots and feeds through publication and feed; AI assistants use it through mcp-read and mcp-write. The server exposes a Manifest, the data model, a change log, and security.</desc>
