<text x="40" y="52" font-size="22" font-weight="700" fill="#f0f6fc">How COLP fits together</text>
<text x="40" y="80" font-size="15" fill="#9198a1">One server, four kinds of clients. Each connection is a profile you can implement on its own.</text>
