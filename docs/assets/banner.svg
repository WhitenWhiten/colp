<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">The Collection Protocol (COLP)</title>
<desc id="desc">An open protocol for bookmarks and knowledge collections. Publish them, sync them, and let AI curate them, under your control.</desc>
