<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="476" viewBox="0 0 1000 476" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">COLP 数据模型</title>
<desc id="desc">一个 Collection 包含根节点、文件夹、书签、分隔线与别名；批注、附件与关系作为附加数据挂在节点上。</desc>
