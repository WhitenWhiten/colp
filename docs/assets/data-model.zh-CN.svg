<text x="642" y="214" font-size="13" fill="#047857" class="mono">rel · url · mimeType · digest</text>
<text x="642" y="238" font-size="14" fill="#59636e">文件与网页存档的元数据</text>
<path d="M546 188C576 188 582 323 612 323" fill="none" stroke="#818b98" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="612" y="274" width="360" height="98" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="626" y="290" width="4" height="66" rx="2" fill="#8b5cf6"/>
<text x="642" y="304" font-size="16" font-weight="700" fill="#1f2328">Relation 关系</text>
<text x="642" y="328" font-size="13" fill="#6d28d9" class="mono">related · supports · derived_from · …</text>
<text x="642" y="352" font-size="14" fill="#59636e">两个节点之间的类型化链接</text>
<circle cx="546" cy="188" r="4" fill="#818b98"/>
<text x="28" y="424" font-size="14" fill="#59636e">顺序使用不透明的 position 键，并发插入不会让兄弟节点重新编号。</text>
<text x="28" y="446" font-size="14" fill="#59636e">删除会留下墓碑，确保每个副本在清理前都能得知删除。</text>
</svg>
