<text x="642" y="100" font-size="13" fill="#be185d" class="mono">note · summary · highlight · rating</text>
<text x="642" y="124" font-size="14" fill="#59636e">可附在任意节点上；AI 生成的批注带有来源信息</text>
<path d="M546 188C576 188 582 209 612 209" fill="none" stroke="#818b98" stroke-width="1.5" stroke-dasharray="4 4"/>
