<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">COLP 一致性 Profile</title>
<desc id="desc">Profile 依赖图：publication、sync、mcp-read 建立在 core 之上；feed 与 publisher 建立在 publication 之上；mcp-write 建立在 mcp-read 与 publisher 之上。core 与 publication 合起来就是完整的静态服务器。</desc>
