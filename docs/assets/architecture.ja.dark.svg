<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">COLP の全体像</title>
<desc id="desc">4 種類のクライアントが、それぞれのプロファイルを通じて 1 つの COLP サーバーにつながります。ブラウザーのブックマークは sync で同期し、アプリとスクリプトは publisher で書き込み、リーダーと Web サイトは publication と feed でスナップショットとフィードを読み、AI アシスタントは mcp-read と mcp-write で利用します。サーバーは Manifest、データモデル、変更ログ、セキュリティを提供します。</desc>
<style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}</style>
<defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
