<text x="642" y="328" font-size="13" fill="#c4b5fd" class="mono">related · supports · derived_from · …</text>
<text x="642" y="352" font-size="14" fill="#9198a1">2 つのノードをつなぐ型付きリンク</text>
<circle cx="546" cy="188" r="4" fill="#656c76"/>
<text x="28" y="424" font-size="14" fill="#9198a1">並び順は不透明な position キーで表すため、同時に挿入しても兄弟ノードの番号は振り直されません。</text>
<text x="28" y="446" font-size="14" fill="#9198a1">削除はトゥームストーンを残すため、どのレプリカも完全に消える前に削除を知ることができます。</text>
