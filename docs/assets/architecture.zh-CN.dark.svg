<rect x="732" y="374" width="208" height="68" rx="12" fill="#0d1117" stroke="#3d444d"/>
<rect x="746" y="390" width="4" height="36" rx="2" fill="#34d399"/>
<text x="762" y="404" font-size="15" font-weight="700" fill="#f0f6fc">安全</text>
