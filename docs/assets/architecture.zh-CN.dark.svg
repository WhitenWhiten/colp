<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">COLP 的整体结构</title>
<desc id="desc">四类客户端通过各自的 Profile 连接到同一个 COLP 服务器：浏览器书签与它同步；应用与脚本通过 publisher 写入；阅读器与网站通过 publication 和 feed 读取快照与订阅；AI 助手通过 mcp-read 和 mcp-write 使用它。服务器提供 Manifest、数据模型、变更日志与安全层。</desc>
<style>text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}</style>
