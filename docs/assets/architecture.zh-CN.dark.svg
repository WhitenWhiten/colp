<text x="40" y="52" font-size="22" font-weight="700" fill="#f0f6fc">COLP 的整体结构</text>
<text x="40" y="80" font-size="15" fill="#9198a1">一个服务器，四类客户端。每种连接都是可以单独实现的 Profile。</text>
