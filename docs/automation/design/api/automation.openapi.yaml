          - type: 'null'
      required:
      - items
      - nextCursor
      additionalProperties: false
    PauseInput:
      type: object
      properties:
        paused:
          type: boolean
        reason:
          type: string
          maxLength: 1000
      required:
      - paused
      additionalProperties: false
    PauseState:
      type: object
      properties:
        paused:
          type: boolean
        pausedAt:
          type:
          - string
          - 'null'
          format: date-time
        pausedBy:
          type:
          - string
          - 'null'
          enum:
          - owner
          - restore
          - capacity
          - null
        revision:
          $ref: '#/components/schemas/Revision'
        heldJobs:
          type: integer
          minimum: 0
      required:
      - paused
      - pausedAt
      - pausedBy
      - revision
      - heldJobs
      additionalProperties: false
    RunOnceInput:
      type: object
      properties:
        folder:
          $ref: '#/components/schemas/FolderRef'
        includeDescendants:
          type: boolean
        moveFolderedBookmarks:
          type: boolean
          description: 'Also move bookmarks that already sit in a non-root folder. Default false: those count as
            the Owner''s choice.'
        tasks:
          type: string
          enum:
          - none
          - all
      required:
      - folder
      - includeDescendants
      - moveFolderedBookmarks
      - tasks
      additionalProperties: false
    RunOnceSampleItem:
      type: object
      properties:
        nodeId:
          $ref: '#/components/schemas/OpaqueId'
        title:
          type: string
          maxLength: 500
        decision:
          type: string
          enum:
          - matched
          - blocked
          - explicitChoice
          - notMatched
        reason:
          type: string
          maxLength: 500
      required:
      - nodeId
      - title
      - decision
      additionalProperties: false
    RunOncePreview:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        matchedCount:
          type: integer
          minimum: 0
        blockedCount:
          type: integer
          minimum: 0
        explicitChoiceCount:
          type: integer
          minimum: 0
        maxMembers:
          type: integer
          minimum: 1
          maximum: 1000
        sample:
          type: array
          items:
            $ref: '#/components/schemas/RunOnceSampleItem'
          maxItems: 20
        expiresAt:
          type: string
          format: date-time
        sideEffects:
          const: false
        previewDigest:
          type: string
          minLength: 1
          maxLength: 64
        canStart:
          type: boolean
      required:
      - id
      - matchedCount
      - blockedCount
      - explicitChoiceCount
      - maxMembers
      - sample
      - expiresAt
      - sideEffects
      - previewDigest
      - canStart
      additionalProperties: false
    AutomationExportRule:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/PortableRuleDefinition'
        desiredState:
          type: string
          enum:
          - draft
          - enabled
          - paused
          - archived
          description: Historical source state only. An importer MUST create draft, never activate from this value.
        bindingsByPath:
          type: object
          additionalProperties:
            type: string
            maxLength: 2000
          description: Role key to folder path at export time; targets and secrets are never exported.
      required:
      - rule
      - desiredState
      - bindingsByPath
      additionalProperties: false
    AutomationExport:
      type: object
      properties:
        contractVersion:
          const: 0.2.1-design
        exportedAt:
          type: string
          format: date-time
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AutomationExportRule'
          maxItems: 500
      required:
      - contractVersion
      - exportedAt
      - rules
      additionalProperties: false
    EffectReceiptView:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          enum:
          - placement
          - plan
        status:
          type: string
          enum:
          - committed
          - reverted
          - unavailable
        effectDigest:
          type: string
          minLength: 1
          maxLength: 64
        operationId:
          $ref: '#/components/schemas/OpaqueId'
        planId:
          $ref: '#/components/schemas/OpaqueId'
        undoAvailable:
          type: boolean
        undoReason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - id
      - kind
      - status
      - effectDigest
      - operationId
      - undoAvailable
      - undoReason
      additionalProperties: false
    RunOnceStartInput:
      type: object
      properties:
        previewId:
          $ref: '#/components/schemas/OpaqueId'
        previewDigest:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - previewId
      - previewDigest
      additionalProperties: false
      description: Start exactly the unexpired persisted preview snapshot, bound to owner, rule, bindings, policy,
        member IDs/revisions and options. Request command ID supplies idempotency. Changed inputs require a fresh
        preview, never silent re-query.
    RunOutputView:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        jobId:
          $ref: '#/components/schemas/OpaqueId'
        targetId:
          $ref: '#/components/schemas/OpaqueId'
        output:
          $ref: '#/components/schemas/TextOutput'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - jobId
      - targetId
      - output
      - createdAt
      additionalProperties: false
    RunOutputPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunOutputView'
          maxItems: 100
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 2048
          - type: 'null'
      required:
      - items
      - nextCursor
      additionalProperties: false
    MarkRunReadInput:
      type: object
      properties:
        throughOutputId:
          $ref: '#/components/schemas/OpaqueId'
      required:
      - throughOutputId
      additionalProperties: false
      description: Marks only this run output and earlier visible outputs read, so a concurrent later output stays
        unread.
    PortableScopeSpec:
      type: object
      properties:
        folderRole:
          type: string
          maxLength: 80
        includeDescendants:
          type: boolean
        collectionSlot:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - collectionSlot
      additionalProperties: false
    PortableRouteSpec:
      type: object
      properties:
        mode:
          type: string
          enum:
          - targets
          - broadcast
        audience:
          type: string
          enum:
          - optedInAuthorizedTargets
        execution:
          type: string
          enum:
          - single
          - firstClaim
          - perTarget
        targetSlots:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 20
      required:
      - mode
      - execution
      additionalProperties: false
    PortableRuleDefinition:
      type: object
      properties:
        apiVersion:
          const: colp.automation/v1
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDeclaration'
          maxItems: 32
        'on':
          type: string
          enum:
          - bookmark.intake
          - node.created
          - node.updated
          - intake.completed
          - bookmark.link_health.changed
        scope:
          $ref: '#/components/schemas/PortableScopeSpec'
        match:
          $ref: '#/components/schemas/Predicate'
        intake:
          $ref: '#/components/schemas/IntakeSpec'
        trigger:
          $ref: '#/components/schemas/TriggerSpec'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskSpec'
          maxItems: 8
        route:
          $ref: '#/components/schemas/PortableRouteSpec'
        policy:
          $ref: '#/components/schemas/RulePolicy'
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
      required:
      - apiVersion
      - name
      - roles
      - 'on'
      - scope
      - match
      - trigger
      - tasks
      - route
      - policy
      - priority
      additionalProperties: false
      description: Template/export logic before installation. collectionSlot and targetSlots are symbolic; no live
        collection or target IDs. Resolve with Owner review into a draft RuleDefinition before validation/activation.
    RuleUsageView:
      type: object
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        admittedRuns:
          type: integer
          minimum: 0
        readyJobs:
          type: integer
          minimum: 0
        succeededJobs:
          type: integer
          minimum: 0
        heldJobs:
          type: integer
          minimum: 0
        heldRuns:
          type: integer
          minimum: 0
          description: Runs with remaining work explicitly held by the Owner.
        externalCosts:
          type: string
          enum:
          - notApplicable
          - unknownDisclosed
          - known
        costDisplay:
          type: string
          maxLength: 500
      required:
      - periodStart
      - periodEnd
      - admittedRuns
      - readyJobs
      - succeededJobs
      - heldJobs
      - externalCosts
      - costDisplay
      additionalProperties: false
  parameters:
    CommandId:
      in: header
      name: Known-Command-Id
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 1
      description: 'Stable command identity. Scope: authenticated principal + operation + addressed resource. Same
        identity/different canonical body returns 409.'
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        maxLength: 160
      description: Strong ETag from the addressed automation resource, never a node publication revision.
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 2048
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Csrf:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        maxLength: 1024
      description: 'Verified host CSRF header (evidence R23): the server reads `x-csrf-token` together with the
        Origin allowlist on cookie-authenticated writes. Re-checked at AW-01. Never introduce a second CSRF scheme.'
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
        maxLength: 2048
        format: uri
      description: Validate against existing host trusted-origin policy for cookie-authenticated mutations.
  securitySchemes:
    HostSession:
      type: apiKey
      in: header
      name: Cookie
      description: Documentation placeholder for the existing host session cookie collection; this does not define
        a new cookie name or login mechanism. Use the existing Product session resolver.
    DeviceBearer:
      type: http
      scheme: bearer
      description: Host-authenticated device or registered internal executor bearer, with operation-specific automation
        scopes. MCP worker tools use MCP OAuth instead; this is not an extra login system.
  responses:
    '400':
      description: Malformed input or invalid rule.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '401':
      description: Authentication required.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '403':
      description: Current authority or host-mode policy denies operation.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '404':
      description: Unknown, disabled or concealed resource.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '409':
      description: Conflict, stale inputs, unavailable binding or command-body mismatch.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '412':
      description: ETag does not match.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '413':
      description: Payload too large.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '422':
      description: Well-formed input violates a declared semantic constraint.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '428':
      description: Required revision precondition missing.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '429':
      description: Rate or work budget exhausted.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '500':
      description: Internal failure with a non-sensitive request identifier.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    '503':
      description: Required service unavailable.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
