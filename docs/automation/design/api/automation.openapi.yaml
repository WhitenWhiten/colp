                const: private, no-store
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9._~-]+$
            ETag:
              schema:
                type: string
                maxLength: 160
              description: Strong ETag for this automation resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '428':
          $ref: '#/components/responses/428'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkRunReadInput'
  /api/v1/automation-work/pairings/claim:
    post:
      operationId: claimAutomationTargetPairing
      tags:
      - Work
      summary: Redeem the Owner-issued pairing grant as the authenticated opted-in worker
      description: Only pre-pair work endpoint. Does not require a bound target or manager scope; DOES require authenticated
        automationWorker opt-in, automation:work scope and atomic one-use grant bound to the Owner, target and expected
        credential/client binding. Rate limit invalid codes; successful retries of the same command return the original
        result.
      x-delivery-phase: M2
      parameters:
      - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: Successful response; inspect the returned state, not merely the HTTP status.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9._~-]+$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '428':
          $ref: '#/components/responses/428'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingClaimInput'
      security:
      - DeviceBearer: []
components:
  schemas:
    OpaqueId:
      type: string
      maxLength: 128
      minLength: 1
      pattern: ^[A-Za-z0-9._~-]+$
    Revision:
      type: string
      maxLength: 128
      minLength: 1
    FolderRef:
      type: object
      properties:
        serverUuid:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        collectionId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        nodeId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
      required:
      - serverUuid
      - collectionId
      - nodeId
      additionalProperties: false
    RoleDeclaration:
      type: object
      properties:
        key:
          type: string
          maxLength: 80
          pattern: ^[a-z][A-Za-z0-9]*$
        kind:
          type: string
          enum:
          - folder
          - executor
          - entityMap
          - vocabulary
        required:
          type: boolean
        description:
          type: string
          maxLength: 1000
        mustBeWithinRole:
          type: string
          maxLength: 80
      required:
      - key
      - kind
      - required
      - description
      additionalProperties: false
    FolderBinding:
      type: object
      properties:
        kind:
          const: folder
        folder:
          $ref: '#/components/schemas/FolderRef'
        followIdentity:
          const: true
        allowedAncestor:
          $ref: '#/components/schemas/FolderRef'
        onUnavailable:
          type: string
          enum:
          - block
          - keepOriginal
        notifyOn:
          type: array
          items:
            type: string
            enum:
            - rename
            - move
            - delete
            - permission
            - syncScope
          maxItems: 5
      required:
      - kind
      - folder
      - followIdentity
      - onUnavailable
      - notifyOn
      additionalProperties: false
    ExecutorBinding:
      type: object
      properties:
        kind:
          const: executor
        executorId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        targetSelector:
          type: string
          enum:
          - selectedAuthorizedTargets
          - optedInAuthorizedTargets
      required:
      - kind
      additionalProperties: false
      oneOf:
      - required:
        - executorId
        not:
          required:
          - targetSelector
      - required:
        - targetSelector
        not:
          required:
          - executorId
    EntityDestination:
      type: object
      properties:
        entityKey:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 200
        aliases:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 20
        folder:
          $ref: '#/components/schemas/FolderRef'
      required:
      - entityKey
      - label
      - folder
      additionalProperties: false
    EntityMapBinding:
      type: object
      properties:
        kind:
          const: entityMap
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EntityDestination'
          maxItems: 1000
        onUnmapped:
          type: string
          enum:
          - keepParent
          - review
        onMultiple:
          type: string
          enum:
          - review
          - primaryMapping
      required:
      - kind
      - entries
      - onUnmapped
      - onMultiple
      additionalProperties: false
    VocabularyEntry:
      type: object
      properties:
        key:
          type: string
          maxLength: 80
        label:
          type: string
          maxLength: 100
      required:
      - key
      - label
      additionalProperties: false
    VocabularyBinding:
      type: object
      properties:
        kind:
          const: vocabulary
        entries:
          type: array
          items:
            $ref: '#/components/schemas/VocabularyEntry'
          maxItems: 500
      required:
      - kind
      - entries
      additionalProperties: false
    RoleBinding:
      oneOf:
      - $ref: '#/components/schemas/FolderBinding'
      - $ref: '#/components/schemas/ExecutorBinding'
      - $ref: '#/components/schemas/EntityMapBinding'
      - $ref: '#/components/schemas/VocabularyBinding'
    RoleBindings:
      type: object
      maxProperties: 32
      propertyNames:
        pattern: ^[a-z][A-Za-z0-9]*$
      additionalProperties:
        $ref: '#/components/schemas/RoleBinding'
    BindingSetInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        values:
          $ref: '#/components/schemas/RoleBindings'
      required:
      - name
      - values
      additionalProperties: false
    BindingSet:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        revision:
          type: string
          maxLength: 128
          minLength: 1
        name:
          type: string
          maxLength: 200
        values:
          $ref: '#/components/schemas/RoleBindings'
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - revision
      - name
      - values
      - updatedAt
      additionalProperties: false
    FieldPredicate:
      type: object
      properties:
        kind:
          const: field
        field:
          type: string
          enum:
          - bookmark.url.host
          - bookmark.url.path
          - bookmark.title
          - bookmark.tags
          - bookmark.kind
          - event.type
          - event.origin
          - event.changedFields
        op:
          type: string
          enum:
          - eq
          - in
          - contains
          - hostSuffix
          - hasTag
          - startsWith
        value:
          oneOf:
          - type: string
            maxLength: 1024
          - type: array
            items:
              type: string
              maxLength: 200
            maxItems: 100
      required:
      - kind
      - field
      - op
      - value
      additionalProperties: false
      description: Operator/field compatibility is checked semantically. startsWith is literal case-sensitive prefix
        comparison on normalized URL path; never substring search or an artificial UI anchor.
    AllPredicate:
      type: object
      properties:
        kind:
          const: all
        items:
          type: array
          items:
            $ref: '#/components/schemas/Predicate'
          maxItems: 32
      required:
      - kind
      - items
      additionalProperties: false
    AnyPredicate:
      type: object
      properties:
        kind:
          const: any
        items:
          type: array
          items:
            $ref: '#/components/schemas/Predicate'
          maxItems: 32
      required:
      - kind
      - items
      additionalProperties: false
    NotPredicate:
      type: object
      properties:
        kind:
          const: not
        item:
          $ref: '#/components/schemas/Predicate'
      required:
      - kind
      - item
      additionalProperties: false
    CelPredicate:
      type: object
      properties:
        kind:
          const: cel
        expression:
          type: string
          maxLength: 4096
          minLength: 1
        profile:
          const: colp-cel-v1
        dependencies:
          type: array
          items:
            type: string
            maxLength: 128
          maxItems: 64
      required:
      - kind
      - expression
      - profile
      - dependencies
      additionalProperties: false
    Predicate:
      oneOf:
      - $ref: '#/components/schemas/FieldPredicate'
      - $ref: '#/components/schemas/AllPredicate'
      - $ref: '#/components/schemas/AnyPredicate'
      - $ref: '#/components/schemas/NotPredicate'
      - $ref: '#/components/schemas/CelPredicate'
    ScopeSpec:
      type: object
      properties:
        collectionId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        folderRole:
          type: string
          maxLength: 80
        includeDescendants:
          type: boolean
      required: []
      additionalProperties: false
    EachTrigger:
      type: object
      properties:
        mode:
          const: each
      required:
      - mode
      additionalProperties: false
    CountTrigger:
      type: object
      properties:
        mode:
          const: countBatch
        count:
          type: integer
          minimum: 2
          maximum: 1000
        distinctBy:
          type: string
          enum:
          - node
          - normalizedUrl
        partition:
          type: string
          enum:
          - rule
          - collection
          - folder
      required:
      - mode
      - count
      - distinctBy
      - partition
      additionalProperties: false
    ScheduleTrigger:
      type: object
      properties:
        mode:
          const: scheduledBatch
        cron:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 100
        nonEmptyOnly:
          const: true
        misfire:
          type: string
          enum:
          - coalesce
          - skip
        dst:
          const: skipMissingOnceRepeated
      required:
      - mode
      - cron
      - timezone
      - nonEmptyOnly
      - misfire
      - dst
      additionalProperties: false
      description: Later-milestone capability (AU-32); reject with unsupported_capability until mounted. Five-field
        cron.
    TriggerSpec:
      oneOf:
      - $ref: '#/components/schemas/EachTrigger'
      - $ref: '#/components/schemas/CountTrigger'
      - $ref: '#/components/schemas/ScheduleTrigger'
    IntakeSpec:
      type: object
      properties:
        folderRole:
          type: string
          maxLength: 80
        constraint:
          type: string
          enum:
          - exact
          - withinSubtree
        satisfies:
          type: array
          items:
            type: string
            enum:
            - classify.root
          maxItems: 1
        onUnusableBinding:
          const: keepOriginalAndBlock
        respectExplicitSelection:
          const: true
      required:
      - folderRole
      - constraint
      - satisfies
      - onUnusableBinding
      - respectExplicitSelection
      additionalProperties: false
    TaskSpec:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        type:
          type: string
          enum:
          - classify.root
          - classify.refine
          - tags.generate
          - summary.generate
          - metadata.resolve
          - review.generate
          - digest.generate
        after:
          type: array
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
          maxItems: 8
          uniqueItems: true
        executorRole:
          type: string
          maxLength: 80
        folderRole:
          type: string
          maxLength: 80
        entityMapRole:
          type: string
          maxLength: 80
        vocabularyRole:
          type: string
          maxLength: 80
        required:
          type: boolean
        outputContract:
          type: string
          maxLength: 100
        inputFields:
          type: array
          items:
            type: string
            enum:
            - url
            - title
            - description
            - note
            - tags
            - metadata
            - readableText
            - folderDefinitions
          maxItems: 8
          uniqueItems: true
        instruction:
          type: string
          maxLength: 3000
        allowCreateFolder:
          type: boolean
      required:
      - id
      - type
      - after
      - executorRole
      - required
      - outputContract
      - inputFields
      - instruction
      additionalProperties: false
    RouteSpec:
      type: object
      properties:
        mode:
          type: string
          enum:
          - targets
          - broadcast
        targetIds:
          type: array
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
          maxItems: 20
        audience:
          type: string
          enum:
          - optedInAuthorizedTargets
        execution:
          type: string
          enum:
          - single
          - firstClaim
          - perTarget
      required:
      - mode
      - execution
      additionalProperties: false
    RulePolicy:
      type: object
      properties:
        history:
          const: fromActivation
        imports:
          type: string
          enum:
          - exclude
          - include
        restores:
          const: exclude
        userEdits:
          const: preserve
        sameStageReentry:
          const: deny
        maxHops:
          type: integer
          minimum: 1
          maximum: 16
        conflictingPlacement:
          const: review
        privacy:
          type: string
          enum:
          - standard
          - restricted
        broadcastAllowed:
          type: boolean
        maxRunsPerDay:
          type: integer
          minimum: 1
          maximum: 10000
        pauseMode:
          const: stopAdmissionHoldPending
        missingInput:
          type: string
          enum:
          - defer
          - review
      required:
      - history
      - imports
      - restores
      - userEdits
      - sameStageReentry
      - maxHops
      - conflictingPlacement
      - privacy
      - broadcastAllowed
      - maxRunsPerDay
      - pauseMode
      - missingInput
      additionalProperties: false
    RuleDefinition:
      type: object
      properties:
        apiVersion:
          const: colp.automation/v1
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDeclaration'
          maxItems: 32
        'on':
          type: string
          enum:
          - bookmark.intake
          - node.created
          - node.updated
          - intake.completed
          - bookmark.link_health.changed
        scope:
          $ref: '#/components/schemas/ScopeSpec'
        match:
          $ref: '#/components/schemas/Predicate'
        intake:
          $ref: '#/components/schemas/IntakeSpec'
        trigger:
          $ref: '#/components/schemas/TriggerSpec'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskSpec'
          maxItems: 8
        route:
          $ref: '#/components/schemas/RouteSpec'
        policy:
          $ref: '#/components/schemas/RulePolicy'
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
      required:
      - apiVersion
      - name
      - roles
      - 'on'
      - scope
      - match
      - trigger
      - tasks
      - route
      - policy
      - priority
      additionalProperties: false
    RuleInput:
      type: object
      properties:
        definition:
          $ref: '#/components/schemas/RuleDefinition'
        bindingSetId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        executionPolicyId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          description: Required by semantic validation only when admitted tasks need an M2+ executor. Absent for
            deterministic M1 placement; no dummy policy record.
        templateRef:
          type: string
          maxLength: 256
      required:
      - definition
      - bindingSetId
      additionalProperties: false
    Rule:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        revision:
          type: string
          maxLength: 128
          minLength: 1
        desiredState:
          type: string
          enum:
          - draft
          - enabled
          - paused
          - archived
        effectiveState:
          type: string
          enum:
          - draft
          - active
          - degraded
          - blocked
          - paused
          - archived
        definition:
          $ref: '#/components/schemas/RuleDefinition'
        bindingSetId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        executionPolicyId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          description: Required by semantic validation only when admitted tasks need an M2+ executor. Absent for
            deterministic M1 placement; no dummy policy record.
        templateRef:
          type: string
          maxLength: 256
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        usage:
          $ref: '#/components/schemas/RuleUsageView'
          description: M2 read-only backend projection; absent in M1. Not editable configuration.
      required:
      - id
      - revision
      - desiredState
      - effectiveState
      - definition
      - bindingSetId
      - createdAt
      - updatedAt
      additionalProperties: false
    Diagnostic:
      type: object
      properties:
        code:
          type: string
          maxLength: 100
        severity:
          type: string
          enum:
          - info
          - warning
          - error
        location:
          type: string
          maxLength: 500
        message:
          type: string
          maxLength: 2000
        role:
          type: string
          maxLength: 80
      required:
      - code
      - severity
      - location
      - message
      additionalProperties: false
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        normalizedDefinition:
          $ref: '#/components/schemas/RuleDefinition'
        semanticDigest:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
          maxItems: 100
        supportedHosts:
          type: array
          items:
            type: string
            enum:
            - browser
            - server
          maxItems: 2
      required:
      - valid
      - diagnostics
      - supportedHosts
      additionalProperties: false
    BookmarkFacts:
      type: object
      properties:
        kind:
          const: bookmark
        url:
          type: object
          properties:
            host:
              type: string
              maxLength: 253
            path:
              type: string
              maxLength: 2048
          required:
          - host
          additionalProperties: false
        title:
          type: string
          maxLength: 2000
        tags:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 100
        nodeId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        parent:
          $ref: '#/components/schemas/FolderRef'
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/FolderRef'
          maxItems: 128
      required:
      - kind
      - url
      - title
      - tags
      additionalProperties: false
    EventFacts:
      type: object
      properties:
        eventId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        operationId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        type:
          type: string
          maxLength: 100
        collectionId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        nodeId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        commitOrdinal:
          type: string
          maxLength: 32
          pattern: ^[0-9]+$
        occurredAt:
          type: string
          format: date-time
        origin:
          type: string
          enum:
          - user
          - sync
          - import
          - restore
          - automation
          - system
        changedFields:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 50
        bookmark:
          $ref: '#/components/schemas/BookmarkFacts'
        before:
          $ref: '#/components/schemas/BookmarkFacts'
        rootRunId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        stageId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        hopCount:
          type: integer
          minimum: 0
          maximum: 16
        intakeDisposition:
          type: string
          enum:
          - userDefault
          - userSelected
          - rulePlacement
          - observedRoot
          - notIntake
          - unknown
          description: Server-derived from canonical intake command context/verified receipt. Missing means unknown.
            Unknown, imports, restores and already-foldered input must not be automatically reparented.
      required:
      - eventId
      - operationId
      - type
      - collectionId
      - nodeId
      - commitOrdinal
      - occurredAt
      - origin
      - changedFields
      - bookmark
      - hopCount
      additionalProperties: false
    PreviewInput:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/RuleInput'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventFacts'
          maxItems: 1000
        mode:
          type: string
          enum:
          - supplied
          - currentState
          - retainedHistory
          description: supplied validates bounded provided facts; currentState reads up to 200 authorized current
            bookmarks without requiring historical ingestion; retainedHistory requires the retained-facts capability
            and never falls back silently.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
      - rule
      - mode
      additionalProperties: false
      allOf:
      - if:
          properties:
            mode:
              const: supplied
          required:
          - mode
        then:
          required:
          - events
          properties:
            events:
              minItems: 1
        else:
          not:
            required:
            - events
      description: Pure rule preview. Persist an exact configuration-bound preview token but do not mutate bookmarks,
        create jobs or contact an executor. Current-state sampling is not historical replay.
    PreviewDecision:
      type: object
