          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        effectReceiptId:
          $ref: '#/components/schemas/OpaqueId'
      required:
      - reason
      - expectedEffectDigest
      - effectReceiptId
      additionalProperties: false
      description: Select exactly one recorded effect. M1 compensates a verified placement only; M2 links an existing
        plan/version. Reject stale collection/content fences. Never delete the saved bookmark to undo its placement
        or restore a broad snapshot over unrelated work.
    OperationReceipt:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        status:
