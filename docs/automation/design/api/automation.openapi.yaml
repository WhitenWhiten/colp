          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        allowedFolders:
          type: array
          items:
            $ref: '#/components/schemas/FolderRef'
          maxItems: 100
        input:
          type: array
          items:
            $ref: '#/components/schemas/TaskInput'
          maxItems: 100
        inputsPaged:
          type: boolean
        deliveryHandle:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          description: Job access locator issued by the job ledger for both events and poll workers, not a webhook
            delivery ID or an authority grant. Present on every worker-visible job.
        attemptGeneration:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - revision
      - runId
      - task
      - status
      - inputDigest
      - allowedFolders
      - inputsPaged
      - attemptGeneration
      - createdAt
      additionalProperties: false
      description: Worker representation must include deliveryHandle and only allowlisted inputs; Owner view may
        omit that handle. Foreign resources remain concealed.
    ClaimInput:
      type: object
      properties:
        deliveryHandle:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
