      - resourceId
      - diagnostics
      additionalProperties: false
    LocalReceiptInput:
      type: object
      properties:
        deviceId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        replicaGeneration:
          type: integer
          minimum: 1
        localReceiptId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        operationId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          description: Canonical Sync create operation ID, not chrome.bookmarks operation or native node identity.
        ruleId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        ruleRevision:
          type: string
          maxLength: 128
          minLength: 1
        bindingRevision:
          type: string
          maxLength: 128
          minLength: 1
        bundleRevision:
          type: string
          maxLength: 128
          minLength: 1
        inputDigest:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        satisfiedTaskTypes:
          type: array
          items:
            const: classify.root
          maxItems: 1
          uniqueItems: true
          description: Advisory intake satisfaction. Server verifies committed placement and pinned rule; never
            trusts this to discharge enrichment tasks.
        committedNode:
          $ref: '#/components/schemas/FolderRef'
          description: Canonical resource identity (serverUuid, collectionId, nodeId); FolderRef is reused structurally,
            but the node is a bookmark and must be checked as such.
        resultDigests:
          type: array
          items:
            type: string
            maxLength: 64
            pattern: ^[a-f0-9]{64}$
          maxItems: 1
        placementOperationId:
          $ref: '#/components/schemas/OpaqueId'
          description: Canonical move operation ID for an observed-create correction. Required semantically for
            that path; omitted for pre-save placement.
        beforeFolder:
          $ref: '#/components/schemas/FolderRef'
          description: Canonical original/default destination observed before rule placement. Advisory until checked
            against canonical operations; never invented to offer Undo.
      required:
      - deviceId
      - replicaGeneration
      - localReceiptId
      - operationId
      - ruleId
      - ruleRevision
      - bindingRevision
      - bundleRevision
      - inputDigest
      - satisfiedTaskTypes
      - resultDigests
      - committedNode
      additionalProperties: false
      description: Device-authenticated canonical evidence, not an authorization grant. Native ID mapping and native
        observation generation remain inside the extension. Both canonical operations must be joined before accepting
        an observed-create receipt.
