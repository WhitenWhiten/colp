    (add it as openapi/fragments/automations.yaml). Session, CSRF and error integration names were verified on 2026-10-12
    (evidence R23) and are re-checked at AW-01. Operations carry x-delivery-phase with the milestone (M0..M4, Later).
    MCP JSON-RPC methods are described separately.
servers:
- url: https://colp.example.invalid
  description: Replace with the authorized host; never a real deployment.
