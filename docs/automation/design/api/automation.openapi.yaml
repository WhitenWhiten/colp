        jobId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        targetId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        subscriptionId:
