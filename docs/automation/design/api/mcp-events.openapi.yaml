openapi: 3.1.0
info:
  title: COLP MCP Events — Proposed JSON-RPC and Outbound Webhook Contract
  version: 0.2.1-design
  description: Method-level subset of the existing authenticated MCP endpoint, not new REST events/list routes.
    Host request metadata, OAuth discovery and tool transport remain authoritative in the existing MCP adapter.
    Public protocol support must be verified against pinned upstream fixtures before release. OpenAI webhook compatibility
    profile as verified 2026-10-13; experimental upstream poll/push and provisional error renumbering are not mounted
    by this adapter. Signing uses immutable body/event ID and a fresh timestamp/signature per delivery attempt.
    413 terminates only the oversized occurrence; it is not an instruction to disable the target.
servers:
- url: https://colp.example.invalid
security:
- McpOAuthBearer: []
paths:
  /collections/-/mcp:
    post:
      operationId: dispatchMcpEventMethod
      summary: Dispatch the three MCP Events methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        '200':
          description: A JSON-RPC result or method error; distinguish from HTTP authentication/admission failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          description: OAuth authentication required; host WWW-Authenticate contract applies.
        '403':
          description: Transport admission denied.
        '413':
          description: Request budget exceeded.
        '429':
          description: Transport rate limited.
webhooks:
  eventOccurrence:
    post:
      operationId: eventOccurrence
      summary: COLP sends to a validated subscriber-supplied callback; not an inbound COLP route.
      security: []
      parameters:
      - name: webhook-id
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      - name: webhook-timestamp
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      - name: webhook-signature
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      - name: X-MCP-Subscription-Id
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      x-authentication: 'Standard Webhooks signature over the exact body; security: [] means no OAuth on the outbound
        callback, not unauthenticated trust.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Occurrence'
      responses:
        '200':
          description: Receiver accepted; for a challenge, exact challenge echo required. Acceptance does not complete
            the business job.
        '204':
          description: Receipt accepted for occurrence only; invalid verification without challenge echo.
        '410':
          description: Stop retrying this callback delivery.
        '413':
          description: Stop retrying this oversized delivery; surface an incident.
        '429':
          description: Retry with bounded policy.
        '500':
          description: Transient receiver failure.
  callbackVerification:
    post:
      operationId: callbackVerification
      summary: COLP sends to a validated subscriber-supplied callback; not an inbound COLP route.
      security: []
      parameters:
      - name: webhook-id
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      - name: webhook-timestamp
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      - name: webhook-signature
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      - name: X-MCP-Subscription-Id
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      x-authentication: 'Standard Webhooks signature over the exact body; security: [] means no OAuth on the outbound
        callback, not unauthenticated trust.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
      responses:
        '200':
          description: Receiver accepted; for a challenge, exact challenge echo required. Acceptance does not complete
            the business job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '410':
          description: Stop retrying this callback delivery.
        '413':
          description: Stop retrying this oversized delivery; surface an incident.
        '429':
          description: Retry with bounded policy.
        '500':
          description: Transient receiver failure.
components:
  schemas:
    EventArguments:
      type: object
      properties:
        targetId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
      required:
      - targetId
      additionalProperties: false
    WebhookDestination:
      type: object
      properties:
        mode:
          const: webhook
        url:
          type: string
          maxLength: 2048
          format: uri
        secret:
          type: string
          maxLength: 256
          pattern: ^whsec_[A-Za-z0-9+/]+={0,2}$
      required:
      - mode
      - url
      - secret
      additionalProperties: false
    WebhookAddress:
      type: object
      properties:
        mode:
          const: webhook
        url:
          type: string
          maxLength: 2048
          format: uri
      required:
      - mode
      - url
      additionalProperties: false
    SubscribeParams:
      type: object
      properties:
        name:
          const: colp.automation.triggered
        arguments:
          $ref: '#/components/schemas/EventArguments'
        delivery:
          $ref: '#/components/schemas/WebhookDestination'
        cursor:
          type: 'null'
        ttlMs:
          type:
          - integer
          - 'null'
          minimum: 1
        _meta:
          type: object
          additionalProperties: true
          description: Reserved metadata is handled by the existing pinned MCP codec before method-level validation.
      required:
      - name
      - arguments
      - delivery
      additionalProperties: false
    UnsubscribeParams:
      type: object
      properties:
        name:
          const: colp.automation.triggered
        arguments:
          $ref: '#/components/schemas/EventArguments'
        delivery:
          $ref: '#/components/schemas/WebhookAddress'
        _meta:
          type: object
          additionalProperties: true
          description: Reserved metadata is handled by the existing pinned MCP codec before method-level validation.
      required:
      - name
      - arguments
      - delivery
      additionalProperties: false
    SubscribeResult:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        refreshBefore:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        cursor:
          type: 'null'
        truncated:
          const: false
      required:
      - id
      - refreshBefore
      - cursor
      - truncated
      additionalProperties: false
    TriggerData:
      type: object
      properties:
        runId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        jobId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        ruleId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        ruleRevision:
          type: string
          maxLength: 128
          minLength: 1
        targetId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        matchedCount:
          type: integer
          minimum: 1
          maximum: 1000
        deliveryHandle:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
      required:
      - runId
      - jobId
      - ruleId
      - ruleRevision
      - targetId
      - matchedCount
      - deliveryHandle
      additionalProperties: false
      description: Reference-only routing facts. deliveryHandle correlates a job with its intended inbox; it grants
        no access without authenticated target authority.
    Occurrence:
      type: object
      properties:
        eventId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        name:
          const: colp.automation.triggered
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/TriggerData'
        cursor:
          type: 'null'
      required:
      - eventId
      - name
      - timestamp
      - data
      - cursor
      additionalProperties: false
    Verification:
      type: object
      properties:
        type:
          const: verification
        challenge:
          type: string
          maxLength: 256
          minLength: 16
      required:
      - type
      - challenge
      additionalProperties: false
    VerificationResponse:
      type: object
      properties:
        challenge:
          type: string
          maxLength: 256
          minLength: 16
      required:
      - challenge
      additionalProperties: false
    EventDefinition:
      type: object
      properties:
        name:
          const: colp.automation.triggered
        description:
          type: string
          maxLength: 2000
        delivery:
          type: array
          items:
            const: webhook
          maxItems: 1
        inputSchema:
          type: object
          additionalProperties: true
        payloadSchema:
          type: object
          additionalProperties: true
      required:
      - name
      - description
      - delivery
      - inputSchema
      - payloadSchema
      additionalProperties: false
    ListResult:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventDefinition'
          maxItems: 100
        nextCursor:
          type: string
          maxLength: 2048
      required:
      - events
      additionalProperties: false
    ListParams:
      type: object
      properties:
        cursor:
          type: string
          maxLength: 2048
        _meta:
          type: object
          additionalProperties: true
          description: Reserved metadata is handled by the existing pinned MCP codec before method-level validation.
      required: []
      additionalProperties: false
    ListRequest:
      type: object
      properties:
        jsonrpc:
          const: '2.0'
        id:
          type:
          - string
          - integer
        method:
          const: events/list
        params:
          $ref: '#/components/schemas/ListParams'
        _meta:
          type: object
          additionalProperties: true
      required:
      - jsonrpc
      - id
      - method
      - params
      additionalProperties: false
      description: Method schema only. Modern protocol metadata MUST still pass the existing pinned MCP request
        adapter; examples below omit transport-specific fields.
    SubscribeRequest:
      type: object
      properties:
        jsonrpc:
          const: '2.0'
        id:
          type:
          - string
          - integer
        method:
          const: events/subscribe
        params:
          $ref: '#/components/schemas/SubscribeParams'
        _meta:
          type: object
          additionalProperties: true
      required:
      - jsonrpc
      - id
      - method
      - params
      additionalProperties: false
      description: Method schema only. Modern protocol metadata MUST still pass the existing pinned MCP request
        adapter; examples below omit transport-specific fields.
    UnsubscribeRequest:
      type: object
      properties:
        jsonrpc:
          const: '2.0'
        id:
          type:
          - string
          - integer
        method:
          const: events/unsubscribe
        params:
          $ref: '#/components/schemas/UnsubscribeParams'
        _meta:
          type: object
          additionalProperties: true
      required:
      - jsonrpc
      - id
      - method
      - params
      additionalProperties: false
      description: Method schema only. Modern protocol metadata MUST still pass the existing pinned MCP request
        adapter; examples below omit transport-specific fields.
    Request:
      oneOf:
      - $ref: '#/components/schemas/ListRequest'
      - $ref: '#/components/schemas/SubscribeRequest'
      - $ref: '#/components/schemas/UnsubscribeRequest'
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
          maxLength: 1000
        data:
          type: object
          properties:
            reason:
              type: string
              maxLength: 100
            requestId:
              type: string
              maxLength: 128
              minLength: 1
              pattern: ^[A-Za-z0-9._~-]+$
          required: []
          additionalProperties: false
      required:
      - code
      - message
      additionalProperties: false
    Response:
      oneOf:
      - type: object
        properties:
          jsonrpc:
            const: '2.0'
          id:
            type:
            - string
            - integer
          result:
            $ref: '#/components/schemas/ListResult'
        required:
        - jsonrpc
        - id
        - result
        additionalProperties: false
      - type: object
        properties:
          jsonrpc:
            const: '2.0'
          id:
            type:
            - string
            - integer
          result:
            $ref: '#/components/schemas/SubscribeResult'
        required:
        - jsonrpc
        - id
        - result
        additionalProperties: false
      - type: object
        properties:
          jsonrpc:
            const: '2.0'
          id:
            type:
            - string
            - integer
          result:
            type: object
            properties: {}
            required: []
            additionalProperties: false
        required:
        - jsonrpc
        - id
        - result
        additionalProperties: false
      - type: object
        properties:
          jsonrpc:
            const: '2.0'
          id:
            type:
            - string
            - integer
            - 'null'
          error:
            $ref: '#/components/schemas/Error'
        required:
        - jsonrpc
        - id
        - error
        additionalProperties: false
  securitySchemes:
    McpOAuthBearer:
      type: http
      scheme: bearer
      description: Use the existing MCP resource audience and OAuth verifier.
