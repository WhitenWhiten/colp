name: Protocol change proposal
description: Propose a new capability or a change to the COLP wire format or semantics.
labels: [protocol]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can implementers or users not do today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest, with example wire documents where they help.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected sections and profiles
      description: Spec sections (with `colp-section-N` anchors), `$defs` names, and profiles this touches.
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - Backward compatible (extension or new optional field)
        - Breaking change (needs a new protocol version)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
