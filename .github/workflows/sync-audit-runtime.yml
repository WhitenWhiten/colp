name: sync-audit-runtime

# Temporary public test-runtime export for offline validation; removed before merge.
on:
  push:
    branches: [fix/sync-audit-20261018]
    paths: [.github/workflows/sync-audit-runtime.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export public PostgreSQL 16 binaries without starting a service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-runtime/usr/lib" "$RUNNER_TEMP/pg-runtime/usr/share"
          container=$(docker create postgres:16-bookworm)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/lib/postgresql" "$RUNNER_TEMP/pg-runtime/usr/lib/"
          docker cp "$container:/usr/share/postgresql" "$RUNNER_TEMP/pg-runtime/usr/share/"
          docker cp "$container:/usr/lib/x86_64-linux-gnu" "$RUNNER_TEMP/pg-runtime/usr/lib/"
          # Use the host C runtime/loader, not a second libc through LD_LIBRARY_PATH.
          find "$RUNNER_TEMP/pg-runtime/usr/lib/x86_64-linux-gnu" -maxdepth 1 \( -name 'libc.so*' -o -name 'libm.so*' -o -name 'libpthread.so*' -o -name 'libdl.so*' -o -name 'librt.so*' -o -name 'ld-linux*' \) -delete
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pg-runtime.tar.gz" pg-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: sync-audit-postgres
          path: ${{ runner.temp }}/pg-runtime.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked browser test runtime
        working-directory: packages/extension
        run: npm ci && npx playwright install chromium
      - name: Export browser cache only
        run: tar -C "$HOME/.cache" -czf "$RUNNER_TEMP/playwright-runtime.tar.gz" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: sync-audit-chromium
          path: ${{ runner.temp }}/playwright-runtime.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
