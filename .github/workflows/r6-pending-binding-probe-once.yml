name: r6-pending-binding-probe-once
on:
  push:
    branches: ['codex/r6-pending-binding-probe-run-20261020']
permissions:
  contents: read
concurrency:
  group: r6-pending-binding-probe-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extension-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 32bfbfec1b8a98d06d95d7443ca5237389be9e3f
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Independent pending mapping binding probes and retained recovery tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.sync-coverage.config.ts tests/own-create-parent-read-budget.test.ts
        working-directory: packages/extension
      - name: Full extension typecheck
        if: always()
        run: npm run typecheck
        working-directory: packages/extension
      - name: Extension lint
        if: always()
        run: npm run lint
        working-directory: packages/extension
      - name: Extension source-size gate
        if: always()
        run: npm run check:source-size
        working-directory: packages/extension
