name: sync-browser-diagnostic-once
on:
  push:
    branches: ['codex/sync-browser-diagnostic-*']
permissions:
  contents: read
concurrency:
  group: sync-browser-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: replay
            specs: e2e/mv3-outbound-push.spec.ts
            pattern: .
          - lane: metadata
            specs: e2e/mv3-personal-sync-lifecycle.spec.ts
            pattern: metadata opt-out
    env:
      KNOWN_PG_EVIDENCE_MODE: acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: extension-playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/extension/package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: packages/extension
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: Build production extension with the existing fixture configuration
        run: npm run build -- --config config/e2e-fixture.json
        working-directory: packages/extension
      - name: Real PostgreSQL and Chromium diagnostic
        env:
          DIAGNOSTIC_PATTERN: ${{ matrix.pattern }}
        run: node ../server/scripts/with-postgres.mjs -- node scripts/with-xvfb.mjs npx playwright test ${{ matrix.specs }} --grep "$DIAGNOSTIC_PATTERN"
        working-directory: packages/extension
      - name: Preserve actual Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sync-browser-diagnostic-${{ matrix.lane }}-${{ github.run_attempt }}
          path: packages/extension/test-results/
          if-no-files-found: warn
          retention-days: 7
