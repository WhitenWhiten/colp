name: s08-read-unit-verify-once
on:
  push:
    branches: ['codex/s08-read-unit-verify-20261020']
permissions:
  contents: read
jobs:
  read-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Full extension types
        run: npm run typecheck
        working-directory: packages/extension
      - name: Coherent read regressions and unchanged owner measurement
        run: node node_modules/vitest/vitest.mjs run --config vitest.sync-coverage.config.ts tests/pull-mapping-read-budget.test.ts tests/pull-mapping-read-consistency.test.ts tests/pull-mapping-view.test.ts tests/pull-workset-paging.test.ts tests/pull-workset-reads.test.ts --coverage --coverage.include=src/pull-mapping-view.ts --coverage.include=src/sync-state/pull-workset.ts --coverage.include=src/sync-state/pull-mapping-read-repository.ts --coverage.reporter=json --coverage.reporter=json-summary --coverage.reportsDirectory=coverage/s08-read
        working-directory: packages/extension
      - name: Real worker receipt Pull and Ack budget
        if: always()
        env:
          S08_PROFILE_OUTPUT: /tmp/s08-worker-after.json
          S08_SOURCE_SHA: cdb523701ee0ccc443c0f09f10d1b178f3cab1b2
        run: node node_modules/vitest/vitest.mjs run --config vitest.sync-coverage.config.ts tests/bootstrap-queue-worker-mapping-budget.test.ts --maxWorkers=1
        working-directory: packages/extension
      - name: Print exact owner measurement and semantic profile
        if: always()
        run: |
          test ! -f coverage/s08-read/coverage-summary.json || cat coverage/s08-read/coverage-summary.json
          test ! -f /tmp/s08-worker-after.json || cat /tmp/s08-worker-after.json
        working-directory: packages/extension
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: s08-coherent-read
          path: |
            packages/extension/coverage/s08-read/
            /tmp/s08-worker-after.json
          if-no-files-found: warn
          retention-days: 14
