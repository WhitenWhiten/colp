name: sync-audit-workspace

# Temporary, read-only workspace export for this repair branch. Removed before merge.
on:
  push:
    branches: [fix/sync-audit-20261018]
    paths: [.github/workflows/sync-audit-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed source (no checkout credentials or runner state)
        run: git bundle create "$RUNNER_TEMP/colp-source.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: sync-audit-source
          path: ${{ runner.temp }}/colp-source.bundle
          retention-days: 2
          if-no-files-found: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked public dependencies
        run: |
          for package in node server extension; do
            npm --prefix "packages/$package" ci
            (cd "packages/$package" && (test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false))
          done
      - name: Export only package dependencies
        run: tar -czf "$RUNNER_TEMP/colp-dependencies.tar.gz" packages/node/node_modules packages/server/node_modules packages/extension/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: sync-audit-dependencies
          path: ${{ runner.temp }}/colp-dependencies.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
