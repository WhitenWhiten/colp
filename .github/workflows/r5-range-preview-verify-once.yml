name: r5-range-preview-verify-once
on:
  push:
    branches: ['codex/r5-range-preview-verify-20261020']
permissions:
  contents: read
concurrency:
  group: r5-range-preview-verify-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  range-preview-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40ce50b3fde28a2c8118ad47ad2c8d62196977f9
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: extension-playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/extension/package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: packages/extension
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: Both original first-sync UI journeys on fixed source
        run: |
          npm run build -- --config config/e2e-fixture.json
          node ../server/scripts/with-postgres.mjs -- node scripts/with-xvfb.mjs npx playwright test e2e/mv3-first-sync-from-ui.spec.ts
          node scripts/verify-release-artifact.mjs dist/production
          node scripts/verify-bookmark-privacy-artifacts.mjs test-results
        working-directory: packages/extension
      - name: Full extension typecheck
        if: always()
        run: npm run typecheck
        working-directory: packages/extension
      - name: Regression spec lint
        if: always()
        run: npx eslint e2e/mv3-first-sync-from-ui.spec.ts
        working-directory: packages/extension
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r5-range-preview-playwright-${{ github.run_attempt }}
          path: packages/extension/test-results/
          if-no-files-found: warn
          retention-days: 7
