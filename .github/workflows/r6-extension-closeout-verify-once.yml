name: r6-extension-closeout-verify-once
on:
  push:
    branches: ['codex/r6-extension-closeout-verify-20261020']
permissions:
  contents: read
concurrency:
  group: r6-extension-closeout-verify-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extension-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 3f9a8609c09dfe26b28ec8012c1f0efb1ad2f30f
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Original three failures, placement regressions and native recovery controls
        run: node node_modules/vitest/vitest.mjs run tests/pull-mapping-lifecycle.test.ts tests/pull-local-placement.test.ts tests/pull-move-native-admission.test.ts tests/pull-move-echo-causality.test.ts tests/pull-native-wrapper-authority.test.ts tests/pull-content-native-admission.test.ts tests/pull-delete-native-admission.test.ts tests/pull-create-native-admission.test.ts tests/pull-range-materialize-audit.test.ts tests/pull-range-readmission-audit.test.ts tests/pull-mapping-view.test.ts tests/durable-sync-engine-real-pull-applier.test.ts tests/durable-sync-engine-pull-set-aside.test.ts tests/identity-item-recovery.test.ts tests/kns-05-pull.test.ts tests/sync-coverage-ratchet.contract.test.ts tests/sync-coverage-baseline-writer.test.ts tests/n2-restore-anchor.test.ts tests/native-convergence-replay.test.ts tests/pull-mutation-failure-boundary.test.ts tests/own-create-replay.test.ts tests/bookmark-create-receipt-identity.test.ts
        working-directory: packages/extension
      - name: Full extension typecheck
        if: always()
        run: npm run typecheck
        working-directory: packages/extension
      - name: Extension lint
        if: always()
        run: npm run lint
        working-directory: packages/extension
      - name: Extension source-size gate
        if: always()
        run: npm run check:source-size
        working-directory: packages/extension
