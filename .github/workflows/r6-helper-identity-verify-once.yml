name: r6-helper-identity-verify-once
on:
  push:
    branches: ['codex/r6-helper-identity-verify-20261020']
permissions:
  contents: read
concurrency:
  group: r6-helper-identity-verify-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extension-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 113ff442cb0197b1920ac28aacb7d9c358a160d5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Lazy parent read budget, original regressions and fresh mapping controls
        run: node node_modules/vitest/vitest.mjs run --config vitest.sync-coverage.config.ts tests/pull-mapping-lifecycle.test.ts tests/pull-local-placement.test.ts tests/pull-move-native-admission.test.ts tests/pull-move-echo-causality.test.ts tests/pull-native-wrapper-authority.test.ts tests/pull-content-native-admission.test.ts tests/pull-delete-native-admission.test.ts tests/pull-create-native-admission.test.ts tests/pull-range-materialize-audit.test.ts tests/pull-range-readmission-audit.test.ts tests/pull-mapping-view.test.ts tests/durable-sync-engine-real-pull-applier.test.ts tests/durable-sync-engine-pull-set-aside.test.ts tests/identity-item-recovery.test.ts tests/kns-05-pull.test.ts tests/sync-coverage-ratchet.contract.test.ts tests/sync-coverage-baseline-writer.test.ts tests/n2-restore-anchor.test.ts tests/native-convergence-replay.test.ts tests/pull-mutation-failure-boundary.test.ts tests/own-create-replay.test.ts tests/bookmark-create-receipt-identity.test.ts tests/own-create-parent-read-budget.test.ts tests/pull-mapping-read-consistency.test.ts tests/pull-mapping-read-budget.test.ts tests/bootstrap-queue-worker-mapping-budget.test.ts --coverage --coverage.include=src/pull-self-create.ts --coverage.reporter=text --coverage.reporter=json --coverage.reporter=json-summary --coverage.reportsDirectory=coverage/r6-self-create
        working-directory: packages/extension
      - name: Verify the new helper owner independently at all four 80 percent floors
        if: always()
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const summary=JSON.parse(readFileSync("coverage/r6-self-create/coverage-summary.json","utf8")); const names=Object.keys(summary).filter(k=>k!=="total"); if(names.length!==1||!names[0].endsWith("/src/pull-self-create.ts"))throw new Error("Unexpected measured files"); const metrics=summary[names[0]]; console.log("R6 helper coverage: "+JSON.stringify({file:"src/pull-self-create.ts",...metrics})); const full=JSON.parse(readFileSync("coverage/r6-self-create/coverage-final.json","utf8"))[names[0]]; console.log("R6 helper uncovered: "+JSON.stringify({statements:Object.entries(full.s).filter(([,n])=>n===0).map(([id])=>full.statementMap[id]),functions:Object.entries(full.f).filter(([,n])=>n===0).map(([id])=>full.fnMap[id]),branches:Object.entries(full.b).filter(([,ns])=>ns.some(n=>n===0)).map(([id,counts])=>({location:full.branchMap[id],counts}))})); for(const metric of ["lines","branches","functions","statements"])if(metrics[metric].pct<80)throw new Error(metric+" below required 80 percent");'
        working-directory: packages/extension
      - name: Full extension typecheck
        if: always()
        run: npm run typecheck
        working-directory: packages/extension
      - name: Extension lint
        if: always()
        run: npm run lint
        working-directory: packages/extension
      - name: Extension source-size gate
        if: always()
        run: npm run check:source-size
        working-directory: packages/extension
