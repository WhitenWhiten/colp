name: sync-audit-delivery

# Temporary transport for locally verified commits; not a validation job.
# The imported tree removes this transport. Never writes main.
on:
  push:
    branches: [fix/sync-audit-20261018]
    paths: [.sync-audit-delivery.json]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'WhitenWhiten/colp'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact authored commits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, os, re, subprocess
          from pathlib import Path
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data).decode().strip()
          payload = json.loads(gzip.decompress(base64.b64decode(Path('.sync-audit-delivery.json').read_text(), validate=True)))
          baseline = 'a172c976ad955de04fdd19b3b00f728def47eb21'
          previous = payload['base']
          assert re.fullmatch('[0-9a-f]{40}', previous)
          subprocess.run(['git', 'merge-base', '--is-ancestor', baseline, previous], check=True)
          git('read-tree', previous)
          for entry in payload['commits']:
              raw = entry['raw'].encode()
              headers = entry['raw'].split('\n\n', 1)[0].splitlines()
              assert [line for line in headers if line.startswith('parent ')] == ['parent ' + previous]
              expected_tree = headers[0].removeprefix('tree ')
              if entry['patch']:
                  git('apply', '--cached', '--binary', '--whitespace=error', '-', data=entry['patch'].encode())
              assert git('write-tree') == expected_tree, 'tree mismatch'
              actual = git('hash-object', '-t', 'commit', '-w', '--stdin', data=raw)
              assert actual == entry['sha'], 'commit identity mismatch'
              previous = actual
              print('Verified commit', actual, flush=True)
          subprocess.run(['git', 'diff', '--check', baseline, previous], check=True)
          ref = 'refs/heads/fix/sync-audit-20261018'
          # The explicit event-SHA lease fails rather than overwriting concurrent user changes.
          subprocess.run(['git', 'push', 'origin', previous + ':' + ref,
                          '--force-with-lease=' + ref + ':' + os.environ['GITHUB_SHA']], check=True)
          PY
