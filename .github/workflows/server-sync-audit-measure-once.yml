# Temporary measurement workflow. Publish only on a dedicated
# codex/server-audit-measure-* branch; do not add it to the main PR.
name: server-sync-audit-measure-once

on:
  push:
    branches: ['codex/server-audit-measure-*']

permissions:
  contents: read

concurrency:
  group: server-sync-audit-measure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server-sync-audit-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/server/package-lock.json
            packages/extension/package-lock.json
      - name: Frozen server install
        run: npm ci
        working-directory: packages/server
      - name: Frozen extension harness install
        run: npm ci
        working-directory: packages/extension
      - name: Current unit and real PostgreSQL combined V8 collection
        run: npm run test:coverage:sync-audit
        working-directory: packages/server
        env:
          KNOWN_PG_EVIDENCE_MODE: acceptance
      - name: Require every owner, test file and per-file four-metric floor
        if: always()
        run: npm run check:coverage:sync-audit
        working-directory: packages/server
      - name: Upload current server audit measurement even when the floor is unmeasured
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-sync-audit-coverage
          path: packages/server/coverage/sync-audit/
          if-no-files-found: error
          retention-days: 14
