name: sync-followup-verify-once
on:
  push:
    branches: ['codex/sync-followup-verify-20261020']
permissions:
  contents: read
concurrency:
  group: sync-browser-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: replay
            specs: e2e/mv3-outbound-push.spec.ts
            pattern: 'deferred receipt|production MV3 exact-replays'
          - lane: roots
            specs: e2e/mv3-bookmark-roots.spec.ts
            pattern: .
    env:
      KNOWN_PG_EVIDENCE_MODE: acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: extension-playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/extension/package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: packages/extension
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: Build production extension with the existing fixture configuration
        run: npm run build -- --config config/e2e-fixture.json
        working-directory: packages/extension
      - name: Real PostgreSQL and Chromium diagnostic
        env:
          DIAGNOSTIC_PATTERN: ${{ matrix.pattern }}
        run: node ../server/scripts/with-postgres.mjs -- node scripts/with-xvfb.mjs npx playwright test ${{ matrix.specs }} --grep "$DIAGNOSTIC_PATTERN"
        working-directory: packages/extension
      # This temporary run does not upload browser traces, screenshots, page
      # state or test-results. Tests use new temporary profiles, an isolated
      # PostgreSQL database and fixed example.test/known.example fixture data.
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KNOWN_PG_EVIDENCE_MODE: acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server/package-lock.json
      - run: npm ci
        working-directory: packages/server
      - name: Real isolated PostgreSQL and HTTP retirement cases
        run: >-
          node scripts/with-postgres.mjs --isolated-owner --
          node node_modules/vitest/vitest.mjs run --project postgres
          --fileParallelism=false --testTimeout=60000 --hookTimeout=120000
          --reporter=default --reporter=json --outputFile.json=retirement-result.json
          tests/integration/sync/sync-retire-reauthorization-postgres.integration.test.ts
          tests/integration/sync/sync-retire-session-liveness-postgres.integration.test.ts
          tests/integration/sync/sync-retire-effect-page-http-postgres.integration.test.ts
        working-directory: packages/server
      - name: Require all three files and no skipped cases
        working-directory: packages/server
        shell: python
        run: |
          import json
          from pathlib import Path
          data=json.loads(Path('retirement-result.json').read_text())
          names={Path(row['name']).name for row in data['testResults']}
          expected={'sync-retire-reauthorization-postgres.integration.test.ts',
                    'sync-retire-session-liveness-postgres.integration.test.ts',
                    'sync-retire-effect-page-http-postgres.integration.test.ts'}
          assert names==expected, 'Missing required PostgreSQL file'
          cases=[case for row in data['testResults'] for case in row['assertionResults']]
          assert len(cases)>=17 and all(case['status']=='passed' for case in cases), 'Failed or skipped PostgreSQL case'
          print('Verified files:',len(names),'passed cases:',len(cases))
      # No database payloads, credentials or test-results are uploaded.
