  ci-gate:
    if: always()
    needs:
      - changes
      - static
      - test
      - publisher-coverage
      - security-coverage
      - sync-core-coverage
      - package
      - dependency-audit
      - conformance
      - server
      - server-integration
      - server-capabilities
      - web
      - web-browser
      - web-acceptance
      - extension
      - extension-browser
      - self-hosted-browser
      - extension-coverage
      - extension-mv3
      - extension-sync-real-stack
      - extension-kns-09-release
      - extension-kns-09-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PUBLISHER_RESULT: ${{ needs.publisher-coverage.result }}
          SECURITY_RESULT: ${{ needs.security-coverage.result }}
          SYNC_CORE_RESULT: ${{ needs.sync-core-coverage.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          SERVER_INTEGRATION_RESULT: ${{ needs.server-integration.result }}
          SERVER_CAPABILITIES_RESULT: ${{ needs.server-capabilities.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WEB_BROWSER_RESULT: ${{ needs.web-browser.result }}
          WEB_ACCEPTANCE_RESULT: ${{ needs.web-acceptance.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          EXTENSION_BROWSER_RESULT: ${{ needs.extension-browser.result }}
          SELF_HOSTED_BROWSER_RESULT: ${{ needs.self-hosted-browser.result }}
          EXTENSION_COVERAGE_RESULT: ${{ needs.extension-coverage.result }}
          EXTENSION_MV3_RESULT: ${{ needs.extension-mv3.result }}
          EXTENSION_SYNC_REAL_STACK_RESULT: ${{ needs.extension-sync-real-stack.result }}
          EXTENSION_KNS09_RELEASE_RESULT: ${{ needs.extension-kns-09-release.result }}
          EXTENSION_KNS09_E2E_RESULT: ${{ needs.extension-kns-09-e2e.result }}
        run: |
          for result in "$CHANGES_RESULT" "$STATIC_RESULT" "$TEST_RESULT" "$PUBLISHER_RESULT" "$SECURITY_RESULT" "$SYNC_CORE_RESULT" "$PACKAGE_RESULT" "$DEPENDENCY_AUDIT_RESULT" "$CONFORMANCE_RESULT" "$SERVER_RESULT" "$SERVER_INTEGRATION_RESULT" "$SERVER_CAPABILITIES_RESULT" "$WEB_RESULT" "$WEB_BROWSER_RESULT" "$WEB_ACCEPTANCE_RESULT" \
            "$EXTENSION_RESULT" "$EXTENSION_BROWSER_RESULT" "$SELF_HOSTED_BROWSER_RESULT" "$EXTENSION_COVERAGE_RESULT" "$EXTENSION_MV3_RESULT" "$EXTENSION_SYNC_REAL_STACK_RESULT" \
            "$EXTENSION_KNS09_RELEASE_RESULT" "$EXTENSION_KNS09_E2E_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A selected colp-ci job did not pass: $result" >&2
              exit 1
            fi
          done
