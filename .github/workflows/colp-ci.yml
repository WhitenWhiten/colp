name: colp-ci

# No trigger-level path filters: ci-gate is a required status check, so it must
# report on every pull request. The changes job selects the jobs for all authors,
# including dependency updates opened by Dependabot.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit audit steps below enforce the vulnerability gates. Install-time
# audits only duplicate those requests and can exhaust job timeouts on a 503.
env:
  npm_config_audit: 'false'

# Superseded pull request runs are cancelled. Pushes to main are not: a later
# docs-only push would otherwise cancel the run that verifies earlier code.
concurrency:
  group: colp-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      quality: ${{ steps.filter.outputs.quality }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        # Reviewed: dorny/paths-filter is used only to map PR paths to job outputs.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow:
              - '.github/workflows/colp-ci.yml'
            quality:
              - 'packages/node/**'
              - 'packages/conformance/**'
              - 'packages/server/**'
              - 'packages/web/**'
              - 'packages/extension/**'
              - 'deploy/**'
              - '.github/workflows/colp-server-image.yml'
              - 'scripts/**'
              - 'protocol/**'
              - '.github/workflows/colp-ci.yml'
      - id: scope
        name: Select full verification scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.filter.outputs.workflow }}" == "true" ]]; then
            full=true
          else
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate protocol examples
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check --only-binary=:all: --no-deps -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/pip" check
          "$RUNNER_TEMP/venv/bin/python" scripts/validate_examples.py
        working-directory: protocol
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Ensure generation tools are installed
        run: |
          if test ! -f node_modules/json-schema-to-typescript/package.json; then
            npm ci
          fi
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Protocol assets, generated types, traceability and typecheck
        run: npm run check:automation && npm run check:protocol && npm run check:types && npm run check:traceability && npm run typecheck && npm run check:source-size
        working-directory: packages/node
      - name: Dependency audit retry tests
        run: node --test scripts/audit-dependencies.test.mjs

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Full test suite with coverage; fail if evidence.json is stale
        run: xvfb-run --auto-servernum node scripts/generate-conformance-evidence.mjs --check --coverage
        working-directory: packages/node

  publisher-coverage:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Publisher coverage
        run: npm run test:coverage:publisher
        working-directory: packages/node

  security-coverage:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Security coverage
        run: npm run test:coverage:security
        working-directory: packages/node

  sync-core-coverage:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Sync Core-used coverage
        run: npm run test:coverage:sync-core
        working-directory: packages/node

  package:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Build and validate package shape
        run: npm run build && npm run pack:check
        working-directory: packages/node
      - name: Verify clean-consumer Docker isolation
        run: |
          node --test scripts/tests/clean-consumer-sandbox.test.mjs
          artifact_dir=$(mktemp -d)
          trap 'rm -rf "$artifact_dir"' EXIT
          export npm_config_cache="$artifact_dir/npm-cache"
          node scripts/prepare-clean-consumer-cache.mjs "$npm_config_cache"
          npm pack --ignore-scripts --pack-destination "$artifact_dir" > /dev/null
          for tarball in "$artifact_dir"/*.tgz; do
            node scripts/clean-tarball-consumer.mjs "$tarball"
          done
        env:
          COLP_TEST_DOCKER_SANDBOX: '1'
        working-directory: packages/node
      - name: Example publication server self-test
        run: node examples/publication-server.mjs --self-test
        working-directory: packages/node
      - name: Packed surface contracts after dist/
        run: |
          xvfb-run --auto-servernum npx vitest run \
            tests/mcp/mcp-2026-07-28-sdk-acceptance-e2e.test.ts \
            tests/mcp/mcp-2026-07-28-read-package-surface-contract.test.ts \
            tests/mcp/mcp-2026-07-28-write-package-surface-contract.test.ts \
            tests/mcp/mcp-2026-07-28-sdk-lock-contract.test.ts \
            tests/security/package-export.pr8.test.ts \
            tests/sync/production-export-surface.test.ts
        working-directory: packages/node
      - name: Scan COLP dist before packaging evidence
        run: node scripts/scan-tracked-secrets.mjs --artifact packages/node/dist
      - name: Legacy MCP absence (source, declarations, tarball)
        run: npm run check:mcp-legacy-absence
        working-directory: packages/node

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Production and High dependency audit
        run: npm run scan:dependencies
        working-directory: packages/node

  conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/node/package-lock.json
            packages/conformance/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Build the reference package
        run: npm run build
        working-directory: packages/node
      - name: Conformance runner tests
        run: npm ci && npm test
        working-directory: packages/conformance

  server:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/server
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/server
      - name: Lint
        run: npm run lint
        working-directory: packages/server
      - name: Import boundaries
        run: npm run check:imports && npm run check:migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        working-directory: packages/server
      - name: Runtime manifest drift
        run: npm run runtime:manifest:check
        working-directory: packages/server
      - name: Runtime dependency install and audit
        # The image installs from runtime/; the same frozen install must leave
        # test tooling out and carry no high or critical advisories.
        run: |
          npm ci --omit=dev --omit=peer --ignore-scripts --no-audit --no-fund --prefix runtime
          for forbidden in vitest tinypool tsx @vitest/mocker; do
            test ! -e "runtime/node_modules/$forbidden" || { echo "runtime install must not include $forbidden" >&2; exit 1; }
          done
          npm run scan:dependencies:runtime
        working-directory: packages/server
      - name: OpenAPI lint, drift and breaking-change checks
        run: npm run openapi:ci
        working-directory: packages/server
      - name: Unit suite
        run: npm run test:unit
        working-directory: packages/server
      - name: Static contract suite
        run: npm run test:static
        working-directory: packages/server
      - name: Production ingress TLS handshakes (IPv4, IPv6 and DNS)
        run: node --test deploy/tests/restore.test.mjs deploy/tests/tls-handshake.test.mjs

  # Each integration file builds its own migrated database, so the serial suite
  # runs for hours on one runner; six shards keep each job under the timeout.
  server-integration:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/server
      # Product Sync Center integration tests execute the real extension store and workers.
      - name: Frozen extension harness install
        run: npm ci
        working-directory: packages/extension
      - name: PostgreSQL integration suite (shard ${{ matrix.shard }}/6)
        run: node scripts/with-postgres.mjs --isolated-owner -- npm run test:integration:inner -- --shard=${{ matrix.shard }}/6
        working-directory: packages/server

  web:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - name: Lint (TypeScript and CSS ratchets)
        run: npm run lint && npm run lint:css
        working-directory: packages/web
      - name: Unit suite
        run: npm test
        working-directory: packages/web
      - name: Build-script contract tests
        run: npm run test:scripts
        working-directory: packages/web
      - name: Build web
        run: npm run build
        working-directory: packages/web
      - name: Production and development dependency audit
        run: npm run scan:dependencies
        working-directory: packages/web

  # The browser extension imports COLP Server's generated API types and runs its
  # browser harness against packages/server, so every extension job installs both.
  extension:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Types, lint, source size and production build
        run: npm run typecheck && npm run lint && npm run check:source-size && npm run build
        working-directory: packages/extension
      - name: Design tokens and translation catalog
        run: npm run check:tokens && npm run check:i18n
        working-directory: packages/extension
      - name: Unit suite
        run: npm test
        working-directory: packages/extension
      - name: Production and High dependency audit
        run: npm run scan:dependencies
        working-directory: packages/extension

  extension-coverage:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Sync core per-file coverage ratchet
        run: npm run test:coverage:sync
        working-directory: packages/extension

  extension-mv3:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: extension-playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/extension/package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: packages/extension
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: Evidence-enabled MV3 IndexedDB smoke
        run: npm run test:e2e:smoke
        working-directory: packages/extension
      - name: Guest and cloud-unavailable local-first journeys
        run: npm run test:e2e:local-first
        working-directory: packages/extension

  extension-sync-real-stack:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: extension-playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/extension/package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: packages/extension
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: Effect-page, recovery and pull-applier unit owners
        run: npm run test:sync-real-stack
        working-directory: packages/extension
      - name: Critical MV3 auth, popup, bookmark manager and pull journeys
        run: npm run evidence:critical-mv3
        working-directory: packages/extension

  extension-kns-09-release:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: KNS-09 release contracts and manifest
        run: npm run evidence:kns-09-release
        working-directory: packages/extension

  extension-kns-09-e2e:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: extension-playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/extension/package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: packages/extension
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: First-run and trash-restore evidence
        run: npm run evidence:first-run-sync && npm run evidence:trash-restore
        working-directory: packages/extension

  ci-gate:
    if: always()
    needs:
      - changes
      - static
      - test
      - publisher-coverage
      - security-coverage
      - sync-core-coverage
      - package
      - dependency-audit
      - conformance
      - server
      - server-integration
      - web
      - extension
      - extension-coverage
      - extension-mv3
      - extension-sync-real-stack
      - extension-kns-09-release
      - extension-kns-09-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PUBLISHER_RESULT: ${{ needs.publisher-coverage.result }}
          SECURITY_RESULT: ${{ needs.security-coverage.result }}
          SYNC_CORE_RESULT: ${{ needs.sync-core-coverage.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          SERVER_INTEGRATION_RESULT: ${{ needs.server-integration.result }}
          WEB_RESULT: ${{ needs.web.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          EXTENSION_COVERAGE_RESULT: ${{ needs.extension-coverage.result }}
          EXTENSION_MV3_RESULT: ${{ needs.extension-mv3.result }}
          EXTENSION_SYNC_REAL_STACK_RESULT: ${{ needs.extension-sync-real-stack.result }}
          EXTENSION_KNS09_RELEASE_RESULT: ${{ needs.extension-kns-09-release.result }}
          EXTENSION_KNS09_E2E_RESULT: ${{ needs.extension-kns-09-e2e.result }}
        run: |
          for result in "$CHANGES_RESULT" "$STATIC_RESULT" "$TEST_RESULT" "$PUBLISHER_RESULT" "$SECURITY_RESULT" "$SYNC_CORE_RESULT" "$PACKAGE_RESULT" "$DEPENDENCY_AUDIT_RESULT" "$CONFORMANCE_RESULT" "$SERVER_RESULT" "$SERVER_INTEGRATION_RESULT" "$WEB_RESULT" \
            "$EXTENSION_RESULT" "$EXTENSION_COVERAGE_RESULT" "$EXTENSION_MV3_RESULT" "$EXTENSION_SYNC_REAL_STACK_RESULT" \
            "$EXTENSION_KNS09_RELEASE_RESULT" "$EXTENSION_KNS09_E2E_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A selected colp-ci job did not pass: $result" >&2
              exit 1
            fi
          done
