name: colp-ci

# No trigger-level path filters: ci-gate is a required status check, so it must
# report on every pull request. The changes job selects affected jobs for all
# authors, including Dependabot. Docs/release-only changes run just changes/gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit audit steps below enforce the vulnerability gates. Install-time
# audits only duplicate those requests and can exhaust job timeouts on a 503.
env:
  npm_config_audit: 'false'

# Superseded PR runs share a group and are cancelled. Give every push/manual run
# its own group: even with cancel-in-progress=false, a newer docs-only push can
# replace a pending code run in a shared group and leave its changes untested.
concurrency:
  group: colp-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate CI selection and shared SDK pins without installing dependencies
        run: node --test scripts/select-ci-jobs.test.mjs scripts/check-sdk-pins.test.mjs
      - id: scope
        name: Select affected CI jobs
        run: node scripts/select-ci-jobs.mjs

  static:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'static')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate protocol examples
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check --only-binary=:all: --no-deps -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/pip" check
          "$RUNNER_TEMP/venv/bin/python" scripts/validate_examples.py
        working-directory: protocol
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Ensure generation tools are installed
        run: |
          if test ! -f node_modules/json-schema-to-typescript/package.json; then
            npm ci
          fi
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Protocol assets, generated types, traceability and typecheck
        run: npm run check:automation && npm run check:protocol && npm run check:types && npm run check:traceability && npm run typecheck && npm run check:source-size
        working-directory: packages/node
      - name: Dependency audit retry and SDK pin tests
        run: node --test scripts/audit-dependencies.test.mjs scripts/check-sdk-pins.test.mjs
      - name: One @know-n/colp build for server, extension and web
        run: node scripts/check-sdk-pins.mjs

  test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Full test suite with coverage; fail if evidence.json is stale
        run: xvfb-run --auto-servernum node scripts/generate-conformance-evidence.mjs --check --coverage
        working-directory: packages/node

  publisher-coverage:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'publisher-coverage')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Publisher coverage
        run: npm run test:coverage:publisher
        working-directory: packages/node

  security-coverage:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'security-coverage')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Security coverage
        run: npm run test:coverage:security
        working-directory: packages/node

  sync-core-coverage:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'sync-core-coverage')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Sync Core-used coverage
        run: npm run test:coverage:sync-core
        working-directory: packages/node

  package:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'package')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Build and validate package shape
        run: npm run build && npm run pack:check
        working-directory: packages/node
      - name: Verify clean-consumer Docker isolation
        run: |
          node --test scripts/tests/clean-consumer-sandbox.test.mjs
          artifact_dir=$(mktemp -d)
          trap 'rm -rf "$artifact_dir"' EXIT
          export npm_config_cache="$artifact_dir/npm-cache"
          node scripts/prepare-clean-consumer-cache.mjs "$npm_config_cache"
          npm pack --ignore-scripts --pack-destination "$artifact_dir" > /dev/null
          for tarball in "$artifact_dir"/*.tgz; do
            node scripts/clean-tarball-consumer.mjs "$tarball"
          done
        env:
          COLP_TEST_DOCKER_SANDBOX: '1'
        working-directory: packages/node
      - name: Example publication server self-test
        run: node examples/publication-server.mjs --self-test
        working-directory: packages/node
      - name: Packed surface contracts after dist/
        run: |
          xvfb-run --auto-servernum npx vitest run \
            tests/mcp/mcp-2026-07-28-sdk-acceptance-e2e.test.ts \
            tests/mcp/mcp-2026-07-28-read-package-surface-contract.test.ts \
            tests/mcp/mcp-2026-07-28-write-package-surface-contract.test.ts \
            tests/mcp/mcp-2026-07-28-sdk-lock-contract.test.ts \
            tests/security/package-export.pr8.test.ts \
            tests/sync/production-export-surface.test.ts
        working-directory: packages/node
      - name: Scan COLP dist before packaging evidence
        run: node scripts/scan-tracked-secrets.mjs --artifact packages/node/dist
      - name: Legacy MCP absence (source, declarations, tarball)
        run: npm run check:mcp-legacy-absence
        working-directory: packages/node

  dependency-audit:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'dependency-audit')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Production and High dependency audit
        run: npm run scan:dependencies
        working-directory: packages/node

  conformance:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'conformance')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/node/package-lock.json
            packages/conformance/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/node
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/node
      - name: Build the reference package
        run: npm run build
        working-directory: packages/node
      - name: Conformance runner tests
        run: npm ci && npm test
        working-directory: packages/conformance

  server:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'server')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/server
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/server
      - name: Lint
        run: npm run lint
        working-directory: packages/server
      - name: Import boundaries
        run: npm run check:imports && npm run check:migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        working-directory: packages/server
      - name: Source-size ratchet
        run: npm run check:source-size
        working-directory: packages/server
      - name: Runtime manifest drift
        run: npm run runtime:manifest:check
        working-directory: packages/server
      - name: Runtime dependency install and audit
        # The image installs from runtime/; the same frozen install must leave
        # test tooling out and carry no high or critical advisories.
        run: |
          npm ci --omit=dev --omit=peer --ignore-scripts --no-audit --no-fund --prefix runtime
          for forbidden in vitest tinypool tsx @vitest/mocker; do
            test ! -e "runtime/node_modules/$forbidden" || { echo "runtime install must not include $forbidden" >&2; exit 1; }
          done
          npm run scan:dependencies:runtime
        working-directory: packages/server
      - name: OpenAPI lint, drift and breaking-change checks
        run: npm run openapi:ci
        working-directory: packages/server
      - name: Unit suite
        run: npm run test:unit
        working-directory: packages/server
      - name: Static contract suite
        run: npm run test:static
        working-directory: packages/server
      - name: Production ingress TLS handshakes (IPv4, IPv6 and DNS)
        run: node --test deploy/tests/restore.test.mjs deploy/tests/tls-handshake.test.mjs

  # Each integration file builds its own migrated database, so the serial suite
  # runs for hours on one runner; six shards keep each job under the timeout.
  server-integration:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'server-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/server/package-lock.json
      - name: Frozen package install
        run: npm ci
        working-directory: packages/server
      # Product Sync Center integration tests execute the real extension store and workers.
      - name: Frozen extension harness install
        run: npm ci
        working-directory: packages/extension
      - name: PostgreSQL integration suite (shard ${{ matrix.shard }}/6)
        run: node scripts/with-postgres.mjs --isolated-owner -- npm run test:integration:inner -- --shard=${{ matrix.shard }}/6
        working-directory: packages/server

  server-capabilities:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'server-capabilities')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [system, evidence, redis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/server/package-lock.json
            packages/extension/package-lock.json
      - name: Frozen server install
        run: npm ci
        working-directory: packages/server
      - name: Frozen extension harness install
        run: npm ci
        working-directory: packages/extension
      - name: Run every test in the capability project
        run: xvfb-run --auto-servernum node scripts/with-postgres.mjs --isolated-owner -- node node_modules/vitest/vitest.mjs run --project ${{ matrix.project }}
        working-directory: packages/server

  web-browser:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'web-browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/web
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - name: Complete desktop and responsive browser suite
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        working-directory: packages/web

  web-acceptance:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'web-acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/web/package-lock.json
            packages/server/package-lock.json
      - run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/web
      - run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/server
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - name: Production CLI, PostgreSQL and built-web acceptance
        run: npm run test:acceptance
        working-directory: packages/web

  web:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'web')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - name: Lint (TypeScript and CSS ratchets)
        run: npm run lint && npm run lint:css
        working-directory: packages/web
      - name: Generated API types match the server documents
        run: npm run check:api-types
        working-directory: packages/web
      - name: Unit suite
        run: npm test
        working-directory: packages/web
      - name: Build-script contract tests
        run: npm run test:scripts
        working-directory: packages/web
      - name: Build web
        run: npm run build
        working-directory: packages/web
      - name: Production and development dependency audit
        run: npm run scan:dependencies
        working-directory: packages/web

  # The browser extension imports COLP Server's generated API types and runs its
  # browser harness against packages/server, so every extension job installs both.
  extension:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'extension')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
      - name: Frozen extension install
        run: npm ci
        working-directory: packages/extension
      - name: Rebuild allowlisted esbuild
        run: test ! -d node_modules/esbuild || npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci
        working-directory: packages/server
      - name: Types, lint, source size and production build
        run: npm run typecheck && npm run lint && npm run check:source-size && npm run build
        working-directory: packages/extension
      - name: Design tokens and translation catalog
        run: npm run check:tokens && npm run check:i18n
        working-directory: packages/extension
      - name: Unit suite
        run: npm test
        working-directory: packages/extension
      - name: Pinned Lean toolchain installer
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean model vector exporter
        run: lake build sync_export
        working-directory: formal/sync
      - name: Model-derived implementation vectors
        run: npm run test:sync-model
        working-directory: packages/extension
      - name: Production and High dependency audit
        run: npm run scan:dependencies
        working-directory: packages/extension

  extension-browser:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'extension-browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
            packages/web/package-lock.json
      - name: Frozen extension install
        run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server harness install
        run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/server
      - name: Frozen web harness install
        run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/web
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: Build browser fixtures
        run: npm run build -- --config config/e2e-fixture.json && npm run build:development
        working-directory: packages/extension
      - name: Build web fixture for cross-application browser cases
        run: npm run build
        working-directory: packages/web
      - name: Complete browser suite (shard ${{ matrix.shard }}/6)
        run: node ../server/scripts/with-postgres.mjs --isolated-owner -- npm run test:e2e:inner -- --shard=${{ matrix.shard }}/6
        working-directory: packages/extension

  self-hosted-browser:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'self-hosted-browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/extension/package-lock.json
            packages/server/package-lock.json
            packages/web/package-lock.json
      - name: Frozen extension install
        run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/extension
      - name: Frozen server install
        run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/server
      - name: Frozen web install
        run: npm ci && npm rebuild esbuild --ignore-scripts=false
        working-directory: packages/web
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: packages/extension
      - name: Install X11 extension permission driver
        run: sudo apt-get install --yes --no-install-recommends xdotool
      - name: Build production MV3 fixture
        run: npm run build -- --config config/e2e-fixture.json
        working-directory: packages/extension
