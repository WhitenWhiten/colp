<!doctype html>
<html lang="en" data-edition="self-hosted">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/colp-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A self-hosted COLP bookmark server." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f3f5f8" />
    <title>COLP Server</title>
    <link rel="stylesheet" href="/src/styles/print.css" media="print" />
    <style>
      @layer utilities {
        #agent-public-fallback[hidden] { display: none !important; }
      }
    </style>
    <noscript>
      <style>
        @layer utilities {
          #agent-public-fallback[hidden] { display: block !important; }
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- agent-public:start -->
<div id="agent-public-fallback" hidden>
<h1>COLP Server</h1>
<p>This is a self-hosted COLP bookmark server. Enable JavaScript to sign in.</p>
</div>
      <!-- agent-public:end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
