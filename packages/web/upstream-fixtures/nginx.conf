# Know-N Web：静态资源托管 + /api 反向代理到后端 api 服务（compose 服务名 api:3000）。
# 本文件被 COPY 到 /etc/nginx/conf.d/default.conf，从 http{} include；map 必须写在 server 之外。

map $http_accept $agent_wants_markdown {
    default 0;
    ~*text/markdown 1;
}

map $uri $agent_trust_md {
    /about   /about.md;
    /contact /contact.md;
    /privacy /privacy.md;
    /mcp         /mcp.md;
    /developers  /developers.md;
    /embed-guide /embed-guide.md;
    /extension   /extension.md;
}

# HTML policy only: API and object responses keep their own CSP. Share pages
# are intentionally embeddable; account/application documents are not.
map $uri $document_frame_ancestors {
    default "'none'";
    ~^/share/ "*";
}
map $uri $document_frame_options {
    default "DENY";
    ~^/share/ "";
}
map $sent_http_content_type $document_csp {
    default "";
    ~^text/html "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $document_frame_ancestors";
}
map $scheme $document_hsts {
    default "";
    https "max-age=31536000";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/known-document-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/markdown;

    # 附件上传等大请求体
    client_max_body_size 100m;

    # Docker embedded DNS. Fail closed if it does not answer so variable
    # proxy_pass cannot hang on a silent stub.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 1s;

    # 钉 404 状态。禁止无状态码的内部跳转到 404.html（nginx 常把响应变成 200）。
    # recursive_error_pages 默认 off 会让 @agent_404 内部的第二次 error_page
    # （418 → @agent_404_md）失效，markdown 客户端会直接收到裸 418。
    recursive_error_pages on;
    error_page 404 =404 @agent_404;

    # API 反向代理：同源 /api 路径，Session cookie、CSRF 均走这里。
    # 不在这里写 Cache-Control：JSON 由后端决定；公开图片字节走后端 immutable 头。
    # gzip 必须关：压缩改写响应字节后 nginx 会把强 ETag 降级成 W/ 弱校验器，
    # 前端原样回放成 If-Match 会被后端按“非强 entity-tag”400（favicon-policy
    # 等所有 ETag CAS 接口都中招）。API JSON 很小，压缩收益抵不上正确性。
    location /api/ {
        gzip off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # COLP manifest + sync/publication：扩展拉 collection 列表走
    # GET /colp/v0.1/sync/collections。若落入 location /，try_files 会把 HTML
    # 首页当成 200 返回，已登录的插件会显示 Collections could not be loaded。
    location = /.well-known/collection-protocol {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /colp/ {
        # 同 /api/：同步协议的 ETag/If-Match CAS 不能被 gzip 降级成弱校验器。
        gzip off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # D1 动态 OG 图：/og/collections/<slug>.png 由 api 渲染（可见性与缓存头
    # 与公开合集 HTML 同源）；后端 404（隐藏/未发布）必须透传，不回静态壳。
    location /og/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # MCP Streamable HTTP. POST-only at the API; GET must reach the API so
    # it can return 405 JSON instead of the web 405 HTML. Listen can idle
    # up to MCP_LISTEN_MAX_DURATION_MS (default 3600s). Exact `/mcp` does not
    # match `/mcp-compat`.
    location = /collections/-/mcp {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # MCP Host admission is exact host+port of PRODUCT_ORIGIN.
        # $host drops a non-default port (localhost:8081 → localhost).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3700s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /collections/-/mcp-compat {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3700s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # MCP first-touch machine-readable discovery (MCP2-02).
    location = /.well-known/mcp {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # RFC 9728 PRM + resource-path-inserted alias.
    location ^~ /.well-known/oauth-protected-resource {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # RFC 8414 issuer-inserted AS metadata (…/api/v1/auth).
    location ^~ /.well-known/oauth-authorization-server {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /ready is exact-matched on the host nginx; feature probes are not.
    location ^~ /ready/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Vite 带 hash 的产物。^~ 避免被后缀正则抢走；缺文件必须 404，禁止 SPA 回退成 HTML。
    location ^~ /assets/ {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=31536000" always;
        try_files $uri @retained_assets;
    }

    # Historical builds share the same immutable URLs. Only /assets/ can enter
    # this fallback; missing files remain a real 404, never the SPA document.
    location @retained_assets {
        root /var/lib/known-web-assets;
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=31536000" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /icons.svg {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /og-cover.png {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 代理文件：精确 location，禁止 SPA 回退。
    location = /robots.txt { }
    location = /sitemap.xml { }
    location = /sitemap-static.xml { }
    location = /sitemap-collections.xml {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /sitemap-profiles.xml {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /sitemap-reports.xml {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /llms.txt {
        charset utf-8;
    }

    location = /home.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }
    location = /about.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }
    location = /contact.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }
    location = /privacy.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }
    location = /mcp.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }
    location = /embed-guide.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files $uri =404;
    }
    location = /developers.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }
    location = /extension.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }
    location = /404.md {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
    }

    # 首页：非 markdown 只 try_files /index.html（禁止 $uri/）；markdown 走命名 location。
    location = / {
        error_page 418 = @home_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /index.html =404;
    }

    location @home_md {
        internal;
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /home.md =404;
    }

    location = /about {
        error_page 418 = @trust_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /about.html =404;
    }

    location = /contact {
        error_page 418 = @trust_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /contact.html =404;
    }

    location = /privacy {
        error_page 418 = @trust_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /privacy.html =404;
    }

    location = /mcp {
        error_page 418 = @trust_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /mcp.html =404;
    }

    location = /developers {
        error_page 418 = @trust_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /developers.html =404;
    }

    location = /embed-guide {
        error_page 418 = @trust_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /embed-guide.html =404;
    }

    location = /extension {
        error_page 418 = @trust_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /extension.html =404;
    }

    location @trust_md {
        internal;
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files $agent_trust_md =404;
    }

    # sitemap 里的 auth 壳页：构建期 stamp 出自己的 title / canonical / og:url
    # （dist/login.html、dist/register.html），不再以 index.html 的首页 canonical
    # 自我声明为首页副本。无 markdown 变体。stamped 文件缺失时回退通用壳。
    location = /login {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /login.html /index.html;
    }

    location = /register {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /register.html /index.html;
    }

    # R15-24: bare /share is the product Share page (dist/share.html, its own
    # title and canonical). Exact match wins over the bare-prefix regex below.
    location = /share {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files /share.html /index.html;
    }

    # /explore：origin 注入最新公开合集列表 + 本页 title/canonical（B1）。
    # 该页没有"不存在"语义，所以 404/405 回静态壳（200）：api 未注册该路由或
    # 非 GET/HEAD 方法都不能让发现页消失。上游 5xx 回 503 壳（R15-22）。
    location = /explore {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        error_page 404 405 = @spa_shell_fallback;
        error_page 500 502 503 504 =503 @spa_shell_unavailable;
    }

    # SPA 壳：浏览器每次向边缘再验证；边缘最多 60s。try_files 回退会内部跳到这里。
    location = /index.html {
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
    }

    # 公开合集 HTML：单段 slug 代理到 api 注入端点（/c 正型；/share /path /graph
    # 是 wrapper，注入的 canonical 指回 /c）。只拦 5xx 回静态壳；后端 404（未发布）
    # 必须透传。裸前缀与多级路径仍走 SPA 壳。
    location ~ ^/(c|share|path|graph)/[^/]+$ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 @spa_shell_unavailable;
    }

    # M-09 public Profile HTML/markdown and legacy canonical redirect. The API
    # owns negotiation and true 404/301; only upstream 5xx use the SPA shell.
    location ~ ^/(u|profile)/[^/]+$ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 @spa_shell_unavailable;
    }

    # Public report directory and issue pages. API 404 is authoritative; only
    # upstream failures use the hydratable SPA shell.
    location = /reports/ { return 308 /reports; }
    location ~ ^/reports/([^/]+)/issues/([^/]+)/$ { return 308 /reports/$1/issues/$2; }
    location ~ ^/reports/([^/]+)/$ { return 308 /reports/$1; }
    location ~ ^/reports(?:/[^/]+(?:/issues/[^/]+)?)?$ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 @spa_shell_unavailable;
    }

    location @spa_shell_fallback {
        internal;
        include /etc/nginx/known-document-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        rewrite ^ /index.html break;
    }

    # R15-22: upstream 5xx on a public page. Status stays 503 with Retry-After
    # so crawlers retry instead of indexing a soft error, and the body is the
    # hydratable shell.html (no canonical / og:url, not the homepage head).
    # Never cached: the next request must reach the recovered origin.
    location @spa_shell_unavailable {
        internal;
        include /etc/nginx/known-document-headers.conf;
        add_header Retry-After "120" always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept, Accept-Encoding" always;
        rewrite ^ /shell.html break;
    }

    # 账户、工具与站内搜索页仍返回可水合的 SPA 壳，但不得进入搜索索引。
    # 头必须写在命名 location，并用 rewrite ... break 保留到最终响应。
    location @noindex_shell {
        internal;
        include /etc/nginx/known-document-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        add_header Vary "Accept, Accept-Encoding" always;
        rewrite ^ /index.html break;
    }

    # M-03 尾斜杠规范化：公开单段路由与静态信任页统一 301 到无斜杠版本，
    # 消灭 `/about/`（原 404）与 `/c/<slug>/`（原通用壳 200）这类重复 URL。
    # 必须排在下方所有 SPA 正则之前：正则 location 按出现顺序首个命中。
    # Location 用相对路径：TLS 在宿主 nginx / Cloudflare 终止，容器内 $scheme 是 http，
    # 绝对 Location 会把用户先送回 http:// 再多跳一次。查询串原样保留。
    # 不覆盖未来 locale 目录（如 /zh-cn/，以斜杠为正型）；多级路径不在此收口。
    location ~ ^/(about|contact|privacy|mcp|developers|embed-guide|extension|explore|login|register)/$ {
        absolute_redirect off;
        return 301 /$1$is_args$args;
    }
    location ~ ^/(c|share|path|u|profile|r|graph)/([^/]+)/$ {
        absolute_redirect off;
        return 301 /$1/$2$is_args$args;
    }

    # 裸 public-shell 前缀与多级路径维持 SPA 壳（不与单段代理重叠）。
    location ~ ^/(c|share|path|graph|u|profile)/.+/ {
        try_files $uri /index.html;
    }
    location ~ ^/(c|share|path|graph|u|profile)$ {
        try_files $uri /index.html;
    }

    # 公开可索引 SPA（子路径与查询变体）。裸 /explore、/login、/register 由上方精确
    # location 接管；/graph/<slug> 由 wrapper 代理接管；Profile 由 M-09 代理接管；
    # 裸 /extension 由精确静态 location 接管。
    location ~ ^/(explore|login|register)(/|$) {
        try_files $uri /index.html;
    }

    # 账户、工具、结果页。段边界 (/|$) 防止短前缀吞掉未知路径。
    # /r/<id> 资源详情页无 origin 注入、内容单薄，且 M-06 已把裸 /r 定为 noindex：
    # 在 HTTP 层整体 noindex，待有注入再放回可索引组。
    location ~ ^/(today|updates|feed|read|library|dashboard|consent|reset-password|verify-email|auth|onboarding|creator|settings|export|sync|classify|import|notifications|credits|community|moderation|admin|approvals|ai|search|reports|r)(/|$) {
        try_files $uri @noindex_shell;
    }

    # M-05 的裸 /extension 保持公开静态页；仅站内 popup 工具显式 noindex。
    location = /extension/popup {
        try_files $uri @noindex_shell;
    }

    location @agent_404 {
        internal;
        # =404 钉状态：无状态码的 `=` 会让 404.md 以 200 返回。
        error_page 418 =404 @agent_404_md;
        if ($agent_wants_markdown) {
            return 418;
        }
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
        rewrite ^ /404.html break;
    }

    location @agent_404_md {
        internal;
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/known-document-headers.conf;
        add_header Vary "Accept, Accept-Encoding" always;
        rewrite ^ /404.md break;
    }

    # catch-all 必须仍叫 location / {（remote.sh awk 在此行前插入 /ready）。
    location / {
        try_files $uri $uri/ =404;
    }
}
