components:
  schemas:
    AutomationCapabilities:
      type: object
      properties:
        contractVersion:
          const: 0.2.1-design
        ruleApiVersions:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 10
        runtimeProfiles:
          type: array
          items:
            type: string
            enum:
              - browser-bounded-v1
              - server-cel-v1
          maxItems: 2
        triggerModes:
          type: array
          items:
            type: string
            enum:
              - each
              - countBatch
              - scheduledBatch
          maxItems: 3
        taskTypes:
          type: array
          items:
            type: string
            enum:
              - classify.root
              - classify.refine
              - tags.generate
              - summary.generate
              - metadata.resolve
              - review.generate
              - digest.generate
          maxItems: 16
        eventsEnabled:
          type: boolean
        limits:
          type: object
          properties:
            maxRules:
              type: integer
              minimum: 0
            maxExpressionBytes:
              type: integer
              minimum: 0
            maxTasksPerRule:
              type: integer
              minimum: 0
          required:
            - maxRules
            - maxExpressionBytes
            - maxTasksPerRule
          additionalProperties: false
      required:
        - contractVersion
        - ruleApiVersions
        - runtimeProfiles
        - triggerModes
        - taskTypes
        - eventsEnabled
        - limits
      additionalProperties: false
    AutomationProductErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              maxLength: 100
            message:
              type: string
              maxLength: 2000
            requestId:
              type: string
              maxLength: 128
              minLength: 1
              pattern: ^[A-Za-z0-9._~-]+$
            recovery:
              type: string
              enum:
                - same_request
                - refresh_and_retry
                - restart_from_first_page
                - user_action
                - none
            sameRequestRetrySafe:
              type: boolean
            precondition:
              anyOf:
                - type: string
                  enum:
                    - resource
                    - content
                - type: "null"
            currentEtag:
              anyOf:
                - type: string
                  maxLength: 160
                - type: "null"
            retryAfterSeconds:
              anyOf:
                - type: integer
                  minimum: 0
                - type: "null"
            fieldErrors:
              type: array
              items:
                $ref: "#/components/schemas/AutomationProductFieldError"
              maxItems: 100
          required:
            - code
            - message
            - requestId
            - recovery
            - sameRequestRetrySafe
            - precondition
            - currentEtag
            - retryAfterSeconds
            - fieldErrors
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    AutomationProductFieldError:
      type: object
      properties:
        path:
          type: string
          maxLength: 500
        code:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 2000
      required:
        - path
        - code
        - message
      additionalProperties: false
    AutomationValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        normalizedDefinition:
          $ref: "#/components/schemas/AutomationRuleDefinition"
        semanticDigest:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/AutomationDiagnostic"
          maxItems: 100
        supportedHosts:
          type: array
          items:
            type: string
            enum:
              - browser
              - server
          maxItems: 2
      required:
        - valid
        - diagnostics
        - supportedHosts
      additionalProperties: false
    AutomationRuleDefinition:
      type: object
      properties:
        apiVersion:
          const: colp.automation/v1
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AutomationRoleDeclaration"
          maxItems: 32
        on:
          type: string
          enum:
            - bookmark.intake
            - node.created
            - node.updated
            - intake.completed
            - bookmark.link_health.changed
        scope:
          $ref: "#/components/schemas/AutomationScopeSpec"
        match:
          $ref: "#/components/schemas/AutomationPredicate"
        intake:
          $ref: "#/components/schemas/AutomationIntakeSpec"
        trigger:
          $ref: "#/components/schemas/AutomationTriggerSpec"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/AutomationTaskSpec"
          maxItems: 8
        route:
          $ref: "#/components/schemas/AutomationRouteSpec"
        policy:
          $ref: "#/components/schemas/AutomationRulePolicy"
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
      required:
        - apiVersion
        - name
        - roles
        - on
        - scope
        - match
        - trigger
        - tasks
        - route
        - policy
        - priority
      additionalProperties: false
    AutomationRoleDeclaration:
      type: object
      properties:
        key:
          type: string
          maxLength: 80
          pattern: ^[a-z][A-Za-z0-9]*$
        kind:
          type: string
          enum:
            - folder
            - executor
            - entityMap
            - vocabulary
        required:
          type: boolean
        description:
          type: string
          maxLength: 1000
        mustBeWithinRole:
          type: string
          maxLength: 80
      required:
        - key
        - kind
        - required
        - description
      additionalProperties: false
    AutomationScopeSpec:
      type: object
      properties:
        collectionId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        folderRole:
          type: string
          maxLength: 80
        includeDescendants:
          type: boolean
      required: []
      additionalProperties: false
    AutomationPredicate:
      oneOf:
        - $ref: "#/components/schemas/AutomationFieldPredicate"
        - $ref: "#/components/schemas/AutomationAllPredicate"
        - $ref: "#/components/schemas/AutomationAnyPredicate"
        - $ref: "#/components/schemas/AutomationNotPredicate"
        - $ref: "#/components/schemas/AutomationCelPredicate"
    AutomationFieldPredicate:
      type: object
      properties:
        kind:
          const: field
        field:
          type: string
          enum:
            - bookmark.url.host
            - bookmark.url.path
            - bookmark.title
            - bookmark.tags
            - bookmark.kind
            - event.type
            - event.origin
            - event.changedFields
        op:
          type: string
          enum:
            - eq
            - in
            - contains
            - hostSuffix
            - hasTag
            - startsWith
        value:
          oneOf:
            - type: string
              maxLength: 1024
            - type: array
              items:
                type: string
                maxLength: 200
              maxItems: 100
      required:
        - kind
        - field
        - op
        - value
      additionalProperties: false
      description: Operator/field compatibility is checked semantically. startsWith is literal case-sensitive prefix
        comparison on normalized URL path; never substring search or an artificial UI anchor.
    AutomationAllPredicate:
      type: object
      properties:
        kind:
          const: all
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutomationPredicate"
          maxItems: 32
      required:
        - kind
        - items
      additionalProperties: false
    AutomationAnyPredicate:
      type: object
      properties:
        kind:
          const: any
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutomationPredicate"
          maxItems: 32
      required:
        - kind
        - items
      additionalProperties: false
    AutomationNotPredicate:
      type: object
      properties:
        kind:
          const: not
        item:
          $ref: "#/components/schemas/AutomationPredicate"
      required:
        - kind
        - item
      additionalProperties: false
    AutomationCelPredicate:
      type: object
      properties:
        kind:
          const: cel
        expression:
          type: string
          maxLength: 4096
          minLength: 1
        profile:
          const: colp-cel-v1
        dependencies:
          type: array
          items:
            type: string
            maxLength: 128
          maxItems: 64
      required:
        - kind
        - expression
        - profile
        - dependencies
      additionalProperties: false
    AutomationIntakeSpec:
      type: object
      properties:
        folderRole:
          type: string
          maxLength: 80
        constraint:
          type: string
          enum:
            - exact
            - withinSubtree
        satisfies:
          type: array
          items:
            type: string
            enum:
              - classify.root
          maxItems: 1
        onUnusableBinding:
          const: keepOriginalAndBlock
        respectExplicitSelection:
          const: true
      required:
        - folderRole
        - constraint
        - satisfies
        - onUnusableBinding
        - respectExplicitSelection
      additionalProperties: false
    AutomationTriggerSpec:
      oneOf:
        - $ref: "#/components/schemas/AutomationEachTrigger"
        - $ref: "#/components/schemas/AutomationCountTrigger"
        - $ref: "#/components/schemas/AutomationScheduleTrigger"
    AutomationEachTrigger:
      type: object
      properties:
        mode:
          const: each
      required:
        - mode
      additionalProperties: false
    AutomationCountTrigger:
      type: object
      properties:
        mode:
          const: countBatch
        count:
          type: integer
          minimum: 2
          maximum: 1000
        distinctBy:
          type: string
          enum:
            - node
            - normalizedUrl
        partition:
          type: string
          enum:
            - rule
            - collection
            - folder
      required:
        - mode
        - count
        - distinctBy
        - partition
      additionalProperties: false
    AutomationScheduleTrigger:
      type: object
      properties:
        mode:
          const: scheduledBatch
        cron:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 100
        nonEmptyOnly:
          const: true
        misfire:
          type: string
          enum:
            - coalesce
            - skip
        dst:
          const: skipMissingOnceRepeated
      required:
        - mode
        - cron
        - timezone
        - nonEmptyOnly
        - misfire
        - dst
      additionalProperties: false
      description: Later-milestone capability (AU-32); reject with unsupported_capability until mounted. Five-field cron.
    AutomationTaskSpec:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        type:
          type: string
          enum:
            - classify.root
            - classify.refine
            - tags.generate
            - summary.generate
            - metadata.resolve
            - review.generate
            - digest.generate
        after:
          type: array
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
          maxItems: 8
          uniqueItems: true
        executorRole:
          type: string
          maxLength: 80
        folderRole:
          type: string
          maxLength: 80
        entityMapRole:
          type: string
          maxLength: 80
        vocabularyRole:
          type: string
          maxLength: 80
        required:
          type: boolean
        outputContract:
          type: string
          maxLength: 100
        inputFields:
          type: array
          items:
            type: string
            enum:
              - url
              - title
              - description
              - note
              - tags
              - metadata
              - readableText
              - folderDefinitions
          maxItems: 8
          uniqueItems: true
        instruction:
          type: string
          maxLength: 3000
        allowCreateFolder:
          type: boolean
      required:
        - id
        - type
        - after
        - executorRole
        - required
        - outputContract
        - inputFields
        - instruction
      additionalProperties: false
    AutomationRouteSpec:
      type: object
      properties:
        mode:
          type: string
          enum:
            - targets
            - broadcast
        targetIds:
          type: array
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
          maxItems: 20
        audience:
          type: string
          enum:
            - optedInAuthorizedTargets
        execution:
          type: string
          enum:
            - single
            - firstClaim
            - perTarget
      required:
        - mode
        - execution
      additionalProperties: false
    AutomationRulePolicy:
      type: object
      properties:
        history:
          const: fromActivation
        imports:
          type: string
          enum:
            - exclude
            - include
        restores:
          const: exclude
        userEdits:
          const: preserve
        sameStageReentry:
          const: deny
        maxHops:
          type: integer
          minimum: 1
          maximum: 16
        conflictingPlacement:
          const: review
        privacy:
          type: string
          enum:
            - standard
            - restricted
        broadcastAllowed:
          type: boolean
        maxRunsPerDay:
          type: integer
          minimum: 1
          maximum: 10000
        pauseMode:
          const: stopAdmissionHoldPending
        missingInput:
          type: string
          enum:
            - defer
            - review
      required:
        - history
        - imports
        - restores
        - userEdits
