      required:
        - reason
        - expectedEffectDigest
        - effectReceiptId
      additionalProperties: false
      description: Select exactly one recorded effect. M1 compensates a verified placement only; M2 links an existing
        plan/version. Reject stale collection/content fences. Never delete the saved bookmark to undo its placement or
        restore a broad snapshot over unrelated work.
    AutomationRuleBundle:
      type: object
      properties:
        revision:
          type: string
          maxLength: 128
          minLength: 1
        profile:
          const: browser-bounded-v1
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AutomationCompiledRule"
          maxItems: 1000
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        digest:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        removedRuleIds:
          type: array
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
          maxItems: 1000
        paused:
          type: boolean
        settingsRevision:
          type: integer
          minimum: 0
          description: Monotonically increasing owner settings sequence; never compare opaque bundle revisions lexically.
      required:
        - revision
        - profile
        - rules
        - issuedAt
        - expiresAt
        - digest
        - removedRuleIds
        - paused
        - settingsRevision
      additionalProperties: false
      description: Full authenticated snapshot. No model credentials or subscription secrets; device mappings remain device-local.
    AutomationCompiledRule:
      type: object
      properties:
        ruleId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        ruleRevision:
          type: string
          maxLength: 128
          minLength: 1
        bindingRevision:
          type: string
          maxLength: 128
          minLength: 1
        programId:
          type: string
          enum:
            - hostRoute
            - fieldFilter
            - tagTransition
        parameters:
          type: object
          properties:
            host:
              type: string
              maxLength: 253
            folderRole:
              type: string
              maxLength: 80
            includeSubdomains:
              type: boolean
            tag:
              type: string
              maxLength: 100
          required: []
          additionalProperties: false
        nativeBindingHints:
          $ref: "#/components/schemas/AutomationRoleBindings"
        semanticDigest:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        definition:
          $ref: "#/components/schemas/AutomationRuleDefinition"
      required:
        - ruleId
        - ruleRevision
        - bindingRevision
        - programId
        - parameters
        - nativeBindingHints
        - semanticDigest
        - definition
      additionalProperties: false
      description: Finite packaged-program parameters, not a remotely fetched script. Profile eligibility is checked before
        installation.
    AutomationBundleAckInput:
      type: object
      properties:
        deviceId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        bundleRevision:
          type: string
          maxLength: 128
          minLength: 1
        status:
          type: string
          enum:
            - applied
            - partiallyApplied
            - rejected
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/AutomationDiagnostic"
          maxItems: 100
      required:
        - deviceId
        - bundleRevision
        - status
        - diagnostics
      additionalProperties: false
    AutomationReceiptIngestResult:
      type: object
      properties:
        receiptId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        state:
          type: string
          enum:
            - waitingForSync
            - accepted
            - review
            - rejected
        satisfiedTaskTypes:
          type: array
          items:
            type: string
            enum:
              - classify.root
              - classify.refine
              - tags.generate
              - summary.generate
              - metadata.resolve
              - review.generate
              - digest.generate
          maxItems: 16
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/AutomationDiagnostic"
          maxItems: 100
      required:
        - receiptId
        - state
        - satisfiedTaskTypes
        - diagnostics
      additionalProperties: false
    AutomationLocalReceiptInput:
      type: object
      properties:
        deviceId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        replicaGeneration:
          type: integer
          minimum: 1
        localReceiptId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        operationId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          description: Canonical Sync create operation ID, not chrome.bookmarks operation or native node identity.
        ruleId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
        ruleRevision:
          type: string
          maxLength: 128
          minLength: 1
        bindingRevision:
          type: string
          maxLength: 128
          minLength: 1
        bundleRevision:
          type: string
          maxLength: 128
          minLength: 1
        inputDigest:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        satisfiedTaskTypes:
          type: array
          items:
            const: classify.root
          maxItems: 1
          uniqueItems: true
          description: Advisory intake satisfaction. Server verifies committed placement and pinned rule; never trusts this to
            discharge enrichment tasks.
        committedNode:
          $ref: "#/components/schemas/AutomationFolderRef"
          description: Canonical resource identity (serverUuid, collectionId, nodeId); FolderRef is reused structurally, but the
            node is a bookmark and must be checked as such.
        resultDigests:
          type: array
          items:
            type: string
            maxLength: 64
            pattern: ^[a-f0-9]{64}$
          maxItems: 1
        placementOperationId:
          $ref: "#/components/schemas/AutomationOpaqueId"
          description: Canonical move operation ID for an observed-create correction. Required semantically for that path; omitted
            for pre-save placement.
        beforeFolder:
          $ref: "#/components/schemas/AutomationFolderRef"
          description: Canonical original/default destination observed before rule placement. Advisory until checked against
            canonical operations; never invented to offer Undo.
      required:
        - deviceId
        - replicaGeneration
        - localReceiptId
        - operationId
        - ruleId
        - ruleRevision
        - bindingRevision
        - bundleRevision
        - inputDigest
        - satisfiedTaskTypes
        - resultDigests
        - committedNode
      additionalProperties: false
      description: Device-authenticated canonical evidence, not an authorization grant. Native ID mapping and native
        observation generation remain inside the extension. Both canonical operations must be joined before accepting an
        observed-create receipt.
    AutomationPauseState:
      type: object
      properties:
        paused:
          type: boolean
        pausedAt:
          type:
            - string
            - "null"
          format: date-time
        pausedBy:
          type:
            - string
            - "null"
          enum:
            - owner
            - restore
            - capacity
            - null
        revision:
          $ref: "#/components/schemas/AutomationRevision"
        heldJobs:
          type: integer
          minimum: 0
      required:
        - paused
        - pausedAt
        - pausedBy
        - revision
        - heldJobs
      additionalProperties: false
    AutomationPauseInput:
      type: object
      properties:
        paused:
          type: boolean
        reason:
          type: string
          maxLength: 1000
      required:
        - paused
      additionalProperties: false
    AutomationAutomationExport:
      type: object
      properties:
        contractVersion:
          const: 0.2.1-design
        exportedAt:
          type: string
          format: date-time
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAutomationExportRule"
          maxItems: 500
      required:
        - contractVersion
        - exportedAt
        - rules
      additionalProperties: false
    AutomationAutomationExportRule:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/AutomationPortableRuleDefinition"
        desiredState:
          type: string
          enum:
            - draft
            - enabled
            - paused
            - archived
          description: Historical source state only. An importer MUST create draft, never activate from this value.
        bindingsByPath:
          type: object
          additionalProperties:
            type: string
            maxLength: 2000
          description: Role key to folder path at export time; targets and secrets are never exported.
      required:
        - rule
        - desiredState
        - bindingsByPath
      additionalProperties: false
    AutomationPortableRuleDefinition:
      type: object
      properties:
        apiVersion:
          const: colp.automation/v1
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type: string
          maxLength: 2000
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AutomationRoleDeclaration"
          maxItems: 32
        on:
          type: string
          enum:
            - bookmark.intake
            - node.created
            - node.updated
            - intake.completed
            - bookmark.link_health.changed
        scope:
          $ref: "#/components/schemas/AutomationPortableScopeSpec"
        match:
          $ref: "#/components/schemas/AutomationPredicate"
        intake:
          $ref: "#/components/schemas/AutomationIntakeSpec"
        trigger:
          $ref: "#/components/schemas/AutomationTriggerSpec"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/AutomationTaskSpec"
          maxItems: 8
        route:
          $ref: "#/components/schemas/AutomationPortableRouteSpec"
        policy:
          $ref: "#/components/schemas/AutomationRulePolicy"
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
      required:
        - apiVersion
        - name
        - roles
        - on
        - scope
        - match
        - trigger
        - tasks
        - route
        - policy
        - priority
      additionalProperties: false
      description: Template/export logic before installation. collectionSlot and targetSlots are symbolic; no live collection
        or target IDs. Resolve with Owner review into a draft RuleDefinition before validation/activation.
    AutomationPortableScopeSpec:
      type: object
      properties:
        folderRole:
          type: string
          maxLength: 80
        includeDescendants:
          type: boolean
        collectionSlot:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - collectionSlot
      additionalProperties: false
    AutomationPortableRouteSpec:
      type: object
      properties:
        mode:
          type: string
          enum:
            - targets
            - broadcast
        audience:
          type: string
          enum:
            - optedInAuthorizedTargets
        execution:
          type: string
          enum:
            - single
            - firstClaim
            - perTarget
        targetSlots:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 20
      required:
        - mode
        - execution
      additionalProperties: false
  responses:
    Automation400:
      description: Malformed input or invalid rule.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation401:
      description: Authentication required.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation403:
      description: Current authority or host-mode policy denies operation.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation404:
      description: Unknown, disabled or concealed resource.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation409:
      description: Conflict, stale inputs, unavailable binding or command-body mismatch.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation412:
      description: ETag does not match.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation413:
      description: Payload too large.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation422:
      description: Well-formed input violates a declared semantic constraint.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation428:
      description: Required revision precondition missing.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation429:
      description: Rate or work budget exhausted.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation500:
      description: Internal failure with a non-sensitive request identifier.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
    Automation503:
      description: Required service unavailable.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Request-Id:
          schema:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9._~-]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationProductErrorEnvelope"
  parameters:
    AutomationCommandId:
      in: header
      name: Known-Command-Id
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 1
      description: "Stable command identity. Scope: authenticated principal + operation + addressed resource. Same
        identity/different canonical body returns 409."
    AutomationCsrf:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        maxLength: 1024
      description: "Verified host CSRF header (evidence R23): the server reads `x-csrf-token` together with the Origin
        allowlist on cookie-authenticated writes. Re-checked at AW-01. Never introduce a second CSRF scheme."
    AutomationOrigin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
        maxLength: 2048
        format: uri
      description: Validate against existing host trusted-origin policy for cookie-authenticated mutations.
    AutomationCursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 2048
    AutomationLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AutomationIfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        maxLength: 160
      description: Strong ETag from the addressed automation resource, never a node publication revision.
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      description: Host-authenticated device or registered internal executor bearer, with operation-specific automation
        scopes. MCP worker tools use MCP OAuth instead; this is not an extra login system.
