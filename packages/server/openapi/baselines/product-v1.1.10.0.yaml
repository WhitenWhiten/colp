openapi: 3.1.0
info:
  title: Known Product API
  version: 1.10.0
  description: Phase 1 Web Product API. This contract is separate from COLP Publication, Publisher, Sync, MCP, and Admin surfaces. Application commands and COLP wire types are mapped explicitly and are not generated from this document. info.version 1.10.0 adds the narrow authenticated Product Sync Center while retaining the additive Phase 2B Annotation, Relation, Saved Resource, Reading Progress, and bounded PostgreSQL Search surfaces while preserving the accepted Product 1.6 client contract under ADR-0015, plus the authenticated owned Collection list and Profile mutation. Generated-client drift, command replay versioning, and breaking-change policy are governed by that ADR.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
tags:
  - name: BrowserAuth
    description: Browser navigation endpoints for the OIDC authorization flow.
  - name: Session
    description: Browser Session bootstrap and revocation.
  - name: Account
    description: Current authenticated Account and Profile views.
  - name: Profiles
    description: Public Profile projections and their published Collections.
  - name: Collections
    description: Phase 1 Collection creation, metadata, and Editor queries.
  - name: Nodes
    description: Phase 1 Folder and Bookmark commands.
  - name: Annotations
    description: Authenticated Product Annotation reads and canonical commands.
  - name: Relations
    description: Authenticated Product Relation reads and canonical commands.
  - name: SavedResources
    description: Private account-owned saved Collection and Node state.
  - name: ReadingProgress
    description: Private account-owned reading state for Collections and Nodes.
  - name: Search
    description: Bounded PostgreSQL Search with fresh authority projection.
  - name: SyncCenter
    description: Private server-authoritative Replica and Conflict management.
paths:
  /api/v1/auth/oidc/start:
    get:
      tags:
        - BrowserAuth
      operationId: startOidcAuthorization
      summary: Start the browser OIDC authorization flow
      description: Starts Authorization Code with PKCE. Invalid returnTo values fall back to the fixed dashboard. This navigation operation is excluded from the generated business API client.
      security: []
      parameters:
        - $ref: '#/components/parameters/ReturnTo'
      responses:
        '302':
          description: Redirect to the configured OIDC issuer.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/oidc/callback:
    get:
      tags:
        - BrowserAuth
      operationId: completeOidcAuthorization
      summary: Complete the browser OIDC authorization flow
      description: Accepts exactly one success branch (code plus state) or one failure branch (error plus state). Optional standard iss, session_state, error_description, and error_uri parameters are accepted; only iss is used and must match the configured issuer. Every failure clears the one-time transaction when safe to do so. Terminal denials redirect to the fixed /login?auth=failed path. Non-replayable failures after the authorization code or login transaction is consumed redirect to /login?auth=restart so the browser starts a brand-new login (the same code/state must never be retried).
      security: []
      parameters:
        - $ref: '#/components/parameters/OidcCode'
        - $ref: '#/components/parameters/OidcState'
        - $ref: '#/components/parameters/OidcError'
        - $ref: '#/components/parameters/OidcIssuer'
        - $ref: '#/components/parameters/OidcSessionState'
        - $ref: '#/components/parameters/OidcErrorDescription'
        - $ref: '#/components/parameters/OidcErrorUri'
      responses:
        '303':
          description: Redirect to the validated same-origin returnTo on success; to the fixed /login?auth=failed location on terminal denial; or to /login?auth=restart when the flow is non-replayable and the user must begin a new login.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
  /api/v1/session:
    get:
      tags:
        - Session
      operationId: getSession
      summary: Get the current browser session state
      security:
        - cookieAuth: []
        - {}
      responses:
        '200':
          description: Current authenticated or unauthenticated session state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Session
      operationId: deleteSession
      summary: Revoke the current browser session
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me:
    get:
      tags:
        - Account
      operationId: getMe
      summary: Get the current account and profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current account and minimal profile view.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
        - Account
      operationId: updateMe
      summary: Update the current profile handle and display name
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Persisted current account and profile view.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: handle_taken.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSettingsErrorEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: invalid_handle or invalid_display_name with fieldErrors.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSettingsErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/profiles/{handle}:
    get:
      tags:
        - Profiles
      operationId: getPublicProfile
      summary: Get a public Profile and one page of public Collections
      description: Returns the same public representation for anonymous and Session principals. The representation validator covers the final JSON bytes, page identity, negotiated media type, and Product contract version.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicProfileHandlePath'
        - $ref: '#/components/parameters/PublicProfileLimit'
        - $ref: '#/components/parameters/PublicProfileCursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Public Profile and one stable keyset page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicProfileCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/VaryAccept'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfilePage'
        '304':
          description: The recomputed current public representation matches If-None-Match.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicProfileCache'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/VaryAccept'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags:
        - Profiles
      operationId: headPublicProfile
      summary: Get public Profile representation metadata without a body
      description: Performs the same path, query, projection, current-representation, and conditional request work as GET, but never sends representation bytes.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicProfileHandlePath'
        - $ref: '#/components/parameters/PublicProfileLimit'
        - $ref: '#/components/parameters/PublicProfileCursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current public Profile representation metadata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicProfileCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/VaryAccept'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '304':
          description: The recomputed current public representation matches If-None-Match.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicProfileCache'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/VaryAccept'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections:
    get:
      tags:
        - Collections
      operationId: listOwnedCollections
      summary: List live Collections owned by the current Session subject
      description: Returns one live keyset page ordered by updatedAt descending then ID bytewise ascending. A first page accepts kind, visibility, and limit. A continuation accepts cursor only. Unknown, duplicate, empty, or non-canonical query values are invalid_query. Cursor scope failures are uniformly invalid_cursor. Titles, filters, and cursors must not be logged.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OwnedCollectionKind'
        - $ref: '#/components/parameters/OwnedCollectionVisibility'
        - $ref: '#/components/parameters/OwnedCollectionLimit'
        - $ref: '#/components/parameters/OwnedCollectionCursor'
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          description: One private page of Collections owned by the current Subject.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedCollectionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - Collections
      operationId: createCollection
      summary: Create an owned Collection and Root atomically
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection and Root created in one committed transaction.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}/editor:
    get:
      tags:
        - Collections
      operationId: getCollectionEditorPage
      summary: Get one revision-fenced Editor page
      description: The first page accepts limit. A continuation request accepts cursor and must omit limit. The cursor is scoped to the principal, Collection, content revision, policy revision, comparator, and page size. The client publishes the assembled tree only after hasMore is false.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/EditorLimit'
        - $ref: '#/components/parameters/EditorCursor'
      responses:
        '200':
          description: One consistent Editor page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditorSnapshotConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}:
    get:
      tags:
        - Collections
      operationId: getPublicCollectionPage
      summary: Get one revision-fenced public Collection page by slug
      description: For this GET operation, collectionId contains the canonical publication slug. Reads the public projection anonymously or the member projection for an optional valid browser Session. Publish the assembled tree only after hasMore is false; snapshot_expired requires a full restart.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicCollectionSlugPath'
        - $ref: '#/components/parameters/PublicCollectionLimit'
        - $ref: '#/components/parameters/PublicCollectionCursor'
      responses:
        '200':
          description: One public/member Collection page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            Vary:
              description: Includes Cookie to isolate anonymous and member representations.
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCollectionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditorSnapshotConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
        - Collections
      operationId: updateCollection
      summary: Update Phase 1 Collection metadata
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CollectionMergePatch'
      responses:
        '200':
          description: Updated Collection with current concurrency fences.
          headers:
            Location:
              description: Absolute canonical public page URL when the Collection has been published.
              schema:
                type: string
                format: uri
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}/nodes:
    post:
      tags:
        - Nodes
      operationId: createCollectionNode
      summary: Create a Folder or Bookmark
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: Node created with updated Parent and Collection fences.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNodeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}/nodes/{nodeId}:
    patch:
      tags:
        - Nodes
      operationId: updateCollectionNode
      summary: Update Folder or Bookmark content
      description: Root is immutable through Product Node operations.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/NodeMergePatch'
      responses:
        '200':
          description: Updated Node and current Collection fence.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNodeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Nodes
      operationId: deleteCollectionNode
      summary: Delete a Node or explicitly confirmed subtree
      description: recursive=true is valid only for Folder targets and requires If-Content-Match in addition to If-Match. If-Content-Match is rejected on non-recursive requests. Root cannot be deleted by this operation.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Recursive'
