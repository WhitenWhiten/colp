  /api/v1/search:
    get:
      tags:
        - Search
      operationId: searchResources
      summary: Search authorized Product resources
      description: Searches Collection, Node, public Profile, and Annotation branches. Anonymous requests receive only currently public opted-in resources and may use shared caching. A valid Session broadens recall only after current authority is rechecked and always receives private, no-store caching. Search cursors are signed and bound to normalized query, selected types, page size, comparator, and principal projection. Conditional requests still execute the current authority projection before returning 304.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchType'
        - $ref: '#/components/parameters/SearchCursor'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchAccept'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current authorized Search page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '304':
          description: The freshly authorized selected representation matches If-None-Match; no body is sent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags:
        - Search
      operationId: headSearchResources
      summary: Get authorized Search representation metadata without a body
      description: Performs the same raw-query admission, Session projection, candidate lookup, current-authority recheck, conditional request, and timeout work as GET, but never sends representation bytes.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchType'
        - $ref: '#/components/parameters/SearchCursor'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchAccept'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current authorized Search representation metadata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '304':
          description: The freshly authorized selected representation matches If-None-Match; no body is sent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-known_session
      description: HttpOnly, Secure, SameSite=Lax, Path=/, no Domain. Phase 1 supports HTTPS same-site Web/API deployments only.
  parameters:
    PublicProfileHandlePath:
      name: handle
      in: path
      required: true
      description: Case-insensitive public handle locator, canonicalized to lowercase by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^(?!\.{1,2}$)[A-Za-z0-9._~-]{1,64}$
    PublicProfileLimit:
      name: limit
      in: query
      required: false
      description: Number of public Collection summaries in this keyset page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PublicProfileCursor:
      name: cursor
      in: query
      required: false
      description: Signed Profile-only Product cursor. Do not log, parse, or reuse for another purpose.
      schema:
        $ref: '#/components/schemas/PublicProfileCursorValue'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: One raw header field containing RFC entity-tag validators or *. Duplicate header fields are rejected before framework normalization.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    SearchQuery:
      name: q
      in: query
      required: true
      description: Search text. The transport applies a 2048-byte encoded component limit before percent decoding, then bounded NFKC normalization, code-point, token, combining-mark, and operator complexity limits.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    SearchType:
      name: type
      in: query
      required: false
      description: Repeat once per selected result type; duplicate values and comma-joined values are invalid.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          $ref: '#/components/schemas/SearchResourceType'
    SearchCursor:
      name: cursor
      in: query
      required: false
      description: Signed Search-only continuation. Omit limit when continuing and never parse or log this value.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    SearchLimit:
      name: limit
      in: query
      required: false
      description: First-page result count. A continuation uses the page size signed into its cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchAccept:
      name: Accept
      in: header
      required: false
      description: RFC media range list. Search selects application/json; unsupported ranges return 406.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    AcceptJson:
      name: Accept
      in: header
      required: false
      description: RFC media range list. This operation selects application/json; unsupported ranges return 406.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    OwnedCollectionKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CollectionKind'
    OwnedCollectionVisibility:
      name: visibility
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CollectionVisibility'
    OwnedCollectionLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    OwnedCollectionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque Subject-, filter-, limit-, sort-, comparator-, key-version-, purpose-, and expiry-bound continuation. Must be the only query parameter.
      schema:
        $ref: '#/components/schemas/Cursor'
    PublicCollectionSlugPath:
      name: collectionId
      in: path
      required: true
      description: Canonical lowercase publication slug.
      schema:
        $ref: '#/components/schemas/PublicationLocatorSlug'
    PublicCollectionLimit:
      name: limit
      in: query
      required: false
      description: Page node limit, including the Root on the first page.
      schema:
        type: integer
        minimum: 2
        maximum: 500
        default: 200
    PublicCollectionCursor:
      name: cursor
      in: query
      required: false
      description: Signed Product public-page cursor. It is not a COLP or Editor cursor.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Case-sensitive opaque Collection ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Case-sensitive opaque Node ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    AnnotationId:
      name: annotationId
      in: path
      required: true
      description: Case-sensitive opaque Annotation ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    AnnotationResourceType:
      name: resourceType
      in: query
      required: true
      description: Subject resource kind; path Collection remains the authority domain.
      schema:
        type: string
        enum:
          - collection
          - node
    AnnotationResourceId:
      name: resourceId
      in: query
      required: true
      description: Existing live Collection or Node subject ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    AnnotationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AnnotationCursor:
      name: cursor
      in: query
      required: false
      description: Signed Annotation-only continuation; omit limit when present.
      schema:
        $ref: '#/components/schemas/AnnotationCursorValue'
    RelationId:
      name: relationId
      in: path
      required: true
      description: Case-sensitive opaque Relation ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RelationNodeId:
      name: nodeId
      in: query
      required: true
      description: Live Node whose incident Relations are listed.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RelationDirection:
      name: direction
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/RelationDirection'
    RelationTypeFilter:
      name: type
      in: query
      required: false
      description: Comma-separated Relation types; duplicates are invalid.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    RelationVisibilityFilter:
      name: visibility
      in: query
      required: false
      description: Comma-separated visibility values; duplicates are invalid.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RelationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RelationCursor:
      name: cursor
      in: query
      required: false
      description: Relation-only continuation bound to node, direction, filters and principal.
      schema:
        $ref: '#/components/schemas/RelationCursorValue'
    SavedResourceTypePath:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SavedResourceType'
    SavedResourceIdPath:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SavedResourceTypeFilter:
      name: resourceType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SavedResourceType'
    SavedResourceCollectionFilter:
      name: collectionId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SavedResourceCreatedAfter:
      name: createdAfter
      in: query
      required: false
      schema:
        type: string
        format: date-time
    SavedResourceCreatedBefore:
      name: createdBefore
      in: query
      required: false
      schema:
        type: string
        format: date-time
    SavedResourceLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SavedResourceCursor:
      name: cursor
      in: query
      required: false
      description: Account-, filter-, page-size-, comparator-, key-version-, expiry-, and purpose-bound continuation.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ReadingProgressTypePath:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReadingProgressResourceType'
    ReadingProgressIdPath:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ReadingProgressStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ReadingProgressStatus'
    ReadingProgressLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ReadingProgressCursor:
      name: cursor
      in: query
      required: false
      description: Reading-Progress-only continuation bound to account, status filter, page size, comparator, key version and expiry.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ReadingProgressIfMatch:
      name: If-Match
      in: header
      required: false
      description: Required for an update. Omission requests create-only behavior. Weak tags, lists, and * are rejected.
      schema:
        $ref: '#/components/schemas/EntityTag'
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact allowed Product Web origin. Duplicate or null values fail.
      schema:
        type: string
        format: uri
        maxLength: 2048
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by getSession.
      schema:
        $ref: '#/components/schemas/CsrfToken'
    CommandId:
      name: Known-Command-Id
      in: header
      required: true
      description: Stable ID for one user intent. Reuse only for an exact retry of that intent. Full replay results are retained for at least 30 days.
      schema:
        $ref: '#/components/schemas/CommandId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One strong resource ETag. Weak tags, lists, and * are rejected.
      schema:
        $ref: '#/components/schemas/EntityTag'
    IfContentMatch:
      name: If-Content-Match
      in: header
      required: false
      description: Required exactly when recursive=true. Copy CollectionView.contentEtag without modification. Rejected for non-recursive requests.
      schema:
        $ref: '#/components/schemas/ContentEntityTag'
    EditorLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    EditorCursor:
      name: cursor
      in: query
      required: false
      description: Signed Product Editor cursor. Do not log or parse.
      schema:
        $ref: '#/components/schemas/Cursor'
    Recursive:
      name: recursive
      in: query
      required: false
      description: Explicitly delete a Folder subtree.
      schema:
        type: boolean
        default: false
    ReturnTo:
      name: returnTo
      in: query
      required: false
      description: Same-origin relative path, at most 2048 code points. It must start with one slash and cannot contain authority, backslash, control characters, scheme, or userinfo.
      schema:
        type: string
        maxLength: 2048
    OidcCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OidcState:
      name: state
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    OidcError:
      name: error
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    OidcIssuer:
      name: iss
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
    OidcSessionState:
      name: session_state
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorDescription:
      name: error_description
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorUri:
      name: error_uri
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
  headers:
    XRequestId:
      description: Per-attempt diagnostic request ID.
      schema:
        $ref: '#/components/schemas/RequestId'
    PrivateNoStore:
      description: Private Product response cache policy.
      schema:
        type: string
        const: private, no-store
    PublicOrPrivateCache:
      description: Public shared cache for anonymous reads; private no-store for Session reads.
      schema:
        type: string
    PublicProfileCache:
      description: Shared cache policy for the principal-invariant public Profile representation.
      schema:
        type: string
        const: public, max-age=60, stale-while-revalidate=300
    SearchVary:
      description: Search representation varies by media type and authenticated projection inputs. The value always includes Accept, Cookie, and Authorization and may also include Origin when CORS applies.
      schema:
        type: string
        minLength: 29
    ContentLength:
      description: Decimal byte length of the selected representation, including on HEAD.
      schema:
        type: string
        pattern: ^(?:0|[1-9][0-9]*)$
    VaryAccept:
      description: Representation negotiation cache key.
      schema:
        type: string
        const: Accept
    XContentTypeOptions:
      description: Prevent MIME sniffing of the JSON representation.
      schema:
        type: string
        const: nosniff
    NoStore:
      description: Browser navigation response cache policy.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag for the primary returned resource.
      schema:
        $ref: '#/components/schemas/EntityTag'
    Location:
      description: Stable Product resource or navigation URI. A created resource Location is not guaranteed to support GET in Phase 1.
      schema:
        type: string
        format: uri-reference
        maxLength: 4096
    RetryAfter:
      description: Retry delay in decimal seconds.
      schema:
        type: integer
        minimum: 0
    SetCookie:
      description: Session or one-time OIDC transaction cookie.
      schema:
        type: string
        minLength: 1
