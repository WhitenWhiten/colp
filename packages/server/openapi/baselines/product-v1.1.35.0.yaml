  /api/v1/search:
    get:
      tags:
        - Search
      operationId: searchResources
      summary: Search authorized Product resources
      description: Searches Collection, Node, public Profile, and Annotation branches. Anonymous requests receive only currently public opted-in resources and may use shared caching. Anonymous 200 responses carry a strong ETag for shared-cache validators. A valid Session broadens recall only after current authority is rechecked and always receives private, no-store caching; those private responses omit ETag and never return 304, including when If-None-Match is * or a prior anonymous validator. Search cursors are signed and bound to normalized query, selected types, page size, comparator, and principal projection. Conditional requests still execute the current authority projection before returning 304. A 304 omits the representation body after a fresh origin search; it does not omit candidate SQL, current-authority recheck, ancestor work, admission, or timeout. ETag applies to anonymous shared-cache validators only.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchType'
        - $ref: '#/components/parameters/SearchCursor'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchAccept'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current authorized Search page. Anonymous responses include ETag; private no-store Session responses omit ETag.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '304':
          description: Anonymous only. The freshly authorized selected representation matches If-None-Match after a fresh origin search; no body is sent. Candidate SQL, current-authority recheck, and timeout still run. Authenticated Session requests never receive 304.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags:
        - Search
      operationId: headSearchResources
      summary: Get authorized Search representation metadata without a body
      description: Performs the same raw-query admission, Session projection, candidate lookup, current-authority recheck, and timeout work as GET, but never sends representation bytes. Anonymous HEAD may return 304 after that fresh origin execution and includes ETag; authenticated HEAD omits ETag and never returns 304. Conditional requests still execute the current authority projection before returning 304. A 304 does not skip origin candidate SQL, authority recheck, or timeout.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchType'
        - $ref: '#/components/parameters/SearchCursor'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchAccept'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current authorized Search representation metadata. Anonymous responses include ETag; private no-store Session responses omit ETag.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '304':
          description: Anonymous only. The freshly authorized selected representation matches If-None-Match after a fresh origin search; no body is sent. Candidate SQL, current-authority recheck, and timeout still run. Authenticated Session requests never receive 304.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/SearchVary'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
