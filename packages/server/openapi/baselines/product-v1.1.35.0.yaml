      summary: Issue a durable single-PUT upload intent and one-time grant
      description: 'Authenticated Collection member declares size/digest/media for one create-only single PUT. The server commits the generation ledger BEFORE any grant is issued. The physical key and provider URL appear ONLY in the one-time opaque grant of this response; they are never persisted, logged, or returned by any other operation. Known-Command-Id is the idempotency binding: an exact retry returns the same intent/generation identity with a fresh grant, while reusing the key with different declared facts is attachment_idempotency_conflict.'
