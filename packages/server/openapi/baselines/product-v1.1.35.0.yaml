      additionalProperties: false
      required:
        - declaredSize
      properties:
        declaredSize:
          type: integer
          minimum: 0
          maximum: 67108864
          description: Declared single-PUT byte count for the NEW generation. Every replacement allocates a new physical key; same-key overwrite is never allowed.
        declaredSha256:
          type:
            - string
            - 'null'
          pattern: ^[a-f0-9]{64}$
        mediaHint:
          oneOf:
            - $ref: '#/components/schemas/AttachmentMediaType'
            - type: 'null'
        expectedPolicyRevision:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
    AttachmentRetireResult:
