      operationId: finalizeAttachment
      summary: Finalize one owner-private Attachment in a canonical mutation
      description: Consumes the current, owner-matched, unexpired stored_private generation and commits Attachment metadata, resource ID ledger, Operation/Audit/Outbox, and the blob handoff in one PostgreSQL transaction. Replays converge to already_finalized; a different binding or an inadmissible state is attachment_state_conflict.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AttachmentBlobIdPath'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          $ref: '#/components/responses/AttachmentFinalizeResponse'
        '400':
          $ref: '#/components/responses/AttachmentBadRequest'
        '401':
          $ref: '#/components/responses/AttachmentAuthenticationRequired'
        '403':
          $ref: '#/components/responses/AttachmentForbidden'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '409':
          $ref: '#/components/responses/AttachmentStateConflict'
        '413':
          $ref: '#/components/responses/AttachmentPayloadTooLarge'
        '415':
          $ref: '#/components/responses/AttachmentUnsupportedMediaType'
        '422':
          $ref: '#/components/responses/AttachmentInvalidDocument'
        '429':
          $ref: '#/components/responses/AttachmentRateLimited'
        '500':
          $ref: '#/components/responses/AttachmentInternalError'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
  /api/v1/attachments/{blobId}/replacement:
    post:
      tags:
        - Attachments
      operationId: issueAttachmentReplacement
      summary: Issue a new immutable generation replacement intent
      description: Replacement always allocates a NEW physical key and generation; the old key is never re-signed or overwritten. The new generation must be fully verified before the current pointer switches; the old generation only ever enters retired. The one-time grant in this response is the only place the replacement key/URL appears.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AttachmentBlobIdPath'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentReplacementRequest'
      responses:
        '201':
          $ref: '#/components/responses/AttachmentReplacementResponse'
        '400':
          $ref: '#/components/responses/AttachmentBadRequest'
        '401':
          $ref: '#/components/responses/AttachmentAuthenticationRequired'
        '403':
          $ref: '#/components/responses/AttachmentForbidden'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '409':
          $ref: '#/components/responses/AttachmentStateConflict'
        '413':
          $ref: '#/components/responses/AttachmentPayloadTooLarge'
        '415':
          $ref: '#/components/responses/AttachmentUnsupportedMediaType'
        '422':
          $ref: '#/components/responses/AttachmentInvalidDocument'
        '429':
          $ref: '#/components/responses/AttachmentRateLimited'
        '500':
          $ref: '#/components/responses/AttachmentInternalError'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
  /api/v1/attachments/{blobId}/retire:
    post:
      tags:
        - Attachments
      operationId: retireAttachment
      summary: Retire one owner-private Attachment into retention
      description: Logically retires the Attachment; the blob enters retired and external deletion converges asynchronously under retention and tombstone rules. Replays converge to already_retired; retirement of an inadmissible state is attachment_state_conflict.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AttachmentBlobIdPath'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          $ref: '#/components/responses/AttachmentRetireResponse'
        '400':
          $ref: '#/components/responses/AttachmentBadRequest'
        '401':
          $ref: '#/components/responses/AttachmentAuthenticationRequired'
        '403':
          $ref: '#/components/responses/AttachmentForbidden'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '409':
          $ref: '#/components/responses/AttachmentStateConflict'
        '413':
          $ref: '#/components/responses/AttachmentPayloadTooLarge'
        '415':
          $ref: '#/components/responses/AttachmentUnsupportedMediaType'
        '422':
          $ref: '#/components/responses/AttachmentInvalidDocument'
        '429':
          $ref: '#/components/responses/AttachmentRateLimited'
        '500':
          $ref: '#/components/responses/AttachmentInternalError'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
  /api/v1/attachments/{blobId}/download:
    post:
      tags:
        - Attachments
      operationId: admitAttachmentDownload
      summary: Admit an owner-private download and issue a short-lived capability
      description: Re-reads the current owner, logical state, generation state, and binding from PostgreSQL on every admission (no cached authorization) and issues a short-lived, audience-bound capability for the isolated delivery origin. The capability URL is a secret, non-loggable field of this one-time response; it is bound to the current generation and can never become a shared URL. Non-owner, anonymous, revoked, and foreign identities are concealed as resource_not_found.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AttachmentBlobIdPath'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/AttachmentDownloadResponse'
        '400':
          $ref: '#/components/responses/AttachmentBadRequest'
        '401':
          $ref: '#/components/responses/AttachmentAuthenticationRequired'
        '403':
          $ref: '#/components/responses/AttachmentForbidden'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '429':
          $ref: '#/components/responses/AttachmentRateLimited'
        '500':
          $ref: '#/components/responses/AttachmentInternalError'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-known_session
      description: HttpOnly, Secure, SameSite=Lax, Path=/, no Domain. Phase 1 supports HTTPS same-site Web/API deployments only.
  parameters:
    ProfileIdPath:
      name: profileId
      in: path
      required: true
      description: Stable identity-owned Profile ID, never a mutable handle.
      schema:
        $ref: '#/components/schemas/ProfileStableId'
    FollowCursor:
      name: cursor
      in: query
      required: false
      description: Opaque principal-, Profile-, direction-, limit-, purpose-, comparator-, key- and expiry-bound cursor. Omit limit when continuing.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    FollowLimit:
      name: limit
      in: query
      required: false
      description: First-page size. A continuation uses the limit sealed into its cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    FeedKind:
      name: kind
      in: query
      required: false
      description: Optional exact Feed item kind. Case and surrounding whitespace are normalized only after cardinality validation.
      schema:
        type: string
        enum:
          - collection_change
          - follow_activity
    FeedCursor:
      name: cursor
      in: query
      required: false
      description: Opaque principal-, filter-, limit-, purpose-, comparator-, key- and expiry-bound Feed cursor. Omit limit when continuing.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    FeedLimit:
      name: limit
      in: query
      required: false
      description: First-page Feed size. A continuation uses the limit sealed into its cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    NotificationState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - all
          - read
          - unread
        default: all
    NotificationCursor:
      name: cursor
      in: query
      required: false
      description: Principal-, state-, page-size-, purpose-, comparator-, key-, and expiry-bound continuation.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    NotificationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    NotificationRead:
      name: read
      in: query
      required: false
      description: Frozen Phase 5 compatibility filter. true reads the read inbox, false the unread inbox; absent reads the whole inbox. The successor path uses the state parameter instead.
      schema:
        type: boolean
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NotificationChannelPath:
      name: channel
      in: path
      required: true
      description: 'Preference channel to read/update. in_app is the Notification center channel; email is the optional P5-30 email delivery channel. PUT binds the If-Match validator to this channel: "notification-preference:<channel>:<revision>".'
      schema:
        type: string
        enum:
          - in_app
          - email
    PublicProfileHandlePath:
      name: handle
      in: path
      required: true
      description: Case-insensitive public handle locator, canonicalized to lowercase by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^(?!\.{1,2}$)[A-Za-z0-9._~-]{1,64}$
    PublicProfileLimit:
      name: limit
      in: query
      required: false
      description: Number of public Collection summaries in this keyset page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PublicProfileCursor:
      name: cursor
      in: query
      required: false
      description: Signed Profile-only Product cursor. Do not log, parse, or reuse for another purpose.
      schema:
        $ref: '#/components/schemas/PublicProfileCursorValue'
    PublicActivityLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 30. Values outside 1..100 are invalid_query.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    PublicActivityCursor:
      name: cursor
      in: query
      required: false
      description: Signed public Activity cursor (purpose social.public-activity.v1). Do not log, parse, or reuse a Feed or Profile cursor.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: One raw header field containing RFC entity-tag validators or *. Duplicate header fields are rejected before framework normalization.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    ExploreQuery:
      name: q
      in: query
      required: false
      description: Optional title/summary search text. Truncated to 256 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ExploreTag:
      name: tag
      in: query
      required: false
      description: Optional tag filter. Truncated to 64 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ExploreLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 24. Values outside 1..100 are invalid_query.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    ExploreCursor:
      name: cursor
      in: query
      required: false
      description: 'Opaque product Explore continuation (base64url JSON). The JSON shape must match the effective query sort: `{ sort: ''updated'', micros, id }` for updated (default); `{ sort: ''popular'', viewCount, micros, id }` for popular; `{ sort: ''links'', nodeCount, micros, id }` for links. Old cursors without `sort` are valid only with default `updated`. A query.sort vs cursor.sort mismatch, an old cursor used with popular/links, or missing sort keys for that order is invalid_cursor.'
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ExploreSort:
      name: sort
      in: query
      required: false
      description: Page order. Defaults to updated (updatedAt desc, then id). popular orders by the 30 UTC-day collection_view sum desc, then updatedAt desc, then id. links orders by live nodeCount desc, then updatedAt desc, then id. Unknown values are invalid_query.
      schema:
        type: string
        enum:
          - updated
          - popular
          - links
        default: updated
    SearchQuery:
      name: q
      in: query
      required: true
      description: Search text. The transport applies a 2048-byte encoded component limit before percent decoding, then bounded NFKC normalization, code-point, token, combining-mark, and operator complexity limits.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    SearchType:
      name: type
      in: query
      required: false
      description: Repeat once per selected result type; duplicate values and comma-joined values are invalid.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          $ref: '#/components/schemas/SearchResourceType'
    SearchCursor:
      name: cursor
      in: query
      required: false
      description: Signed Search-only continuation. Omit limit when continuing and never parse or log this value.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    SearchLimit:
      name: limit
      in: query
      required: false
      description: First-page result count. A continuation uses the page size signed into its cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchAccept:
      name: Accept
      in: header
      required: false
      description: RFC media range list. Search selects application/json; unsupported ranges return 406.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    AcceptJson:
      name: Accept
      in: header
      required: false
      description: RFC media range list. This operation selects application/json; unsupported ranges return 406.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    OwnedCollectionKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CollectionKind'
    OwnedCollectionVisibility:
      name: visibility
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CollectionVisibility'
    OwnedCollectionLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    OwnedCollectionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque Subject-, filter-, limit-, sort-, comparator-, key-version-, purpose-, and expiry-bound continuation. Must be the only query parameter.
      schema:
        $ref: '#/components/schemas/Cursor'
    CollaborationListCursor:
      name: cursor
      in: query
      required: false
      description: Opaque Subject-, Collection- (members list), purpose-, comparator-, key-version-, and expiry-bound continuation. Omit on the first page.
      schema:
        $ref: '#/components/schemas/Cursor'
    LinkHealthScopeFilter:
      name: scope
      in: query
      required: false
      description: First-page row-set filter. Omitted means owned. Must be omitted when cursor is present; continuation encodes scope in the cursor.
      schema:
        $ref: '#/components/schemas/LinkHealthScope'
    LinkHealthStatusFilter:
      name: status
      in: query
      required: false
      description: First-page status filter. Must be omitted when cursor is present.
      schema:
        $ref: '#/components/schemas/LinkHealthStatus'
    LinkHealthCollectionId:
      name: collectionId
      in: query
      required: false
      description: First-page Collection OpaqueId filter. Must be omitted when cursor is present.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    LinkHealthDuplicate:
      name: duplicate
      in: query
      required: false
      description: When true, only items whose duplicateOfNodeId is non-null. Must be omitted when cursor is present.
      schema:
        type: boolean
    LinkHealthLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    LinkHealthCursor:
      name: cursor
      in: query
      required: false
      description: Opaque Subject-, filter- (including scope), limit-, sort-, comparator-, key-version-, purpose-, and expiry-bound continuation that explicitly encodes a null checkedAt keyset bound. Must be the only query parameter. Continuation uses the encoded scope; omitted query scope is not defaulted to owned.
      schema:
        $ref: '#/components/schemas/Cursor'
    ClassifyInboxLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ClassifyInboxCursor:
      name: cursor
      in: query
      required: false
      description: Opaque Subject-, limit-, sort-, comparator-, key-version-, purpose-, and expiry-bound continuation for (createdAt DESC, nodeId DESC). Must be the only query parameter.
      schema:
        $ref: '#/components/schemas/Cursor'
    PublicCollectionSlugPath:
      name: collectionId
      in: path
      required: true
      description: Canonical publication slug for GET getPublicCollectionPage. This path segment is not the Collection OpaqueId used by PATCH updateCollection. GET looks up the Collection solely via findCollectionIdBySlug; it does not load by collection id. A UUID-shaped token is still treated as a slug, never as an OpaqueId fallback.
      schema:
        $ref: '#/components/schemas/PublicationLocatorSlug'
    PublicCollectionInsightSlugPath:
      name: slug
      in: path
      required: true
      description: Canonical lowercase publication slug for anonymous insight ingest.
      schema:
        $ref: '#/components/schemas/PublicationLocatorSlug'
    PublicCollectionLimit:
      name: limit
      in: query
      required: false
      description: Page node limit, including the Root on the first page.
      schema:
        type: integer
        minimum: 2
        maximum: 500
        default: 200
    PublicCollectionCursor:
      name: cursor
      in: query
      required: false
      description: Signed Product public-page cursor. It is not a COLP or Editor cursor.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Case-sensitive opaque Collection ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    InviteId:
      name: inviteId
      in: path
      required: true
      description: Case-sensitive opaque collection invite ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SubjectId:
      name: subjectId
      in: path
      required: true
      description: Case-sensitive opaque Subject ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Case-sensitive opaque Node ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ExportJobId:
      name: jobId
      in: path
      required: true
      description: Case-sensitive opaque export job ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    FaviconId:
      name: faviconId
      in: path
      required: true
      description: Opaque 36-character UUID leaf. Illegal values and missing objects share the same 404 resource_not_found shape (no existence oracle).
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: ^[a-fA-F0-9-]{36}$
    PlanId:
      name: planId
      in: path
      required: true
      description: Case-sensitive opaque MCP Write Plan ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ApprovalLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. The approval page is intentionally bounded.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    AnnotationId:
      name: annotationId
      in: path
      required: true
      description: Case-sensitive opaque Annotation ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    AnnotationResourceType:
      name: resourceType
      in: query
      required: true
      description: Subject resource kind; path Collection remains the authority domain.
      schema:
        type: string
        enum:
          - collection
          - node
    AnnotationResourceId:
      name: resourceId
      in: query
      required: true
      description: Existing live Collection or Node subject ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    AnnotationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AnnotationCursor:
      name: cursor
      in: query
      required: false
      description: Signed Annotation-only continuation; omit limit when present.
      schema:
        $ref: '#/components/schemas/AnnotationCursorValue'
    RelationId:
      name: relationId
      in: path
      required: true
      description: Case-sensitive opaque Relation ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RelationNodeId:
      name: nodeId
      in: query
      required: true
      description: Live Node whose incident Relations are listed.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RelationDirection:
      name: direction
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/RelationDirection'
    RelationTypeFilter:
      name: type
      in: query
      required: false
      description: Comma-separated Relation types; duplicates are invalid.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    RelationVisibilityFilter:
      name: visibility
      in: query
      required: false
      description: Comma-separated visibility values; duplicates are invalid.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RelationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RelationCursor:
      name: cursor
      in: query
      required: false
      description: Relation-only continuation bound to node, direction, filters and principal.
      schema:
        $ref: '#/components/schemas/RelationCursorValue'
    SavedResourceTypePath:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SavedResourceType'
    SavedResourceIdPath:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SavedResourceTypeFilter:
      name: resourceType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SavedResourceType'
    SavedResourceCollectionFilter:
      name: collectionId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SavedResourceCreatedAfter:
      name: createdAfter
      in: query
      required: false
      schema:
        type: string
        format: date-time
    SavedResourceCreatedBefore:
      name: createdBefore
      in: query
      required: false
      schema:
        type: string
        format: date-time
    SavedResourceLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SavedResourceCursor:
      name: cursor
      in: query
      required: false
      description: Account-, filter-, page-size-, comparator-, key-version-, expiry-, and purpose-bound continuation.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ReadingProgressTypePath:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReadingProgressResourceType'
    ReadingProgressIdPath:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ReadingProgressStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ReadingProgressStatus'
    ReadingProgressLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ReadingProgressCursor:
      name: cursor
      in: query
      required: false
      description: Reading-Progress-only continuation bound to account, status filter, page size, comparator, key version and expiry.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ReadingProgressIfMatch:
      name: If-Match
      in: header
      required: false
      description: Required for an update. Omission requests create-only behavior. Weak tags, lists, and * are rejected.
      schema:
        $ref: '#/components/schemas/EntityTag'
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact allowed Product Web origin. Duplicate or null values fail.
      schema:
        type: string
        format: uri
        maxLength: 2048
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by getSession.
      schema:
        $ref: '#/components/schemas/CsrfToken'
    InsightIngestCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when a Session cookie is present. Anonymous insight ingest must omit this header.
      schema:
        $ref: '#/components/schemas/CsrfToken'
    CommandId:
      name: Known-Command-Id
      in: header
      required: true
      description: Stable ID for one user intent. Reuse only for an exact retry of that intent. Full replay results are retained for at least 30 days.
      schema:
        $ref: '#/components/schemas/CommandId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One strong resource ETag. Weak tags, lists, and * are rejected.
      schema:
        $ref: '#/components/schemas/EntityTag'
    IfContentMatch:
      name: If-Content-Match
      in: header
      required: false
      description: Required exactly when recursive=true. Copy CollectionView.contentEtag without modification. Rejected for non-recursive requests.
      schema:
        $ref: '#/components/schemas/ContentEntityTag'
    EditorLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    EditorCursor:
      name: cursor
      in: query
      required: false
      description: Signed Product Editor cursor. Do not log or parse.
      schema:
        $ref: '#/components/schemas/Cursor'
    Recursive:
      name: recursive
      in: query
      required: false
      description: Explicitly delete a Folder subtree.
      schema:
        type: boolean
        default: false
    ReturnTo:
      name: returnTo
      in: query
      required: false
      description: Same-origin relative path, at most 2048 code points. It must start with one slash and cannot contain authority, backslash, control characters, scheme, or userinfo.
      schema:
        type: string
        maxLength: 2048
    OidcCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OidcState:
      name: state
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    OidcError:
      name: error
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    OidcIssuer:
      name: iss
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
    OidcSessionState:
      name: session_state
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorDescription:
      name: error_description
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorUri:
      name: error_uri
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
    AttachmentBlobIdPath:
      name: blobId
      in: path
      required: true
      description: Opaque logical Attachment/blob identity. Never a physical key, generation id, or provider URL.
      schema:
        $ref: '#/components/schemas/OpaqueId'
  headers:
    XRequestId:
      description: Per-attempt diagnostic request ID.
      schema:
        $ref: '#/components/schemas/RequestId'
    PrivateNoStore:
      description: Private Product response cache policy.
      schema:
        type: string
        const: private, no-store
    PublicOrPrivateCache:
      description: Public shared cache for anonymous reads; private no-store for Session reads.
      schema:
        type: string
    PublicProfileCache:
      description: Shared cache policy for the principal-invariant public Profile representation.
      schema:
        type: string
        const: public, max-age=60, stale-while-revalidate=300
    PublicImmutableImageCache:
      description: Immutable public cache for favicon object bytes.
      schema:
        type: string
        const: public, max-age=31536000, immutable
    PublicShortCache:
      description: Short public cache for favicon object misses.
      schema:
        type: string
        const: public, max-age=60
    SearchVary:
      description: Search representation varies by media type and authenticated projection inputs. The value always includes Accept, Cookie, and Authorization and may also include Origin when CORS applies.
      schema:
        type: string
        minLength: 29
    ContentLength:
      description: Decimal byte length of the selected representation, including on HEAD.
      schema:
        type: string
        pattern: ^(?:0|[1-9][0-9]*)$
    VaryAccept:
      description: Representation negotiation cache key.
      schema:
        type: string
        const: Accept
    XContentTypeOptions:
      description: Prevent MIME sniffing of the JSON representation.
      schema:
        type: string
        const: nosniff
    NoStore:
      description: Browser navigation response cache policy.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag for the primary returned resource.
      schema:
        $ref: '#/components/schemas/EntityTag'
    Location:
      description: Stable Product resource or navigation URI. A created resource Location is not guaranteed to support GET in Phase 1.
      schema:
        type: string
        format: uri-reference
        maxLength: 4096
    RetryAfter:
      description: Retry delay in decimal seconds.
      schema:
        type: integer
        minimum: 0
    RateLimitPolicy:
      description: Fixed route-class rate-limit policy of the Attachment admission limiter, formatted attachments-<route-class>:<max>:<window-ms>. Emitted only on Attachment 429 responses; never on the 503 rate_limit_unavailable closed state, which is not a quota fact.
      schema:
        type: string
        pattern: ^attachments-[a-z-]+:[0-9]+:[0-9]+$
    SetCookie:
      description: Session or one-time OIDC transaction cookie.
      schema:
        type: string
        minLength: 1
