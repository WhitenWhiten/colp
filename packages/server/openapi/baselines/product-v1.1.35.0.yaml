      description: Binds the original {intentId, generationId, blobId}; the client never submits a physical key and cannot change key, owner, Collection, declared digest, or generation. The server re-reads the committed ledger, attests the exact object, and converges idempotently (completed / idempotent / already_verified). Missing, foreign, or wrong-principal bindings are concealed as resource_not_found; observed facts that contradict the declaration are attachment_state_conflict.
