          type: integer
          minimum: 0
          maximum: 100
          description: 'Jaccard overlap of bookmark title plus URL hostname tokens versus folder title tokens: NFKC, lowercase, split on non-alphanumeric, drop tokens shorter than 2. score = round(100 * |A∩B| / |A∪B|); empty union is 0. Sorted descending by score, then folderTitle ascending, then folderId ascending. Keep score > 0, at most 3. Not a semantic or AI model.'
