        - image/png
        - image/webp
        - image/gif
        - application/pdf
        - text/plain
    AttachmentReceipt:
      type: object
      additionalProperties: false
      description: Opaque logical identity of one issued upload. Never contains a physical key, provider URL, credential, or digest.
      required:
        - blobId
        - intentId
        - generationId
      properties:
        blobId:
          $ref: '#/components/schemas/OpaqueId'
        intentId:
          $ref: '#/components/schemas/OpaqueId'
        generationId:
          $ref: '#/components/schemas/OpaqueId'
    UploadGrantDto:
      type: object
      additionalProperties: false
      description: One-time opaque upload grant. The url embeds the physical key binding and MUST NOT be persisted, logged, or included in receipts, operations, or error bodies; it appears only in this response.
      required:
        - url
        - method
        - contentType
        - contentLength
        - expiresAt
        - ttlSeconds
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          x-known-secret: true
          description: SECRET, non-loggable provider URL (presigned create-only PUT). One-time only; never persisted, logged, or replayed.
        method:
          type: string
          const: PUT
        contentType:
          type: string
          minLength: 1
          maxLength: 256
        contentLength:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 300
    AttachmentIssueResult:
      type: object
      additionalProperties: false
      required:
        - kind
        - receipt
        - grant
      properties:
        kind:
          type: string
          enum:
            - issued
            - recovered
        receipt:
          $ref: '#/components/schemas/AttachmentReceipt'
        grant:
          $ref: '#/components/schemas/UploadGrantDto'
    AttachmentIssueRequest:
      type: object
      additionalProperties: false
      required:
        - collectionId
        - declaredSize
      properties:
        collectionId:
          $ref: '#/components/schemas/OpaqueId'
        declaredSize:
          type: integer
          minimum: 0
          maximum: 67108864
          description: Declared single-PUT byte count. 67108864 (64 MiB) is the absolute compile-time hard ceiling; deployments may enforce a lower ceiling and reject oversized declarations with payload_too_large (413).
        declaredSha256:
          type:
            - string
            - 'null'
          pattern: ^[a-f0-9]{64}$
        mediaHint:
          oneOf:
            - $ref: '#/components/schemas/AttachmentMediaType'
            - type: 'null'
        expectedPolicyRevision:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
    AttachmentCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - binding
        - declared
      properties:
        binding:
          type: object
          additionalProperties: false
          required:
            - intentId
            - generationId
            - blobId
          properties:
            intentId:
              $ref: '#/components/schemas/OpaqueId'
            generationId:
              $ref: '#/components/schemas/OpaqueId'
            blobId:
              $ref: '#/components/schemas/OpaqueId'
        declared:
          type: object
          additionalProperties: false
          required:
            - size
            - sha256
            - mediaType
            - etag
          properties:
            size:
              type: integer
              minimum: 0
              maximum: 67108864
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            mediaType:
              $ref: '#/components/schemas/AttachmentMediaType'
            etag:
              type: string
              minLength: 1
              maxLength: 512
    AttachmentCompleteResult:
      type: object
      additionalProperties: false
      description: Success variants only. Missing, foreign, or wrong-principal bindings are concealed as 404 resource_not_found; contradicting observed facts are 409 attachment_state_conflict. No partial success is ever emitted.
      required:
        - kind
        - receipt
      properties:
        kind:
          type: string
          enum:
            - completed
            - idempotent
            - already_verified
        receipt:
          $ref: '#/components/schemas/AttachmentReceipt'
    AttachmentStatusDto:
      type: object
      additionalProperties: false
      description: Owner-private status and metadata view. Contains no digest value, no physical key, no URL, no credential, and no filename. verificationStatus NEVER implies malware-safety.
      required:
        - blobId
        - logicalState
        - verificationStatus
        - availability
        - size
        - mediaType
        - createdAt
        - updatedAt
        - allowedActions
      properties:
        blobId:
          $ref: '#/components/schemas/OpaqueId'
        logicalState:
          $ref: '#/components/schemas/AttachmentLogicalState'
        verificationStatus:
          $ref: '#/components/schemas/AttachmentVerificationStatus'
        availability:
          $ref: '#/components/schemas/AttachmentAvailability'
        size:
          type: integer
          minimum: 0
          maximum: 67108864
        mediaType:
          oneOf:
            - $ref: '#/components/schemas/AttachmentMediaType'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        allowedActions:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              - complete
              - finalize
              - download
              - replace
              - retire
    AttachmentFinalizeResult:
      type: object
      additionalProperties: false
      required:
        - kind
        - blobId
        - logicalState
      properties:
        kind:
          type: string
          enum:
            - finalized
            - already_finalized
        blobId:
          $ref: '#/components/schemas/OpaqueId'
        logicalState:
          type: string
          const: attached_private
    AttachmentReplacementRequest:
