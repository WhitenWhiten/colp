openapi: 3.1.0
info:
  title: Known Product API
  version: 1.35.0
  description: 'Phase 1 Web Product API. This contract is separate from COLP Publication, Publisher, Sync, MCP, and Admin surfaces. Application commands and COLP wire types are mapped explicitly and are not generated from this document. info.version 1.12.0 adds the private current-authorized Feed Product API after the 1.11.0 authenticated Follow API while retaining the additive Phase 2B Annotation, Relation, Saved Resource, Reading Progress, and bounded PostgreSQL Search surfaces while preserving the accepted Product 1.6 client contract under ADR-0015, plus the authenticated owned Collection list and Profile mutation. Generated-client drift, command replay versioning, and breaking-change policy are governed by that ADR. info.version 1.14.0 additively exposes the private current-account MCP Write approval list, item, and exact-once decision surface while preserving every accepted 1.13.0 Product client contract. info.version 1.15.0 additively freezes the owner-private Attachment product surface (P4A-P01): issue, complete, status/private metadata, finalize, replacement, retire, and download admission under /api/v1/attachments while preserving every accepted 1.14.0 Product client contract. Attachment behaviors are NOT implemented by this contract version; every attachment operation returns the documented closed state until the owning task lands. info.version 1.16.0 additively exposes anonymous public-collection insight ingest (collection_view, preview_open, resource_open) at POST /api/v1/public-collections/{slug}/insight-events while preserving every accepted 1.15.0 Product client contract. info.version 1.17.0 additively exposes the authenticated owner publishing insights dashboard at GET /api/v1/me/publishing-insights while preserving every accepted 1.16.0 Product client contract. info.version 1.18.0 additively exposes authenticated collection member and invite operations (list, invite, revoke, role, remove, and the current subject''s pending invites with accept/decline) while preserving every accepted 1.17.0 Product client contract. info.version 1.19.0 additively exposes the authenticated shared Collection list at GET /api/v1/me/shared-collections while preserving every accepted 1.18.0 Product client contract. info.version 1.20.0 additively adds optional bookmarkCount on OwnedCollectionListItem while preserving every accepted 1.19.0 Product client contract. info.version 1.21.0 additively exposes UnauthenticatedSessionView.verificationRequired (true when a Better Auth occupancy cookie exists but email is not verified) and documents GET /api/v1/me 403 verification_required for that occupancy, while preserving every accepted 1.20.0 Product client contract. info.version 1.22.0 additively exposes anonymous GET /api/v1/favicon/{faviconId} and authenticated Session POST/DELETE bookmark favicon bytes at /api/v1/collections/{collectionId}/nodes/{nodeId}/favicon, plus optional iconUrl on BookmarkNodeView and PublicCollectionNode and optional faviconCdnAllowed on PublicCollectionSummary, while preserving every accepted 1.21.0 Product client contract. The Known extension helper is not part of this Product document. info.version 1.23.0 additively exposes anonymous GET/HEAD /api/v1/explore/collections (the public Explore directory page with curator DTO completion) while preserving every accepted 1.22.0 Product client contract. info.version 1.24.0 additively joins public collection title, publication slug, and summary onto FeedItemDto while preserving every accepted 1.23.0 Product client contract. info.version 1.25.0 additively exposes optional actorHandle, actorDisplayName, collectionTitle, publicationSlug, and summary on successor NotificationItem while preserving every accepted 1.24.0 Product client contract. info.version 1.26.0 additively exposes anonymous GET/HEAD /api/v1/profiles/{handle}/activity (public Profile collection-change activity) while preserving every accepted 1.25.0 Product client contract. info.version 1.27.0 additively adds optional ExploreCollectionItem.viewCount and an optional Explore sort query (updated | popular | links) with sort-keyed continuation cursors while preserving every accepted 1.26.0 Product client contract. info.version 1.28.0 additively exposes the authenticated owned bookmark link-health list at GET /api/v1/me/link-health while preserving every accepted 1.27.0 Product client contract. info.version 1.29.0 additively exposes POST /api/v1/me/link-health/checks (enqueue owned bookmark probes) while preserving every accepted 1.28.0 Product client contract. info.version 1.30.0 documents closed summary tokens on FeedItemDto, successor NotificationItem, and PublicProfileActivityItem (public_collection_updated for still-public collection_change, new_follower for follow_activity, and null on inbox when the Collection is no longer public with a slug) while preserving every accepted 1.29.0 Product client contract. info.version 1.31.0 additively adds optional PublicCollectionSummary.viewCount (30 UTC-day collection_view sum, same as Explore) while preserving every accepted 1.30.0 Product client contract. info.version 1.32.0 additively adds optional GET /api/v1/me/link-health scope (owned|shared|all; omitted first page is owned) and optional LinkHealthItem membership (owner|editor|viewer), and documents shared-editor POST checks, while preserving every accepted 1.31.0 Product client contract. info.version 1.33.0 additively exposes owner library export jobs at POST/GET /api/v1/me/export-jobs, GET /api/v1/me/export-jobs/{jobId}, and GET /api/v1/me/export-jobs/{jobId}/download while preserving every accepted 1.32.0 Product client contract. info.version 1.34.0 additively adds optional cursor pagination on GET /api/v1/collections/{collectionId}/members and GET /api/v1/me/collaboration-invites while preserving every accepted 1.33.0 Product client contract. info.version 1.35.0 additively exposes the authenticated owned classify inbox list at GET /api/v1/me/classify-inbox while preserving every accepted 1.34.0 Product client contract.'
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
tags:
  - name: BrowserAuth
    description: 'Browser navigation endpoints for the legacy OIDC authorization flow (deprecated: the Better Auth migration removes the flow from the runtime composition when BETTER_AUTH_ENABLED=true; retained here as the deprecated legacy contract for the rollback window).'
  - name: Session
    description: Browser Session bootstrap and revocation.
  - name: Account
    description: Current authenticated Account and Profile views.
  - name: Profiles
    description: Public Profile projections and their published Collections.
  - name: Collections
    description: Phase 1 Collection creation, metadata, and Editor queries.
  - name: Nodes
    description: Phase 1 Folder and Bookmark commands.
  - name: Annotations
    description: Authenticated Product Annotation reads and canonical commands.
  - name: Relations
    description: Authenticated Product Relation reads and canonical commands.
  - name: SavedResources
    description: Private account-owned saved Collection and Node state.
  - name: ReadingProgress
    description: Private account-owned reading state for Collections and Nodes.
  - name: Search
    description: Bounded PostgreSQL Search with fresh authority projection.
  - name: Explore
    description: Anonymous public Collection directory at GET /api/v1/explore/collections. Curators are completed from identity facts (accounts/profiles/handles); missing profiles serialize as Unknown. Cursors are product-opaque base64url and independent of COLP directory cursors.
  - name: SyncCenter
    description: Private server-authoritative Replica and Conflict management.
  - name: WriteApproval
    description: Private current-account MCP Write Plan and Approval decisions.
  - name: Attachments
    description: Owner-private Attachment product surface (Phase 4A). Physical keys and provider URLs appear only inside the one-time opaque grant of the issue response; no Attachment DTO, receipt, operation, or error body ever carries a key, credential, digest, or download capability. The surface declares no public, shared, or inline Attachment capability.
  - name: PublishingInsights
    description: Anonymous same-origin ingest of public-collection engagement events. Owner self-view is accepted as 204 without writing a row. Visitor identity is HMAC-only; the ingest response body is empty. Authenticated owners read a 30-day dashboard at GET /api/v1/me/publishing-insights.
  - name: Collaboration
    description: Authenticated collection membership and email invites. Collection IDs are stable opaque Collection IDs, not publication slugs. Member management is owner-only; invitees list, accept, and decline their own pending invites. Members page Collections shared with them at GET /api/v1/me/shared-collections.
  - name: LinkHealth
    description: Authenticated bookmark link-health list at GET /api/v1/me/link-health (owned, shared editor/viewer membership, or all) and enqueue at POST /api/v1/me/link-health/checks. Covers live, kind=bookmark nodes with a non-empty URL. Status is pending, healthy, redirect, or broken. Duplicate is a computed field, not a CHECK value. Shared-editor POST may enqueue by collectionId; viewers cannot.
  - name: ClassifyInbox
    description: Authenticated owner-private classify inbox at GET /api/v1/me/classify-inbox. Inbox items are owned live bookmarks whose parent is the collection root, with a non-empty URL and no skip/accept sidecar row. Suggestions are deterministic title/host token overlap against live folders in the same collection (Jaccard), not a semantic or AI model. First period is GET only.
  - name: Export
    description: Authenticated owner-library export jobs at /api/v1/me/export-jobs. First-period format is JSON of owned live collections and their live root/folder/bookmark nodes. Download is a Session GET 200 JSON body with no downloadUrl, no 302, and no object keys in Product JSON.
paths:
  /api/v1/auth/oidc/start:
    get:
      tags:
        - BrowserAuth
      operationId: startOidcAuthorization
      summary: 'Start the browser OIDC authorization flow (deprecated: legacy OIDC)'
      description: 'DEPRECATED (legacy OIDC/Logto flow, Task F2): the Better Auth migration removes this flow from the runtime composition when BETTER_AUTH_ENABLED=true — the endpoint answers 404 in Better Auth mode and is retained here only as the deprecated legacy contract for the rollback window (F3 removes the OpenAPI/manifest entries). Starts Authorization Code with PKCE. Invalid returnTo values fall back to the fixed dashboard. This navigation operation is excluded from the generated business API client.'
      security: []
      parameters:
        - $ref: '#/components/parameters/ReturnTo'
      responses:
        '302':
          description: Redirect to the configured OIDC issuer.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/oidc/callback:
    get:
      tags:
        - BrowserAuth
      operationId: completeOidcAuthorization
      summary: 'Complete the browser OIDC authorization flow (deprecated: legacy OIDC)'
      description: 'DEPRECATED (legacy OIDC/Logto flow, Task F2): the Better Auth migration removes this flow from the runtime composition when BETTER_AUTH_ENABLED=true — the endpoint answers 404 in Better Auth mode and is retained here only as the deprecated legacy contract for the rollback window (F3 removes the OpenAPI/manifest entries). Accepts exactly one success branch (code plus state) or one failure branch (error plus state). Optional standard iss, session_state, error_description, and error_uri parameters are accepted; only iss is used and must match the configured issuer. Every failure clears the one-time transaction when safe to do so. Terminal denials redirect to the fixed /login?auth=failed path. Non-replayable failures after the authorization code or login transaction is consumed redirect to /login?auth=restart so the browser starts a brand-new login (the same code/state must never be retried).'
      security: []
      parameters:
        - $ref: '#/components/parameters/OidcCode'
        - $ref: '#/components/parameters/OidcState'
        - $ref: '#/components/parameters/OidcError'
        - $ref: '#/components/parameters/OidcIssuer'
        - $ref: '#/components/parameters/OidcSessionState'
        - $ref: '#/components/parameters/OidcErrorDescription'
        - $ref: '#/components/parameters/OidcErrorUri'
      responses:
        '303':
          description: Redirect to the validated same-origin returnTo on success; to the fixed /login?auth=failed location on terminal denial; or to /login?auth=restart when the flow is non-replayable and the user must begin a new login.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
  /api/v1/session:
    get:
      tags:
        - Session
      operationId: getSession
      summary: Get the current browser session state
      security:
        - cookieAuth: []
        - {}
      responses:
        '200':
          description: Current authenticated or unauthenticated session state. Unverified Better Auth occupancy returns authenticated false with verificationRequired true; a missing cookie omits that field.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Session
      operationId: deleteSession
      summary: Revoke the current browser session
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me:
    get:
      tags:
        - Account
      operationId: getMe
      summary: Get the current account and profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current account and minimal profile view.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
        - Account
      operationId: updateMe
      summary: Update the current profile handle and display name
      description: Exact retries reuse Known-Command-Id and return the stored MeView receipt. A different body with the same Command-Id is rejected.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Persisted current account and profile view, including an exact receipt replay.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: handle_taken, or command_id_reused / command_in_progress when the Known-Command-Id conflicts with a prior profile-settings command.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSettingsErrorEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: invalid_handle, invalid_display_name, or invalid_about with fieldErrors.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSettingsErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/avatar:
    post:
      tags:
        - Account
      operationId: uploadMyAvatar
      summary: Upload a new profile avatar image
      description: Accepts a raw PNG, JPEG, or WebP image body. The image is stored in the public avatar object store and the current profile avatarUrl is replaced with the resulting public avatar URL.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Persisted current account and profile view with the new avatar URL.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/avatar/{avatarId}:
    get:
      tags:
        - Profiles
      operationId: getAvatar
      summary: Get a public avatar image by id
      security: []
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Avatar image bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicOrPrivateCache'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/favicon/{faviconId}:
    get:
      tags:
        - Collections
      operationId: getBookmarkFavicon
      summary: Get a public bookmark favicon image by id
      description: Anonymous public favicon object bytes. No Product Session and no cookieAuth. faviconId is a 36-character UUID leaf matching /^[a-f0-9-]{36}$/i. Illegal ids and missing objects share the same 404 resource_not_found shape (no existence oracle). Transport may use public-revalidate so admission does not fill no-store; 200 and 404 pin Cache-Control themselves. 200 is public, max-age=31536000, immutable. 404 is public, max-age=60. GET does not look up bookmark_icons; an object may remain 200 until R2 DELETE. No Set-Cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/FaviconId'
      responses:
        '200':
          description: Favicon image bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicImmutableImageCache'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/x-icon:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/FaviconNotFound'
  /api/v1/explore/collections:
    get:
      tags:
        - Explore
      operationId: listExploreCollections
      summary: List public Explore Collection directory items
      description: Anonymous public Collection directory. No Product Session and no cookieAuth. First page accepts optional q, tag, sort (default updated), and limit (default 24, maximum 100). Continuation accepts an opaque Explore cursor whose JSON shape matches the effective sort. Unknown, non-integer, or out-of-range limit is invalid_query. Unknown sort is invalid_query. Malformed cursors, sort/cursor mismatch, and missing sort keys are invalid_cursor. Each item includes one creator DTO completed from identity facts, or Unknown when the owner has no profile.
      security: []
      parameters:
        - $ref: '#/components/parameters/ExploreQuery'
        - $ref: '#/components/parameters/ExploreTag'
        - $ref: '#/components/parameters/ExploreLimit'
        - $ref: '#/components/parameters/ExploreCursor'
        - $ref: '#/components/parameters/ExploreSort'
      responses:
        '200':
          description: One public Explore directory page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicShortCache'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreCollectionsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags:
        - Explore
      operationId: headExploreCollections
      summary: Get Explore directory representation metadata without a body
      description: Performs the same query admission, directory read, and creator completion as GET, but never sends representation bytes.
      security: []
      parameters:
        - $ref: '#/components/parameters/ExploreQuery'
        - $ref: '#/components/parameters/ExploreTag'
        - $ref: '#/components/parameters/ExploreLimit'
        - $ref: '#/components/parameters/ExploreCursor'
        - $ref: '#/components/parameters/ExploreSort'
      responses:
        '200':
          description: Current Explore directory representation metadata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicShortCache'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/profiles/{handle}:
    get:
      tags:
        - Profiles
      operationId: getPublicProfile
      summary: Get a public Profile and one page of public Collections
      description: Returns the same public representation for anonymous and Session principals. The representation validator covers the final JSON bytes, page identity, negotiated media type, and Product contract version.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicProfileHandlePath'
        - $ref: '#/components/parameters/PublicProfileLimit'
        - $ref: '#/components/parameters/PublicProfileCursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Public Profile and one stable keyset page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicProfileCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/VaryAccept'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfilePage'
        '304':
          description: The recomputed current public representation matches If-None-Match.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicProfileCache'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/VaryAccept'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags:
        - Profiles
      operationId: headPublicProfile
      summary: Get public Profile representation metadata without a body
      description: Performs the same path, query, projection, current-representation, and conditional request work as GET, but never sends representation bytes.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicProfileHandlePath'
        - $ref: '#/components/parameters/PublicProfileLimit'
        - $ref: '#/components/parameters/PublicProfileCursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current public Profile representation metadata.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicProfileCache'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              $ref: '#/components/headers/VaryAccept'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
