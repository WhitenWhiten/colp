            code: precondition_failed
            message: This item changed before your edit was saved.
            requestId: req_01j00000000000000000000000
            recovery: refresh_and_retry
            sameRequestRetrySafe: false
            precondition: resource
            currentEtag: '"resource:7"'
            retryAfterSeconds: null
            fieldErrors: []
  responses:
    BadRequest:
      description: invalid_request, invalid_json, invalid_query, or invalid_cursor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    AuthenticationRequired:
      description: authentication_required.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    Forbidden:
      description: csrf_failed or insufficient_permission.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    NotFound:
      description: resource_not_found, including concealed resources.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    MutationConflict:
      description: command_id_reused, command_in_progress, position_context_stale, folder_not_empty, root_immutable, or revision_conflict. Retry-After is emitted only for command_in_progress and omitted for all other codes.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    EditorSnapshotConflict:
      description: snapshot_expired; discard the partial tree and restart paging.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    Gone:
      description: command_result_expired. The historical command is never rerun.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    PreconditionFailed:
      description: precondition_failed for resource or Collection content.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    PayloadTooLarge:
      description: payload_too_large.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    UnsupportedMediaType:
      description: unsupported_media_type.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    InvalidDocument:
      description: invalid_document with optional fieldErrors.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductErrorEnvelope'
    PreconditionRequired:
      description: precondition_required for resource or Collection content.
      headers:
