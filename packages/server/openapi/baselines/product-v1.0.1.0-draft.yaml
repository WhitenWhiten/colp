openapi: 3.1.0
info:
  title: Known Product API
  version: 0.1.0-draft
  description: Phase 1 Web Product API. This contract is separate from COLP Publication, Publisher, Sync, MCP, and Admin surfaces. Application commands and COLP wire types are mapped explicitly and are not generated from this document. This document is the 0.1.x implementation draft; the /api/v1 stable freeze, generated-client drift, command replay versioning, and breaking-change policy are governed by ADR-0015 before info.version can become 1.0.0.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
tags:
  - name: BrowserAuth
    description: Browser navigation endpoints for the OIDC authorization flow.
  - name: Session
    description: Browser Session bootstrap and revocation.
  - name: Account
    description: Current authenticated Account and Profile views.
  - name: Collections
    description: Phase 1 Collection creation, metadata, and Editor queries.
  - name: Nodes
    description: Phase 1 Folder and Bookmark commands.
paths:
  /api/v1/auth/oidc/start:
    get:
      tags:
        - BrowserAuth
      operationId: startOidcAuthorization
      summary: Start the browser OIDC authorization flow
      description: Starts Authorization Code with PKCE. Invalid returnTo values fall back to the fixed dashboard. This navigation operation is excluded from the generated business API client.
      security: []
      parameters:
        - $ref: '#/components/parameters/ReturnTo'
      responses:
        '302':
          description: Redirect to the configured OIDC issuer.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/oidc/callback:
    get:
      tags:
        - BrowserAuth
      operationId: completeOidcAuthorization
      summary: Complete the browser OIDC authorization flow
      description: Accepts exactly one success branch (code plus state) or one failure branch (error plus state). Optional standard iss, session_state, error_description, and error_uri parameters are accepted; only iss is used and must match the configured issuer. Every failure clears the one-time transaction and redirects to the fixed login failure path.
      security: []
      parameters:
        - $ref: '#/components/parameters/OidcCode'
        - $ref: '#/components/parameters/OidcState'
        - $ref: '#/components/parameters/OidcError'
        - $ref: '#/components/parameters/OidcIssuer'
        - $ref: '#/components/parameters/OidcSessionState'
        - $ref: '#/components/parameters/OidcErrorDescription'
        - $ref: '#/components/parameters/OidcErrorUri'
      responses:
        '303':
          description: Redirect to the validated same-origin returnTo on success, or to the fixed /login?auth=failed location on failure.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
  /api/v1/session:
    get:
      tags:
        - Session
      operationId: getSession
      summary: Get the current browser session state
      security:
        - cookieAuth: []
        - {}
      responses:
        '200':
          description: Current authenticated or unauthenticated session state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Session
      operationId: deleteSession
      summary: Revoke the current browser session
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me:
    get:
      tags:
        - Account
      operationId: getMe
      summary: Get the current account and profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current account and minimal profile view.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/collections:
    post:
      tags:
        - Collections
      operationId: createCollection
      summary: Create an owned Collection and Root atomically
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection and Root created in one committed transaction.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}/editor:
    get:
      tags:
        - Collections
      operationId: getCollectionEditorPage
      summary: Get one revision-fenced Editor page
      description: The first page accepts limit. A continuation request accepts cursor and must omit limit. The cursor is scoped to the principal, Collection, content revision, policy revision, comparator, and page size. The client publishes the assembled tree only after hasMore is false.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/EditorLimit'
        - $ref: '#/components/parameters/EditorCursor'
      responses:
        '200':
          description: One consistent Editor page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditorSnapshotConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}:
    patch:
      tags:
        - Collections
      operationId: updateCollection
      summary: Update Phase 1 Collection metadata
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CollectionMergePatch'
      responses:
        '200':
          description: Updated Collection with current concurrency fences.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}/nodes:
    post:
      tags:
        - Nodes
      operationId: createCollectionNode
      summary: Create a Folder or Bookmark
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: Node created with updated Parent and Collection fences.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNodeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}/nodes/{nodeId}:
    patch:
      tags:
        - Nodes
      operationId: updateCollectionNode
      summary: Update Folder or Bookmark content
      description: Root is immutable through Product Node operations.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/NodeMergePatch'
      responses:
        '200':
          description: Updated Node and current Collection fence.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNodeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Nodes
      operationId: deleteCollectionNode
      summary: Delete a Node or explicitly confirmed subtree
      description: recursive=true is valid only for Folder targets and requires If-Content-Match in addition to If-Match. If-Content-Match is rejected on non-recursive requests. Root cannot be deleted by this operation.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Recursive'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfContentMatch'
      responses:
        '200':
          description: Node or subtree logically deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteNodeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionId}/nodes/{nodeId}/move:
    post:
      tags:
        - Nodes
      operationId: moveCollectionNode
      summary: Move or reorder a Node
      description: Root is immutable through Product Node operations.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveNodeRequest'
      responses:
        '200':
          description: Node moved with current Parent and Collection fences.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveNodeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-known_session
      description: HttpOnly, Secure, SameSite=Lax, Path=/, no Domain. Phase 1 supports HTTPS same-site Web/API deployments only.
  parameters:
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Case-sensitive opaque Collection ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Case-sensitive opaque Node ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact allowed Product Web origin. Duplicate or null values fail.
      schema:
        type: string
        format: uri
        maxLength: 2048
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by getSession.
      schema:
        $ref: '#/components/schemas/CsrfToken'
    CommandId:
      name: Known-Command-Id
      in: header
      required: true
      description: Stable ID for one user intent. Reuse only for an exact retry of that intent. Full replay results are retained for at least 30 days.
      schema:
        $ref: '#/components/schemas/CommandId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One strong resource ETag. Weak tags, lists, and * are rejected.
      schema:
        $ref: '#/components/schemas/EntityTag'
    IfContentMatch:
      name: If-Content-Match
      in: header
      required: false
      description: Required exactly when recursive=true. Copy CollectionView.contentEtag without modification. Rejected for non-recursive requests.
      schema:
        $ref: '#/components/schemas/ContentEntityTag'
    EditorLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    EditorCursor:
      name: cursor
      in: query
      required: false
      description: Signed Product Editor cursor. Do not log or parse.
      schema:
        $ref: '#/components/schemas/Cursor'
    Recursive:
      name: recursive
      in: query
      required: false
      description: Explicitly delete a Folder subtree.
      schema:
        type: boolean
        default: false
    ReturnTo:
      name: returnTo
      in: query
      required: false
      description: Same-origin relative path, at most 2048 code points. It must start with one slash and cannot contain authority, backslash, control characters, scheme, or userinfo.
      schema:
        type: string
        maxLength: 2048
    OidcCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OidcState:
      name: state
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    OidcError:
      name: error
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    OidcIssuer:
      name: iss
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
    OidcSessionState:
      name: session_state
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorDescription:
      name: error_description
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorUri:
      name: error_uri
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
  headers:
    XRequestId:
      description: Per-attempt diagnostic request ID.
      schema:
        $ref: '#/components/schemas/RequestId'
    PrivateNoStore:
      description: Private Product response cache policy.
      schema:
        type: string
        const: private, no-store
    NoStore:
      description: Browser navigation response cache policy.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag for the primary returned resource.
      schema:
        $ref: '#/components/schemas/EntityTag'
    Location:
      description: Stable Product resource or navigation URI. A created resource Location is not guaranteed to support GET in Phase 1.
      schema:
        type: string
        format: uri-reference
        maxLength: 4096
    RetryAfter:
      description: Retry delay in decimal seconds.
      schema:
        type: integer
        minimum: 0
    SetCookie:
      description: Session or one-time OIDC transaction cookie.
      schema:
        type: string
        minLength: 1
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._~-]+$
    Revision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._~-]+$
    CommandId:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    CsrfToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._~-]+$
    EntityTag:
      type: string
      minLength: 3
      maxLength: 260
      pattern: ^"[^"\r\n]+"$
    ChildrenEntityTag:
      $ref: '#/components/schemas/EntityTag'
    ContentEntityTag:
      $ref: '#/components/schemas/EntityTag'
    PolicyEntityTag:
      $ref: '#/components/schemas/EntityTag'
    UtcDateTime:
      type: string
      format: date-time
      pattern: Z$
    Position:
      type: string
      minLength: 1
      maxLength: 512
      pattern: ^[\x21-\x7E]+$
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[A-Za-z0-9_-]+$
    HttpUrlNoUserInfo:
      type: string
      format: uri
      minLength: 8
      maxLength: 4096
      pattern: ^[Hh][Tt][Tt][Pp][Ss]?://[^/?#@\s]+(?:[/?#]|$)
    HttpsUrl:
      type: string
      format: uri
      minLength: 9
