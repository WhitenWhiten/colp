  /api/v1/me/favicon-policy:
    get:
      tags: [Favicon]
      operationId: getMyFaviconPolicy
      summary: Read the account favicon icon-source policy
      description: >-
        FO-01. Session-required private read of the account singleton favicon
        policy (newDefault, provider template, fill/force defaults). A missing
        row exposes virtual defaults with revision 1; the response ETag is the
        If-Match validator for PATCH. Does not accept a request body. Feature
        flag KNOWN_FEATURE_FAVICON_POLICY=false returns 404.
      security:
        - cookieAuth: []
        - productBearer: []
      responses:
        '200':
          description: The current favicon policy and its strong ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaviconOrderingIconPolicy' }
        '400': { $ref: '#/components/responses/FaviconOrderingError400' }
        '401': { $ref: '#/components/responses/FaviconOrderingError401' }
        '403': { $ref: '#/components/responses/FaviconOrderingError403' }
        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }
    patch:
      tags: [Favicon]
      operationId: updateMyFaviconPolicy
      summary: Change the account favicon icon-source policy default
      description: >-
        FO-03. Session + Origin + CSRF + Known-Command-Id. Requires If-Match
        (one strong `"favicon-policy:<revision>"` ETag from GET). Any non-empty
        subset of newDefault (capture/online/none), providerTemplate,
        fillMissing and forceAllOnline is writable. A no-op patch returns the
        same revision with jobId null; a policy change that activates a batch
        behavior atomically creates a durable reconcile job (fill_missing /
        refresh_online / apply_force_online / restore_sources) and returns its
        jobId. Exact retries reuse Known-Command-Id and replay the first
        receipt; changed requests are 409 command_id_reused.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaviconOrderingIconPolicyPatch' }
      responses:
        '200':
          description: The updated policy with the new revision; jobId is always null in FO-01.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaviconOrderingPolicyResult' }
        '400': { $ref: '#/components/responses/FaviconOrderingError400' }
        '401': { $ref: '#/components/responses/FaviconOrderingError401' }
        '403': { $ref: '#/components/responses/FaviconOrderingError403' }
        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '409': { $ref: '#/components/responses/FaviconOrderingError409' }
        '410': { $ref: '#/components/responses/FaviconOrderingError410' }
        '412': { $ref: '#/components/responses/FaviconOrderingError412' }
        '413': { $ref: '#/components/responses/FaviconOrderingError413' }
        '415': { $ref: '#/components/responses/FaviconOrderingError415' }
        '428': { $ref: '#/components/responses/FaviconOrderingError428' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }
  /api/v1/me/favicon-jobs:
    post:
      tags: [Favicon]
      operationId: createMyFaviconJob
      summary: Create a durable batch favicon job
      description: >-
        FO-03. Session + Origin + CSRF + Known-Command-Id. Creates a durable
        batch job (fill_missing or refresh_online) against the current policy
        revision; the created job is tracked by the returned jobId and the UI
        polls it. An active job of the same operation on the same policy
        revision is returned instead of enqueueing the same jobId twice;
        creating a new job supersedes older active batch jobs of the account.
        Stale policyRevision => 409 revision_conflict. Exact retries reuse
        Known-Command-Id and replay the first 202 receipt; changed requests
        are 409 command_id_reused. Feature flag off returns 404.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaviconOrderingCreateIconJob' }
      responses:
        '202':
          description: The durable job was created; clients poll GET /api/v1/me/favicon-jobs/{jobId}.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaviconOrderingIconJobAccepted' }
        '400': { $ref: '#/components/responses/FaviconOrderingError400' }
        '401': { $ref: '#/components/responses/FaviconOrderingError401' }
        '403': { $ref: '#/components/responses/FaviconOrderingError403' }
        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '409': { $ref: '#/components/responses/FaviconOrderingError409' }
        '410': { $ref: '#/components/responses/FaviconOrderingError410' }
        '413': { $ref: '#/components/responses/FaviconOrderingError413' }
        '415': { $ref: '#/components/responses/FaviconOrderingError415' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }
  /api/v1/me/favicon-jobs/{jobId}:
    get:
      tags: [Favicon]
      operationId: getMyFaviconJob
      summary: Read one owned favicon job
      description: >-
        FO-03. Session-required owner-only read of one durable favicon job
        (refresh_one and batch operations). The errors array lists the first
        100 failed items in stable node-ID order; the counters reflect all
        items. A missing or foreign job conceals as 404. Does not accept a
        request body. Feature flag off returns 404.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/ExportJobId'
      responses:
        '200':
          description: The durable job state.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaviconOrderingIconJob' }
        '400': { $ref: '#/components/responses/FaviconOrderingError400' }
        '401': { $ref: '#/components/responses/FaviconOrderingError401' }
        '403': { $ref: '#/components/responses/FaviconOrderingError403' }
        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }
  /api/v1/me/favicon-jobs/{jobId}/retry:
    post:
      tags: [Favicon]
      operationId: retryMyFaviconJob
      summary: Retry the failed items of a terminal favicon job
      description: >-
        FO-03. Session + Origin + CSRF + Known-Command-Id. Accepts only a
        terminal failed or partial job; the new job retries ONLY the failed
        items under the current policy and never re-runs succeeded/skipped
        items. A policy revision change since the failed job is 409
        revision_conflict; an active job of the same operation is returned so
        retries never pile up. Exact retries replay the same new jobId. No
        request body. Feature flag off returns 404.
      security:
        - cookieAuth: []
