        url: { $ref: '#/components/schemas/HttpUrlNoUserInfo' }
        description: { type: [string, 'null'], maxLength: 20000 }
        tags:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        visibility: { $ref: '#/components/schemas/NodeVisibility' }
      required: [kind, title, url, description, tags, visibility]
    NodeCreate:
      oneOf:
        - $ref: '#/components/schemas/FolderCreate'
        - $ref: '#/components/schemas/BookmarkCreate'
