      type: object
      additionalProperties: false
      properties:
        collectionIds: { $ref: '#/components/schemas/LibraryOrderSectionIds' }
      required: [collectionIds]
    LibraryOrderSectionView:
      type: object
      additionalProperties: false
      properties:
        section: { $ref: '#/components/schemas/LibraryOrderSection' }
        collectionIds: { $ref: '#/components/schemas/LibraryOrderSectionIds' }
      required: [section, collectionIds]
    FollowPageDto:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ProfileSummaryDto' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
      required: [items, nextCursor]
    FeedProfileSummaryDto:
      type: object
      additionalProperties: false
      properties:
        profileId: { $ref: '#/components/schemas/ProfileStableId' }
        handle: { type: string, minLength: 1, maxLength: 64, pattern: '^(?!\.{1,2}$)[a-z0-9._~-]+$' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        avatarUrl: { type: [string, 'null'], format: uri, pattern: '^https://', maxLength: 2048 }
      required: [profileId, handle, displayName, avatarUrl]
    FeedItemDto:
      type: object
      additionalProperties: false
      properties:
        feedItemId: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [collection_change, follow_activity] }
        actor: { $ref: '#/components/schemas/FeedProfileSummaryDto' }
        collectionId: { oneOf: [{ $ref: '#/components/schemas/OpaqueId' }, { type: 'null' }] }
        publishedAt: { type: string, format: date-time }
        collectionTitle: { oneOf: [{ type: string, minLength: 1, maxLength: 512 }, { type: 'null' }] }
        publicationSlug: { oneOf: [{ $ref: '#/components/schemas/PublicationSlug' }, { type: 'null' }] }
        summary:
          oneOf: [{ type: string, minLength: 1, maxLength: 200 }, { type: 'null' }]
          description: >-
            Closed machine token for this Feed item, or null. Servers emit
            public_collection_updated when kind is collection_change and
            Collection locators are visible (public Collection with a
            publication slug); new_follower when kind is follow_activity.
            Locators that are not visible yield null. 1.29.0 clients that
            ignore the value remain valid.
        hiddenPublic:
          type: boolean
          description: >-
            #21 transparency tombstone marker, emitted only as true: when an
            active hide_public moderation action covers the collection behind
            a collection_change row, the row stays in the Feed with a
            placeholder collectionTitle and a null publicationSlug instead of
            being omitted; the actor and publishedAt stay real. Absent on
            every other row. 1.69.0 clients that ignore the value remain
            valid.
      required: [feedItemId, kind, actor, collectionId, publishedAt]
    FeedPageDto:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/FeedItemDto' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
      required: [items, nextCursor]
    FeedPageQueryDto:
      type: object
      additionalProperties: false
