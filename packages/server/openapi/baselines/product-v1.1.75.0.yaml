    ProfileSettingsErrorCode:
      type: string
      enum: [invalid_handle, invalid_display_name, handle_taken]
    ProfileSettingsError:
      type: object
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/ProfileSettingsErrorCode' }
        message: { type: string, minLength: 1, maxLength: 512 }
        requestId: { $ref: '#/components/schemas/RequestId' }
        recovery: { $ref: '#/components/schemas/RecoveryAction' }
        sameRequestRetrySafe: { type: boolean }
        precondition: { type: [string, 'null'], enum: [resource, content, null] }
        currentEtag:
          oneOf:
            - $ref: '#/components/schemas/EntityTag'
            - type: 'null'
        retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
