    PublicReportIssue:
      type: object
      additionalProperties: false
      required: [id, title, summary, publishedAt, url]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: [string, 'null'], maxLength: 2000 }
        publishedAt: { type: string, format: date-time }
        url: { type: [string, 'null'], format: uri-reference, maxLength: 4096 }
        issueKey:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Series-scoped issue key (for example a weekly period key such as
            2026-W36), copied verbatim from the published Edition. Present on
            every published issue projection.
        editionOrdinal:
          type: integer
          minimum: 1
          description: >-
            One-based ordinal of this Edition within its series, copied
            verbatim from the published Edition.
        periodStart:
          type: [string, 'null']
          format: date-time
          description: Start of the reporting period covered by this issue.
        periodEnd:
          type: [string, 'null']
          format: date-time
          description: End of the reporting period covered by this issue.
        sourceCollectionSlug:
          type: [string, 'null']
          minLength: 1
          maxLength: 63
          description: >-
            Public slug of the issue's source Collection, exposed so readers
            can open the live entries at /c/{slug}. Present only when the
            source Collection is publicly visible and the issue is not a
            moderation tombstone; the internal Collection ID never appears in
            this anonymous projection.
        state:
          type: string
          enum: [visible, hidden]
          description: >-
            Tombstone marker for a moderation-hidden (hide_public) issue: the
            row keeps its position with summary, url, and sourceCollectionSlug
            nulled and the title replaced by a placeholder, so moderation
            never silently shrinks a readable series. Absent on responses
            from older servers and on every visible issue.
    PublicReportSeries:
      type: object
      additionalProperties: false
      required: [id, title, summary, slug, visibility, indexable, updatedAt, issues]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: [string, 'null'], maxLength: 2000 }
        slug: { type: string, minLength: 1, maxLength: 63 }
        visibility: { type: string, enum: [public, unlisted] }
        indexable: { type: boolean }
        updatedAt: { type: string, format: date-time }
        curator:
          $ref: '#/components/schemas/ProfileSummaryDto'
          description: >-
            Public Profile summary of the series owner, resolved through the
            same identity-owned discoverability projection that completes
            PublicCollectionSummary.owner. Absent when the owner Profile
            cannot be projected; the internal owner subject never appears in
            this anonymous projection.
        followerCount:
          type: integer
          minimum: 0
          description: >-
            Active followers of this series. Absent when the deployment does
            not expose the Follow ledger on this surface.
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
          minItems: 0
          maxItems: 64
          uniqueItems: true
        language:
          oneOf:
            - { type: string, minLength: 1, maxLength: 35 }
            - { type: 'null' }
        sourceCollectionSlug:
          type: string
          minLength: 1
          maxLength: 63
          description: >-
            Public slug of the newest visible issue's source Collection, so
            readers can open the live source at /c/{slug}. Absent when the
            series has no visible issues.
        issues:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PublicReportIssue' }
