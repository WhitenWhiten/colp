        actorDisplayName:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: 'null'
        collectionTitle:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: 'null'
        publicationSlug:
          oneOf:
            - $ref: '#/components/schemas/PublicationSlug'
            - type: 'null'
        summary:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
          description: >-
            Closed machine token for this Notification item, or null. Servers
            emit public_collection_updated when notificationType is
            collection_change and Collection locators are visible (same
            qualification as title and slug); new_follower when
            notificationType is follow_activity. A collection_change row whose
            Collection is no longer public with a slug stays in the inbox with
            summary null. 1.29.0 clients that ignore the value remain valid.
