      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
    AttachmentRateLimited:
      description: >-
        rate_limited. Retry-After and the fixed RateLimit-Policy are emitted;
        exhausted quota is never mislabeled as infrastructure failure.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
    AttachmentInternalError:
      description: internal_error.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
    AttachmentServiceUnavailable:
      description: >-
        rate_limit_unavailable when the admission rate limiter cannot decide
        (never a fabricated quota fact; Retry-After is intentionally absent),
        or attachments_not_implemented while a behavior is not yet implemented.
        Both are closed states: no partial success is ever returned.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
