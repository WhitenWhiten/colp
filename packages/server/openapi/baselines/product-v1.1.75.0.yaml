  /api/v1/collections/{collectionId}/children:
    get:
      tags: [Collections, Favicon]
      operationId: listCollectionChildren
      summary: List exactly one layer of children of a Collection folder
      description: >-
        FO-05. Reads live children (folders and bookmarks) directly under
        `parentId`, or under the collection root when `parentId` is omitted;
        one layer only, never a flattened tree, and the folder scope, root and
        parent/child relations are preserved. `sort=curated` (default) uses the
        canonical position tokens; created_asc / created_desc order by creation
        time with the same-millisecond ties resolved by ascending node id and
        change ONLY the read view — no position token, revision, sync log or
        reading path is written. `collectionId` is the real opaque collection
        id, never a publication slug. Anonymous reads are allowed only for
        public collections; owner/member reads use ordinary authority. Pages
        are bounded by both `limit` and a 65536 UTF-8 byte budget; a
        byte-limited short page still returns nextCursor for the first
        unconsumed eligible item. Continuations use the opaque HMAC-authenticated
        cursor (blind 900s expiry or a content revision change => 409
        snapshot_expired; tampered/mismatched cursor => 400 invalid_cursor).
        reading_path collections reject created sorts with 400 invalid_query.
        Feature flag KNOWN_FEATURE_FAVICON_POLICY=false returns 404.
      security:
        - cookieAuth: []
        - productBearer: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - name: parentId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OpaqueId' }
          description: Live folder in this collection; omitted means the collection root.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [curated, created_asc, created_desc]
            default: curated
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: >-
            First-page page size (default 50, max 100). A continuation page
            may echo the same limit together with cursor — the cursor already
            binds the first-page limit, so a matching echo is accepted and any
            other limit with a cursor is 400 invalid_cursor (restart from the
            first page).
        - name: cursor
          in: query
          required: false
          schema: { $ref: '#/components/schemas/FaviconOrderingCursor' }
      responses:
        '200':
          description: One layer of children with a page cursor.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaviconOrderingChildrenPage' }
        '400': { $ref: '#/components/responses/FaviconOrderingError400' }
        '401': { $ref: '#/components/responses/FaviconOrderingError401' }
        '403': { $ref: '#/components/responses/FaviconOrderingError403' }
        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '409': { $ref: '#/components/responses/FaviconOrderingError409' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }
