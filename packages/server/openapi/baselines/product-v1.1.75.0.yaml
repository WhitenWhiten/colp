  /api/v1/favicon/{faviconId}:
    get:
      tags: [Collections]
      operationId: getBookmarkFavicon
      summary: Get a public bookmark favicon image by id
      description: >-
        Anonymous public favicon object bytes. No Product Session and no
        cookieAuth. faviconId is a 36-character UUID leaf matching
        /^[a-f0-9-]{36}$/i. Illegal ids and missing objects share the same
        404 resource_not_found shape (no existence oracle). Transport may use
        public-revalidate so admission does not fill no-store; 200 and 404
        pin Cache-Control themselves. 200 is public, max-age=31536000,
        immutable. 404 is public, max-age=60. GET does not look up
        bookmark_icons; an object may remain 200 until R2 DELETE. No
        Set-Cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/FaviconId'
      responses:
        '200':
          description: Favicon image bytes.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicImmutableImageCache' }
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/x-icon:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/FaviconNotFound'

