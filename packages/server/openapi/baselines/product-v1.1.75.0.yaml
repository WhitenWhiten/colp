          type: [string, 'null']
          enum: [resource, content, null]
        currentEtag:
          oneOf:
            - $ref: '#/components/schemas/EntityTag'
            - type: 'null'
        retryAfterSeconds:
          type: [integer, 'null']
          minimum: 0
        fieldErrors:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/FieldError' }
      required:
        - code
        - message
        - requestId
        - recovery
        - sameRequestRetrySafe
        - precondition
        - currentEtag
        - retryAfterSeconds
        - fieldErrors
    ProductErrorEnvelope:
      type: object
