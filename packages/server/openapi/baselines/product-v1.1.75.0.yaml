      summary: Read the curation overlay of a community comment
      description: >-
        Curator-only read of the comment's curation overlay (the
        owner/editor hide state). The comment must exist on a still-live
        target generation — concealed targets and superseded generations
        are 404 resource_not_found — and the viewer must be the target
        owner or an active owner/editor member of the governing
        collection/series; anyone else is 403 insufficient_permission.
        Before any curator write the virtual representation is served
        (hidden false, revision "1"). The response carries the
        independent curation ETag; it never equals the comment ETag.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/CommunityCommentIdPath'
      responses:
        '200':
          description: The current curation overlay with its independent ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityCuration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Community]
      operationId: setCommentCuration
      summary: Hide or unhide a community comment
      description: >-
        Curator-only hide/unhide through the per-comment curation overlay.
        Session + Origin + CSRF + Known-Command-Id + a required If-Match
        carrying the independent curation ETag (the virtual tag before any
        write); a missing header is 428 precondition_required, a malformed
        tag is 400 invalid_request, and a stale tag is 412
        precondition_failed. The body is the closed {hidden, reason}
        object; reason is required (1..1000 characters) for hide and
        unhide writes. The actor must be the target owner or an active
        owner/editor member of the governing collection/series; anyone
        else is 403 insufficient_permission. hidden=false removes only
        this curator overlay: it never resurrects an author-deleted
        tombstone and never touches the comment row state. Every write
        appends an immutable audit event. Exact Known-Command-Id retries
        replay the saved outcome; a changed request with a reused id is
        409 command_id_reused.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/CommunityCommentIdPath'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                hidden: { type: boolean }
                reason: { type: string, minLength: 1, maxLength: 1000 }
              required:
                - hidden
                - reason
      responses:
        '200':
          description: The updated curation overlay with its new ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityCuration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/community/comment-settings:
    get:
      tags: [Community]
      operationId: getCommunityCommentSettings
      summary: Read the comment-area settings of a community target
      description: >-
        Curator-only read of the per-target comment-area settings (the
        lock state). The query repeats the comment-list target validation
        exactly: kind, id and generation are required, collectionId is
        required only for bookmark, seriesId only for digest_edition, and
        every other parent combination is forbidden; a stale generation
        conceals the area as 404 resource_not_found. The viewer must be
        the target owner or an active owner/editor member of the
        governing collection/series; anyone else is 403
        insufficient_permission. Before any write the virtual
        representation is served (locked false, revision "1"). The
        response carries the independent settings ETag.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/CommunityTargetKind'
        - $ref: '#/components/parameters/CommunityTargetId'
        - $ref: '#/components/parameters/CommunityCollectionId'
        - $ref: '#/components/parameters/CommunitySeriesId'
        - $ref: '#/components/parameters/CommunityGeneration'
      responses:
        '200':
          description: The current comment-area settings with their independent ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityCommentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Community]
      operationId: setCommunityCommentSettings
      summary: Lock or unlock the comment area of a community target
      description: >-
        Curator-only lock/unlock of the per-target comment area. Session +
        Origin + CSRF + Known-Command-Id + a required If-Match carrying
        the independent settings ETag (the virtual tag before any write);
        a missing header is 428 precondition_required, a malformed tag is
        400 invalid_request, and a stale tag is 412 precondition_failed.
        The body is the closed PutCommentSettings {target, locked,
        reason}; reason is required (1..1000 characters) for lock and
        unlock writes. The supplied target must equal the currently
        resolved identity AND generation — a stale generation is 409
        revision_conflict so the curator re-resolves before confirming —
        while the stored settings row itself is generation-independent
        and survives a bookmark generation advance. The actor must be the
        target owner or an active owner/editor member of the governing
        collection/series; anyone else is 403 insufficient_permission. A
        locked area rejects new comments for everyone; existing comments
        stay readable. Every write appends an immutable audit event.
        Exact Known-Command-Id retries replay the saved outcome; a
        changed request with a reused id is 409 command_id_reused.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityPutCommentSettings' }
      responses:
        '200':
          description: The updated comment-area settings with their new ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityCommentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/me/community-notifications:
    get:
      tags: [Community]
      operationId: listMyCommunityNotifications
      x-known-route-manifest: true
      summary: Page the current principal's community reply-notification inbox
      description: >-
        Session-scoped read of the durable comment_reply inbox written by
        the community.comment-created outbox projection — never the frozen
        Phase 5 notification surface (whose kinds stay collection_change
        and follow_activity). read filters all|unread (default all),
        limit is 1..100 (default 20), and cursor is the opaque HMAC-bound
        v1 keyset cursor (900s TTL) binding the endpoint, viewer, filter
        and limit. Every item is re-proven against the reply comment and
        the resolved target on each page: a comment that is deleted or
        curator-hidden keeps its position with preview null, while a
        notification whose target no longer resolves (or whose stored
        generation went stale) is concealed and does not count toward
        unreadCount. unreadCount itself counts only still-servable unread
        rows. A tampered or mismatched cursor is 400 invalid_cursor.
      security: [{ cookieAuth: [] }, { productBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/CommunityNotificationRead'
        - $ref: '#/components/parameters/CommunityNotificationLimit'
        - $ref: '#/components/parameters/CommunityNotificationCursor'
      responses:
        '200':
          description: One page of the community reply-notification inbox with the servable unread count.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityNotificationInbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/me/community-notifications/read:
    post:
      tags: [Community]
      operationId: markMyCommunityNotificationsRead
      x-known-route-manifest: true
      summary: Mark a bounded set of community reply notifications read exactly once
      description: >-
        Session + Origin + CSRF + Known-Command-Id. The body is the closed
        object {ids} with 1..100 distinct opaque ids; ids that are absent,
        foreign, or no longer servable are ignored rather than revealed,
        and the result reports the actually transitioned ids in
        changedIds plus the post-write servable unreadCount. Rows already
        read stay read and are not echoed as changed. Exact
        Known-Command-Id retries replay the saved outcome; a changed
        request with a reused id is 409 command_id_reused, an in-flight id
        is 409 command_in_progress, and an expired stored result is 410
        command_result_expired.
      security: [{ cookieAuth: [] }, { productBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityReadNotifications' }
      responses:
        '200':
          description: The transitioned ids and the servable unread count after the write.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityReadNotificationsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/me/community-notification-preferences:
    get:
      tags: [Community]
      operationId: getMyCommunityNotificationPreference
      x-known-route-manifest: true
      summary: Read the current principal's community notification preference
      description: >-
        Session-scoped read of the notification_preferences row for
        channel community — the gate the reply-notification projection
        consults before writing a comment_reply notification. Before any
        write the virtual enabled representation is served (enabled true,
        revision "1", updatedAt the account creation stamp). The response
        carries the strong opaque preference ETag that PUT requires as
        If-Match.
      security: [{ cookieAuth: [] }, { productBearer: [] }]
      responses:
        '200':
          description: The current community notification preference with its opaque ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityNotificationPreference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Community]
      operationId: putMyCommunityNotificationPreference
      x-known-route-manifest: true
      summary: Update the current principal's community notification preference exactly once
      description: >-
        Session + Origin + CSRF + Known-Command-Id + a required If-Match
        carrying the opaque preference ETag (the virtual tag before any
        write). The body is the closed object {enabled}. A missing
        If-Match is 428 precondition_required, a malformed tag is 400
        invalid_request, and a stale tag is 412 precondition_failed with
        recovery refresh_and_retry. Exact Known-Command-Id retries replay
        the saved outcome; a changed request with a reused id is 409
        command_id_reused.
      security: [{ cookieAuth: [] }, { productBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityPutNotificationPreference' }
      responses:
        '200':
          description: The updated community notification preference with its new ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityNotificationPreference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-known_session
      description: >-
        HttpOnly, Secure, SameSite=Lax, Path=/, no Domain. Phase 1 supports
        HTTPS same-site Web/API deployments only.
    parentKey:
      type: http
      scheme: bearer
      description: Operator-provisioned parent credential for child and grant/plan management only.
    productBearer:
      type: http
      scheme: bearer
      description: >-
        Short-lived Product access token from POST /api/v1/auth/key-token.
        Cookie and Authorization together are rejected. JWT aud is PRODUCT_ORIGIN.

  parameters:
    AccountCredentialId:
      name: credentialId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ProfileIdPath:
      name: profileId
      in: path
      required: true
      description: Stable identity-owned Profile ID, never a mutable handle.
      schema: { $ref: '#/components/schemas/ProfileStableId' }
    FollowCursor:
      name: cursor
      in: query
      required: false
      description: Opaque principal-, Profile-, direction-, limit-, purpose-, comparator-, key- and expiry-bound cursor. Omit limit when continuing.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    FollowLimit:
      name: limit
      in: query
      required: false
      description: First-page size. A continuation uses the limit sealed into its cursor.
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    FeedKind:
      name: kind
      in: query
      required: false
      description: Optional exact Feed item kind. Case and surrounding whitespace are normalized only after cardinality validation.
      schema: { type: string, enum: [collection_change, follow_activity] }
    FeedCursor:
      name: cursor
      in: query
      required: false
      description: Opaque principal-, filter-, limit-, purpose-, comparator-, key- and expiry-bound Feed cursor. Omit limit when continuing.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    FeedLimit:
      name: limit
      in: query
      required: false
      description: First-page Feed size. A continuation uses the limit sealed into its cursor.
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    NotificationState:
      name: state
      in: query
      required: false
      schema: { type: string, enum: [all, read, unread], default: all }
    NotificationCursor:
      name: cursor
      in: query
      required: false
      description: Principal-, state-, page-size-, purpose-, comparator-, key-, and expiry-bound continuation.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    NotificationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    NotificationRead:
      name: read
      in: query
      required: false
      description: >-
        Frozen Phase 5 compatibility filter. true reads the read inbox, false
        the unread inbox; absent reads the whole inbox. The successor path uses
        the state parameter instead.
      schema: { type: boolean }
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    NotificationChannelPath:
      name: channel
      in: path
      required: true
      description: >-
        Preference channel to read/update. in_app is the Notification center
        channel; email is the optional P5-30 email delivery channel. PUT binds
        the If-Match validator to this channel:
        "notification-preference:<channel>:<revision>".
      schema: { type: string, enum: [in_app, email] }
    PublicProfileHandlePath:
      name: handle
      in: path
      required: true
      description: Case-insensitive public handle locator, canonicalized to lowercase by the server.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^(?!\.{1,2}$)[A-Za-z0-9._~-]{1,64}$'
    PublicProfileLimit:
      name: limit
      in: query
      required: false
      description: Number of public Collection summaries in this keyset page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PublicProfileCursor:
      name: cursor
      in: query
      required: false
      description: Signed Profile-only Product cursor. Do not log, parse, or reuse for another purpose.
      schema:
        $ref: '#/components/schemas/PublicProfileCursorValue'
    PublicActivityLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 30. Values outside 1..100 are invalid_query.
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    PublicActivityCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Signed public Activity cursor (purpose social.public-activity.v1).
        Do not log, parse, or reuse a Feed or Profile cursor.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        One raw header field containing RFC entity-tag validators or *. Duplicate
        header fields are rejected before framework normalization.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    ExploreQuery:
      name: q
      in: query
      required: false
      description: Optional title/summary search text. Truncated to 256 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ExploreTag:
      name: tag
      in: query
      required: false
      description: Optional tag filter. Truncated to 64 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ExploreLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 24. Values outside 1..100 are invalid_query.
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    ExploreCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque product Explore continuation (base64url JSON). The JSON shape
        must match the effective query sort: `{ sort: 'updated', micros, id }`
        for updated (default); `{ sort: 'popular', viewCount, micros, id }` for
        popular; `{ sort: 'links', nodeCount, micros, id }` for links. Old
        cursors without `sort` are valid only with default `updated`. A
        query.sort vs cursor.sort mismatch, an old cursor used with
        popular/links, or missing sort keys for that order is invalid_cursor.
      schema: { type: string, minLength: 1, maxLength: 512 }
    ExploreLanguage:
      name: language
      in: query
      required: false
      description: Canonical BCP47 exact filter. Omitted means all languages. Structurally invalid values are invalid_query.
      schema: { type: string, minLength: 1, maxLength: 35 }
    ExploreSort:
      name: sort
      in: query
      required: false
      description: >-
        Page order. Defaults to updated (updatedAt desc, then id). popular
        orders by the 30 UTC-day collection_view sum desc, then updatedAt desc,
        then id. links orders by live nodeCount desc, then updatedAt desc, then
        id. Unknown values are invalid_query.
      schema:
        type: string
        enum: [updated, popular, links]
        default: updated
    SearchQuery:
      name: q
      in: query
      required: true
      description: >-
        Search text. The transport applies a 2048-byte encoded component limit before percent decoding,
        then bounded NFKC normalization, code-point, token, combining-mark, and operator complexity limits.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    SearchType:
      name: type
      in: query
      required: false
      description: Repeat once per selected result type; duplicate values and comma-joined values are invalid.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: { $ref: '#/components/schemas/SearchResourceType' }
    SearchCursor:
      name: cursor
      in: query
      required: false
      description: Signed Search-only continuation. Omit limit when continuing and never parse or log this value.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    SearchLimit:
      name: limit
      in: query
      required: false
      description: First-page result count. A continuation uses the page size signed into its cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchAccept:
      name: Accept
      in: header
      required: false
      description: RFC media range list. Search selects application/json; unsupported ranges return 406.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    AcceptJson:
      name: Accept
      in: header
      required: false
      description: RFC media range list. This operation selects application/json; unsupported ranges return 406.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    OwnedCollectionKind:
      name: kind
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CollectionKind' }
    OwnedCollectionVisibility:
      name: visibility
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CollectionVisibility' }
    OwnedCollectionLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    OwnedCollectionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque Subject-, filter-, limit-, sort-, comparator-, key-version-, purpose-, and expiry-bound continuation. Must be the only query parameter.
      schema: { $ref: '#/components/schemas/Cursor' }
    CollaborationListCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque Subject-, Collection- (members list), purpose-, comparator-,
        key-version-, and expiry-bound continuation. Omit on the first page.
      schema: { $ref: '#/components/schemas/Cursor' }
    LinkHealthScopeFilter:
      name: scope
      in: query
      required: false
      description: >-
        First-page row-set filter. Omitted means owned. Must be omitted when
        cursor is present; continuation encodes scope in the cursor.
      schema: { $ref: '#/components/schemas/LinkHealthScope' }
    LinkHealthStatusFilter:
      name: status
      in: query
      required: false
      description: First-page status filter. Must be omitted when cursor is present.
      schema: { $ref: '#/components/schemas/LinkHealthStatus' }
    LinkHealthCollectionId:
      name: collectionId
      in: query
      required: false
      description: First-page Collection OpaqueId filter. Must be omitted when cursor is present.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    LinkHealthDuplicate:
      name: duplicate
      in: query
      required: false
      description: >-
        When true, only items whose duplicateOfNodeId is non-null. Must be
        omitted when cursor is present.
      schema: { type: boolean }
    LinkHealthLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    LinkHealthCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque Subject-, filter- (including scope), limit-, sort-, comparator-,
        key-version-, purpose-, and expiry-bound continuation that explicitly
        encodes a null checkedAt keyset bound. Must be the only query
        parameter. Continuation uses the encoded scope; omitted query scope is
        not defaulted to owned.
      schema: { $ref: '#/components/schemas/Cursor' }
    ClassifyInboxLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    ClassifyInboxCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque Subject-, limit-, sort-, comparator-, key-version-, purpose-,
        and expiry-bound continuation for (createdAt DESC, nodeId DESC).
        Must be the only query parameter.
      schema: { $ref: '#/components/schemas/Cursor' }
    FollowedCollectionsLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    FollowedCollectionsCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque principal-, limit-, comparator-, key-version-, purpose-, and
        expiry-bound continuation for (followedAt DESC, collectionId DESC).
        Must be the only query parameter.
      schema: { $ref: '#/components/schemas/Cursor' }
    LibraryOrderSection:
      name: section
      in: path
      required: true
      description: Sidebar section whose saved order is replaced.
      schema: { $ref: '#/components/schemas/LibraryOrderSection' }
    PublicCollectionSlugPath:
      name: collectionId
      in: path
      required: true
      description: >-
        Canonical publication slug for GET getPublicCollectionPage. This path
        segment is not the Collection OpaqueId used by PATCH updateCollection.
        GET looks up the Collection solely via findCollectionIdBySlug; it does
        not load by collection id. A UUID-shaped token is still treated as a
        slug, never as an OpaqueId fallback.
      schema: { $ref: '#/components/schemas/PublicationLocatorSlug' }
    PublicCollectionInsightSlugPath:
      name: slug
      in: path
      required: true
      description: Canonical lowercase publication slug for anonymous insight ingest.
      schema: { $ref: '#/components/schemas/PublicationLocatorSlug' }
    PublicCollectionLimit:
      name: limit
      in: query
      required: false
      description: Page node limit, including the Root on the first page.
      schema:
        type: integer
        minimum: 2
        maximum: 500
        default: 200
    PublicCollectionCursor:
      name: cursor
      in: query
      required: false
      description: Signed Product public-page cursor. It is not a COLP or Editor cursor.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Case-sensitive opaque Collection ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    InviteId:
      name: inviteId
      in: path
      required: true
      description: Case-sensitive opaque collection invite ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SubjectId:
      name: subjectId
      in: path
      required: true
      description: Case-sensitive opaque Subject ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Case-sensitive opaque Node ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ExportJobId:
      name: jobId
      in: path
      required: true
      description: Case-sensitive opaque export job ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    OrganizePlanId:
      name: planId
      in: path
      required: true
      description: Case-sensitive opaque organize plan ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    CollectionVersionId:
      name: versionId
      in: path
      required: true
      description: Case-sensitive opaque collection tree version ID.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    CollectionVersionsLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    CollectionVersionsCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque Subject-, limit-, sort-, comparator-, key-version-, purpose-,
        and expiry-bound continuation for (createdAt DESC, versionId DESC).
        Must be the only query parameter.
      schema: { $ref: '#/components/schemas/Cursor' }
    FaviconId:
      name: faviconId
      in: path
      required: true
      description: >-
        Opaque 36-character UUID leaf. Illegal values and missing objects share
        the same 404 resource_not_found shape (no existence oracle).
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: '^[a-fA-F0-9-]{36}$'
    PlanId:
      name: planId
      in: path
      required: true
      description: Case-sensitive opaque MCP Write Plan ID.
