  /api/v1/auth/oidc/callback:
    get:
      tags: [BrowserAuth]
      operationId: completeOidcAuthorization
      summary: 'Complete the browser OIDC authorization flow (deprecated: legacy OIDC)'
      description: >-
        DEPRECATED (legacy OIDC/Logto flow, Task F2): the Better Auth
        migration removes this flow from the runtime composition when
        BETTER_AUTH_ENABLED=true — the endpoint answers 404 in Better Auth
        mode and is retained here only as the deprecated legacy contract for
        the rollback window (F3 removes the OpenAPI/manifest entries).
        Accepts exactly one success branch (code plus state) or one failure
        branch (error plus state). Optional standard iss, session_state,
        error_description, and error_uri parameters are accepted; only iss is
        used and must match the configured issuer. Every failure clears the
        one-time transaction when safe to do so. Terminal denials redirect to
        the fixed /login?auth=failed path. Non-replayable failures after the
        authorization code or login transaction is consumed redirect to
        /login?auth=restart so the browser starts a brand-new login (the same
        code/state must never be retried).
      security: []
      parameters:
        - $ref: '#/components/parameters/OidcCode'
        - $ref: '#/components/parameters/OidcState'
        - $ref: '#/components/parameters/OidcError'
        - $ref: '#/components/parameters/OidcIssuer'
        - $ref: '#/components/parameters/OidcSessionState'
        - $ref: '#/components/parameters/OidcErrorDescription'
        - $ref: '#/components/parameters/OidcErrorUri'
      responses:
        '303':
          description: >-
            Redirect to the validated same-origin returnTo on success; to the
            fixed /login?auth=failed location on terminal denial; or to
            /login?auth=restart when the flow is non-replayable and the user
            must begin a new login.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
