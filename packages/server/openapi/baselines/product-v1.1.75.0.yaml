            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Community]
      operationId: deleteCommunityComment
      summary: Permanently soft-delete a community comment
      description: >-
        Author-only permanent soft deletion. Session + Origin + CSRF +
        Known-Command-Id + a required If-Match carrying the comment's own
        strong ETag; a missing header is 428 precondition_required, a
        malformed tag is 400 invalid_request, and a stale tag is 412
        precondition_failed. The stored row is never physically removed:
        body becomes null, state becomes deleted, and the reply tree and
        root/reply identity are preserved so the thread keeps stable
        ordering. Deletion is permanent and can never be undone by
        curation unhide; deleting twice is 400 invalid_request. Concealed
        targets and superseded generations are 404 resource_not_found.
        Exact Known-Command-Id retries replay the saved tombstone; a
        changed request with a reused id is 409 command_id_reused. The
        200 response returns the tombstone Comment with its new ETag.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
