      required: [collection, root, nodes, capabilities, page]

    PublicCollectionSummary:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        slug: { $ref: '#/components/schemas/PublicationLocatorSlug' }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary:
          oneOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        kind: { type: string, enum: [bookmarks, reading_path, knowledge_collection, mixed] }
        rootNodeId: { $ref: '#/components/schemas/OpaqueId' }
        updatedAt: { $ref: '#/components/schemas/UtcDateTime' }
        access: { type: string, enum: [public, member] }
        owner: { $ref: '#/components/schemas/ProfileSummaryDto' }
        faviconCdnAllowed:
          type: boolean
          description: >-
            True only when collection.visibility is public and this page's
            snapshot projection access is public. Absent or not true MUST be
            treated as false. Clients must not hotlink a third-party favicon
            CDN unless this is true.
        viewCount:
          type: integer
          minimum: 0
          description: >-
            Sum of collection_view counts over 30 UTC calendar days including
            today. Zero when the collection has no publication_insight_daily
            rows in that window.
        curatorNote:
          type: [string, 'null']
          maxLength: 65536
          description: >-
            Latest public collection tldr (curator recommendation for the
            whole collection), or null. Only visibility=public collection
            annotation rows are ever exposed; private, protected, and
            unlisted marks never appear on this surface. The length cap
            matches the annotation value text budget.
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
          minItems: 0
          maxItems: 64
          uniqueItems: true
        language:
          oneOf:
            - { type: string, minLength: 1, maxLength: 35 }
            - { type: 'null' }
      required: [id, slug, title, summary, kind, rootNodeId, updatedAt, access]
    PublicCollectionNode:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        parentId:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueId' }
            - { type: 'null' }
        kind: { type: string, enum: [root, folder, bookmark] }
        title: { type: string, minLength: 1, maxLength: 200 }
        description:
          oneOf:
            - { type: string, maxLength: 10000 }
            - { type: 'null' }
        url:
          oneOf:
            - { type: string, format: uri, maxLength: 8192 }
            - { type: 'null' }
        position:
          oneOf:
            - { type: string, minLength: 1, maxLength: 512 }
            - { type: 'null' }
        iconUrl:
          oneOf:
            - { $ref: '#/components/schemas/BookmarkFaviconUrl' }
            - { type: 'null' }
          description: >-
            Same-origin public favicon object when kind is bookmark, or null.
            Folder and root nodes always serialize null. The field stays on
            this closed object for every kind so the shape is not a oneOf union.
        faviconCdnAllowed:
          type: boolean
          description: >-
            Whether this exact bookmark node may fall back to the third-party
            favicon CDN. Present on bookmark nodes only. It is false when the
            owner explicitly set the node icon source to none (an opt-out that
            must never be revived by a hotlink) and otherwise mirrors the
            collection-level faviconCdnAllowed fact. Absent on responses from
            older servers: the collection-level faviconCdnAllowed fact governs
            (that was the pre-FO-07 behavior); where that field is absent too,
            no CDN fallback occurs.
        tldr:
          type: [string, 'null']
          maxLength: 65536
          description: >-
            Public TL;DR annotation text attached to this node (any kind), or
            null. Absent when the node carries no public tldr. Only
            visibility=public annotation rows are ever exposed; private,
            protected, and unlisted marks never appear on this surface. The
            length cap matches the annotation value text budget.
        note:
          type: [string, 'null']
          maxLength: 65536
          description: >-
            Public note annotation text attached to this node (any kind), or
            null. Absent when the node carries no public note. Only
            visibility=public annotation rows are ever exposed; private,
            protected, and unlisted marks never appear on this surface. The
            length cap matches the annotation value text budget.
        state:
          type: string
          enum: [visible, hidden]
          description: >-
            Live-state marker for the node. The value hidden means an official
            moderation action removed this bookmark from public view: the row
            stays in position with url, description, and iconUrl nulled and the
            title replaced by a neutral placeholder, so the list admits that
            moderation acted instead of silently shrinking. Absent on responses
            from older servers and on every visible node.
      required: [id, parentId, kind, title, description, url, position]
