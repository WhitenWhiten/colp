        The published enum is frozen under ADR-0015. The wire-complete set is
        GeneratedProductErrorCode ∪ DriftedProductErrorCode in
        src/transport/product-codes.ts. Current drifted codes: handle_taken,
        invalid_handle, invalid_display_name, invalid_about, mutation_conflict,
        not_acceptable, invalid_credentials, verification_required,
        account_link_required, email_delivery_unavailable, resource_purged. Clients must not
        treat the generated enum as exhaustive. Adding these codes to the
        published enum requires a new major version and a superseding ADR.
      enum:
        - invalid_request
        - invalid_json
        - invalid_query
        - invalid_cursor
        - authentication_required
        - csrf_failed
        - insufficient_permission
        - resource_not_found
        - method_not_allowed
        - command_id_reused
        - command_in_progress
        - publication_slug_conflict
        - position_context_stale
        - folder_not_empty
        - root_immutable
        - revision_conflict
        - snapshot_expired
        - command_result_expired
        - precondition_failed
        - payload_too_large
        - unsupported_media_type
        - invalid_document
        - precondition_required
        - rate_limited
        - internal_error
        - feature_temporarily_unavailable
    FieldError:
      type: object
