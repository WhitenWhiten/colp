  /api/v1/collections/{collectionId}/nodes/{nodeId}/favicon:
    post:
      tags: [Nodes]
      operationId: uploadBookmarkFavicon
      summary: Upload a bookmark favicon image
      description: >-
        Product Session + CSRF. Requires capability update_node. Body hard cap
        65536 bytes (64 KiB). In-progress is 429 rate_limited + Retry-After, never
        409 command_in_progress. Does not bump Node revision. Last-upload-wins on
        the icon row only. Declared SVG/GIF/HTML → 415 unsupported_media_type.
        Exact retries reuse Known-Command-Id. command_id_reused is 409;
        command_result_expired is 410.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/x-icon:
            schema: { type: string, format: binary }
          image/vnd.microsoft.icon:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Updated BookmarkNodeView with the new iconUrl. Node revision is unchanged.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
