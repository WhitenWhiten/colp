openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Known Product API
  version: 1.75.0
  description: >-
    Version 1.70.0 intentionally removes browser credential management: parent keys
    are provisioned only through the database for official bots. Credential child
    and grant management require a valid parent key; invalid bot credentials are
    concealed with 404.
    Phase 1 Web Product API. This contract is separate from COLP Publication,
    Publisher, Sync, MCP, and Admin surfaces. Application commands and COLP
    wire types are mapped explicitly and are not generated from this document.
    info.version 1.12.0 adds the private current-authorized Feed Product API after the 1.11.0 authenticated Follow API while retaining the additive Phase 2B Annotation,
    Relation, Saved Resource, Reading Progress, and bounded PostgreSQL Search surfaces while preserving the accepted Product 1.6 client
    contract under ADR-0015, plus the authenticated owned Collection list and Profile mutation.
    Generated-client drift, command replay versioning, and breaking-change
    policy are governed by that ADR.
    info.version 1.14.0 additively exposes the private current-account MCP Write
    approval list, item, and exact-once decision surface while preserving every
    accepted 1.13.0 Product client contract.
    info.version 1.15.0 additively freezes the owner-private Attachment product
    surface (P4A-P01): issue, complete, status/private metadata, finalize,
    replacement, retire, and download admission under /api/v1/attachments while
    preserving every accepted 1.14.0 Product client contract. Attachment
    behaviors are NOT implemented by this contract version; every attachment
    operation returns the documented closed state until the owning task lands.
    info.version 1.16.0 additively exposes anonymous public-collection insight
    ingest (collection_view, preview_open, resource_open) at
    POST /api/v1/public-collections/{slug}/insight-events while preserving every
    accepted 1.15.0 Product client contract.
    info.version 1.17.0 additively exposes the authenticated owner publishing
    insights dashboard at GET /api/v1/me/publishing-insights while preserving
    every accepted 1.16.0 Product client contract.
    info.version 1.18.0 additively exposes authenticated collection member and
    invite operations (list, invite, revoke, role, remove, and the current
    subject's pending invites with accept/decline) while preserving every
    accepted 1.17.0 Product client contract.
    info.version 1.19.0 additively exposes the authenticated shared Collection
    list at GET /api/v1/me/shared-collections while preserving every accepted
    1.18.0 Product client contract.
    info.version 1.20.0 additively adds optional bookmarkCount on
    OwnedCollectionListItem while preserving every accepted 1.19.0 Product
    client contract.
    info.version 1.21.0 additively exposes UnauthenticatedSessionView.verificationRequired
    (true when a Better Auth occupancy cookie exists but email is not verified)
    and documents GET /api/v1/me 403 verification_required for that occupancy,
    while preserving every accepted 1.20.0 Product client contract.
    info.version 1.22.0 additively exposes anonymous GET /api/v1/favicon/{faviconId}
    and authenticated Session POST/DELETE bookmark favicon bytes at
    /api/v1/collections/{collectionId}/nodes/{nodeId}/favicon, plus optional
    iconUrl on BookmarkNodeView and PublicCollectionNode and optional
    faviconCdnAllowed on PublicCollectionSummary, while preserving every
    accepted 1.21.0 Product client contract. The Known extension helper is
    not part of this Product document.
    info.version 1.23.0 additively exposes anonymous GET/HEAD
    /api/v1/explore/collections (the public Explore directory page with
    curator DTO completion) while preserving every accepted 1.22.0 Product
    client contract.
    info.version 1.24.0 additively joins public collection title, publication
    slug, and summary onto FeedItemDto while preserving
    every accepted 1.23.0 Product client contract.
    info.version 1.25.0 additively exposes optional actorHandle, actorDisplayName,
    collectionTitle, publicationSlug, and summary on successor NotificationItem
    while preserving every accepted 1.24.0 Product client contract.
    info.version 1.26.0 additively exposes anonymous GET/HEAD
    /api/v1/profiles/{handle}/activity (public Profile collection-change
    activity) while preserving every accepted 1.25.0 Product client contract.
    info.version 1.27.0 additively adds optional ExploreCollectionItem.viewCount
    and an optional Explore sort query (updated | popular | links) with
    sort-keyed continuation cursors while preserving every accepted 1.26.0
    Product client contract.
    info.version 1.28.0 additively exposes the authenticated owned bookmark
    link-health list at GET /api/v1/me/link-health while preserving every
    accepted 1.27.0 Product client contract.
    info.version 1.29.0 additively exposes POST /api/v1/me/link-health/checks
    (enqueue owned bookmark probes) while preserving every accepted 1.28.0
    Product client contract.
    info.version 1.30.0 documents closed summary tokens on FeedItemDto,
    successor NotificationItem, and PublicProfileActivityItem
    (public_collection_updated for still-public collection_change,
    new_follower for follow_activity, and null on inbox when the Collection
    is no longer public with a slug) while preserving every accepted 1.29.0
    Product client contract.
    info.version 1.31.0 additively adds optional PublicCollectionSummary.viewCount
    (30 UTC-day collection_view sum, same as Explore) while preserving every
    accepted 1.30.0 Product client contract.
    info.version 1.32.0 additively adds optional GET /api/v1/me/link-health
    scope (owned|shared|all; omitted first page is owned) and optional
    LinkHealthItem membership (owner|editor|viewer), and documents shared-editor
    POST checks, while preserving every accepted 1.31.0 Product client contract.
    info.version 1.33.0 additively exposes owner library export jobs at
    POST/GET /api/v1/me/export-jobs, GET /api/v1/me/export-jobs/{jobId},
    and GET /api/v1/me/export-jobs/{jobId}/download while preserving every
    accepted 1.32.0 Product client contract.
    info.version 1.34.0 additively adds optional cursor pagination on
    GET /api/v1/collections/{collectionId}/members and
    GET /api/v1/me/collaboration-invites while preserving every
    accepted 1.33.0 Product client contract.
    info.version 1.35.0 additively exposes the authenticated owned classify
    inbox list at GET /api/v1/me/classify-inbox while preserving every
    accepted 1.34.0 Product client contract.
    info.version 1.36.0 additively exposes POST
    /api/v1/me/classify-inbox/{nodeId}/skip (persist a skipped sidecar
    decision without moving the node) while preserving every accepted
    1.35.0 Product client contract.
    info.version 1.37.0 additively exposes POST
    /api/v1/me/classify-inbox/{nodeId}/accept (move the bookmark into the
    suggested folder via moveCollectionNode and persist an accepted sidecar)
    while preserving every accepted 1.36.0 Product client contract.
    info.version 1.38.0 additively exposes owner organize-plan create and get
    at /api/v1/collections/{collectionId}/organize-plans while preserving every
    accepted 1.37.0 Product client contract.
    info.version 1.39.0 additively exposes POST
    /api/v1/collections/{collectionId}/organize-plans/{planId}/apply while
    preserving every accepted 1.38.0 Product client contract.
    info.version 1.40.0 additively exposes owner collection tree versions at
    POST/GET /api/v1/collections/{collectionId}/versions and GET
    /api/v1/collections/{collectionId}/versions/{versionId} while preserving
    every accepted 1.39.0 Product client contract.
    info.version 1.41.0 additively exposes POST
    /api/v1/collections/{collectionId}/versions/{versionId}/restore while
    preserving every accepted 1.40.0 Product client contract.
    info.version 1.42.0 additively exposes GET
    /api/v1/collections/{collectionId}/nodes/{nodeId}/readable while
    preserving every accepted 1.41.0 Product client contract.
    info.version 1.43.0 additively exposes POST
    /api/v1/collections/{collectionId}/nodes/{nodeId}/readable while
    preserving every accepted 1.42.0 Product client contract.
    info.version 1.44.0 additively adds optional avatarUrl on
    CollectionMembersPage.members[] while preserving every
    accepted 1.43.0 Product client contract.
    info.version 1.45.0 additively exposes authenticated collection follow
    PUT/DELETE/GET at /api/v1/collections/{collectionId}/follow while
    preserving every accepted 1.44.0 Product client contract.
    info.version 1.46.0 additively exposes the authenticated followed
    Collection list at GET /api/v1/me/followed-collections while
    preserving every accepted 1.45.0 Product client contract.
    info.version 1.48.0 additively exposes the private sidebar Library
    order at GET /api/v1/me/library-order and PUT
    /api/v1/me/library-order/{section} while preserving every accepted
    1.47.0 Product client contract.
    info.version 1.49.0 additively exposes the private News Digest report
    series and edition Product API while preserving every accepted 1.48.0
    Product client contract. 1.50.0 adds anonymous public report projections,
    1.51.0 adds report Follow and timeline reads, 1.52.0 adds declaration-only
    report schedules, 1.53.0 adds paged public issue reads, and 1.54.0
    replaces the followed-issue timeline with an anonymous-safe closed view.
    1.55.0 corrects the schedule response to a standalone closed object so
    response-only fields are not rejected by the request schema's
    additionalProperties constraint. 1.56.0 additively exposes the public
    source Collection slug on public report issues so readers can navigate to
    the live entries. 1.57.0 additively exposes the private Sync Center trash
    list, item, and restore commands. 1.58.0 additively exposes private Sync
    Center bulk restore, subtree restore, and empty-trash commands with
    per-item results while preserving every accepted 1.57.0 Product client
    contract. 1.59.0 additively exposes optional LinkHealthItem errorClass
    and private duplicate_of review fields (duplicateRelationId,
    duplicateRelationEtag) while preserving every accepted 1.58.0 Product
    client contract. 1.60.0 additively adds optional tldr and note on
    PublicCollectionNode (public curation marks on any node kind), preserving
    every accepted 1.59.0 Product client contract. 1.61.0 additively adds
    optional curatorNote on ExploreCollectionItem and
    PublicCollectionSummary (latest public collection tldr, the curator
    recommendation), preserving every accepted 1.60.0 Product client
    contract. 1.62.0 additively adds optional curator (ProfileSummaryDto),
    followerCount, and sourceCollectionSlug on PublicReportSeries plus
    optional issueKey, editionOrdinal, periodStart, and periodEnd on
    PublicReportIssue, preserving every accepted 1.61.0 Product client
    contract. All report responses use
    closed DTOs and the existing Product error/header contract.
    info.version 1.63.0 additively exposes authenticated account credential
    parent/child issuance, listing, rotation, and revocation while preserving
    every accepted 1.62.0 Product client contract.
    info.version 1.64.0 additively exposes child-key token exchange and private
    credential identity while preserving every accepted 1.63.0 Product client
    contract.
    info.version 1.65.0 additively adds optional faviconCdnAllowed on
    PublicCollectionNode so a node whose owner explicitly set the icon source
    to none never falls back to the third-party favicon CDN, while preserving
    every accepted 1.64.0 Product client contract.
    info.version 1.66.0 additively exposes the content-governance surfaces:
    collection/report catalog metadata and catalog preferences, optional
    language on Explore GET/HEAD and public reports, optional tags/language
    on public discovery DTOs, and the report/moderation operations including
    GovernanceOfficialCase with required actionIds (the case DTO debuts here,
    so the required field needs no separate version), while preserving every
    accepted 1.65.0 Product client contract.
    info.version 1.67.0 turns hide_public digest moderation rows into inert
    tombstones instead of silent omissions (#21): PublicReportIssue gains a
    tombstone state, ReportIssueTimelineItem.state gains 'hidden', and
    ReportSeries/ReportTimelineSeries gain optional hiddenPublic, while
    preserving every accepted 1.66.0 Product client contract.
    info.version 1.68.0 turns an Explore Collections row under an active
    hide_public into an inert tombstone instead of omitting it (#21):
    publicationSlug becomes nullable and optional hiddenPublic marks the row,
    while delist keeps excluding the collection outright. 1.67.0 tombstones
    the followed digest surfaces the same way.
    info.version 1.69.0 turns a follower Feed row for a collection_change
    under an active hide_public into an inert tombstone instead of omitting
    it (#21): FeedItemDto gains optional hiddenPublic, the placeholder title
    replaces the collection title, and publicationSlug stays null, while
    preserving every accepted 1.68.0 Product client contract.
servers:
  - url: /
tags:
  - name: BrowserAuth
    description: >-
      Browser navigation endpoints for the legacy OIDC authorization flow
      (deprecated: the Better Auth migration removes the flow from the
      runtime composition when BETTER_AUTH_ENABLED=true; retained here as the
      deprecated legacy contract for the rollback window).
  - name: Session
    description: Browser Session bootstrap and revocation.
  - name: Account
    description: Current authenticated Account and Profile views.
  - name: AccountCredentials
    description: >-
      Official bot credentials. Parent keys are provisioned through the database
      only. Child and grant management require a raw parent bearer. Browser
      sessions cannot access these endpoints. Secrets are shown once.
  - name: Profiles
    description: Public Profile projections and their published Collections.
  - name: Collections
    description: Phase 1 Collection creation, metadata, and Editor queries.
  - name: Nodes
    description: Phase 1 Folder and Bookmark commands.
  - name: Annotations
    description: Authenticated Product Annotation reads and canonical commands.
  - name: Relations
    description: Authenticated Product Relation reads and canonical commands.
  - name: SavedResources
    description: Private account-owned saved Collection and Node state.
  - name: ReadingProgress
    description: Private account-owned reading state for Collections and Nodes.
  - name: Search
    description: Bounded PostgreSQL Search with fresh authority projection.
  - name: Explore
    description: >-
      Anonymous public Collection directory at GET /api/v1/explore/collections.
      Curators are completed from identity facts (accounts/profiles/handles);
      missing profiles serialize as Unknown. Cursors are product-opaque
      base64url and independent of COLP directory cursors.
  - name: SyncCenter
    description: Private server-authoritative Replica and Conflict management.
  - name: WriteApproval
    description: Private current-account MCP Write Plan and Approval decisions.
  - name: Attachments
    description: >-
      Owner-private Attachment product surface (Phase 4A). Physical keys and
      provider URLs appear only inside the one-time opaque grant of the issue
      response; no Attachment DTO, receipt, operation, or error body ever
      carries a key, credential, digest, or download capability. The surface
      declares no public, shared, or inline Attachment capability.
  - name: PublishingInsights
    description: >-
      Anonymous same-origin ingest of public-collection engagement events.
      Owner self-view is accepted as 204 without writing a row. Visitor identity
      is HMAC-only; the ingest response body is empty. Authenticated owners read
      a 30-day dashboard at GET /api/v1/me/publishing-insights.
  - name: Collaboration
    description: >-
      Authenticated collection membership and email invites. Collection IDs are
      stable opaque Collection IDs, not publication slugs. Member management is
      owner-only; invitees list, accept, and decline their own pending invites.
      Members page Collections shared with them at GET /api/v1/me/shared-collections.
  - name: CollectionFollow
    description: >-
      Authenticated follow and unfollow of a live public or unlisted Collection,
      plus the private authoritative follow state. Collection IDs are OpaqueIds,
      not publication slugs. The relation does not grant read or write access.
  - name: LinkHealth
    description: >-
      Authenticated bookmark link-health list at GET /api/v1/me/link-health
      (owned, shared editor/viewer membership, or all) and enqueue at
      POST /api/v1/me/link-health/checks. Covers live, kind=bookmark nodes with
      a non-empty URL. Status is pending, healthy, redirect, or broken.
      Duplicate is a computed field, not a CHECK value. Shared-editor POST may
      enqueue by collectionId; viewers cannot.
  - name: ClassifyInbox
    description: >-
      Authenticated owner-private classify inbox at GET /api/v1/me/classify-inbox,
      POST /api/v1/me/classify-inbox/{nodeId}/skip, and
      POST /api/v1/me/classify-inbox/{nodeId}/accept. Inbox items are owned
      live bookmarks whose parent is the collection root, with a non-empty URL
      and no skip/accept sidecar row. Skip writes a skipped sidecar row and
      does not move the node. Suggestions are deterministic title/host token
      overlap against live folders in the same collection (Jaccard), not a
      semantic or AI model.
  - name: Export
    description: >-
      Authenticated owner-library export jobs at /api/v1/me/export-jobs.
      First-period format is JSON of owned live collections and their live
      root/folder/bookmark nodes. Download is a Session GET 200 JSON body
      with no downloadUrl, no 302, and no object keys in Product JSON.
  - name: OrganizePlans
    description: >-
      Owner-only collection organize plans. POST creates a frozen plan from
      inbox-titled folders under the collection root. GET returns the stored
      plan. Flag-off, expired, applied, foreign, and unknown ids share 404
      resource_not_found. Apply is POST .../organize-plans/{planId}/apply
      (1.39.0): one transaction of in-process createCollectionNode /
      moveCollectionNode.
  - name: CollectionVersions
    description: >-
      Owner-only live collection tree snapshots. POST freezes the current
      live folder+bookmark tree. GET lists metadata and change counts versus
      the current live tree. GET by id includes a bounded change summary.
      Flag-off, foreign, and unknown ids share 404 resource_not_found.
      Restore is POST .../versions/{versionId}/restore (1.41.0): one
      transaction of in-process updateCollectionNode / moveCollectionNode /
      deleteCollectionNode. If-Match is the collection contentEtag.
  - name: ReadableReplicas
    description: >-
      Session-required bookmark readable-replica views. GET returns the sidecar
      status for a live bookmark the caller owns or is a live member of.
      Flag-off, non-member, unknown node, and non-bookmark ids share 404
      resource_not_found. Absence of a sidecar row is 200 status none.
  - name: Reports
    description: >-
      News Digest/periodic publication reports. Private operations require a
      Session, Origin, CSRF token, command receipt, and the documented
      revision fence. Public operations return anonymous-safe projections only;
      private source, member, schedule, and internal revision fields never
      cross the public boundary.
  - name: Community
    description: >-
      Community interaction on live, strictly public targets (Collection,
      Bookmark, digest series, digest edition). Target resolution is
      anonymous-safe and returns the server-minted generation the client must
      echo back; vote reconciliation requires a Session, Origin, CSRF token,
      and a durable Known-Command-Id receipt. Concealed, non-public,
      withdrawn, or deleted targets share the same 404 resource_not_found.

paths:
  /api/v1/collections/{collectionId}/nodes/{nodeId}/classification-confirmations:
    parameters:
    - $ref: '#/components/parameters/CollectionId'
    - $ref: '#/components/parameters/NodeId'
    post:
      tags:
      - Collections
      operationId: confirmCollectionBookmarkClassification
      summary: Atomically confirm a bookmark folder and existing tags
      description: Owner-only C-07. Session/Origin/CSRF, Known-Command-Id and a strong
        Node If-Match are required. The 16 KiB closed body requests a non-root live
        folder and/or at most three unique current vocabulary tags. Null folderId preserves
        the parent. Under replica then collection locks, re-read live bookmark, destination
        and vocabulary and validate the final 64-tag union before writing. Move and
        tag update share a canonical transaction and outer receipt; neither can commit
        alone. No-op returns the current ETag with no operations. Exact command replay
        precedes mutable Node ETag checks; a stale new command returns 412 and requires
        renewed user confirmation. No provider call or inbox sidecar/hostname evidence
        is created.
      security:
      - cookieAuth: []
      - productBearer: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/CommandId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationConfirmationRequest'
      responses:
        '200':
          description: Confirmed Node state; no-op has an empty operationIds array.
            Exact retry returns original bytes and ETag.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FaviconOrderingError409'
        '410':
          $ref: '#/components/responses/FaviconOrderingError410'
        '413':
          $ref: '#/components/responses/FaviconOrderingError413'
        '415':
          $ref: '#/components/responses/FaviconOrderingError415'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '429':
          $ref: '#/components/responses/FaviconOrderingError429'
        '500':
          $ref: '#/components/responses/FaviconOrderingError500'
        '503':
          $ref: '#/components/responses/FaviconOrderingError503'
        '412':
          $ref: '#/components/responses/FaviconOrderingError412'
        '428':
          $ref: '#/components/responses/FaviconOrderingError428'
  /api/v1/collections/{collectionId}/classification/preview:
    parameters:
    - $ref: '#/components/parameters/CollectionId'
    post:
      tags:
      - Collections
      operationId: previewCollectionBookmarkClassification
      summary: Preview bookmark folders and existing tags without modifying Nodes
      description: Owner-only C-02. Requires session, Origin, CSRF and Known-Command-Id.
        Closed incoming/bookmark or existing/nodeId input; no client taxonomy. Body
        limit 128 KiB. Authentication precedes feature-off 404. A 20 second application
        deadline includes admission and persistence. Provider calls run outside transactions.
        Exact retries replay stable receipts; changed payload returns command_id_reused.
        Pending executions return command_in_progress. Unknown provider outcomes terminate
        with a stable 503 and are never automatically sent again. Only an explicit new
        command creates another paid intent. Disabled tags return mode off with no candidates.
        No If-Match is required.
      security:
      - cookieAuth: []
      - productBearer: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationPreviewRequest'
      responses:
        '200':
          description: Read-only classification decision, or exact original command
            receipt.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FaviconOrderingError409'
        '410':
          $ref: '#/components/responses/FaviconOrderingError410'
        '413':
          $ref: '#/components/responses/FaviconOrderingError413'
        '415':
          $ref: '#/components/responses/FaviconOrderingError415'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '429':
          $ref: '#/components/responses/FaviconOrderingError429'
        '500':
          $ref: '#/components/responses/FaviconOrderingError500'
        '503':
          $ref: '#/components/responses/FaviconOrderingError503'
  /api/v1/collections/{collectionId}/classification-runs:
    parameters:
    - $ref: '#/components/parameters/CollectionId'
    post:
      tags:
      - Collections
      operationId: createCollectionClassificationRun
      summary: Queue bookmark classification without waiting for the provider
      description: Owner-private C-03. Runs persist a revision snapshot, a durable job and up to 50 ordered
        actions. Execution deadline is 240 seconds including queue time; payload TTL is 30 minutes. Feature-off
        returns authenticated 404. Exact create retries replay the original queued response; poll GET for
        current progress. Cancel fences later dispatch and publication without undoing committed bookmarks.
      security:
      - cookieAuth: []
      - productBearer: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationRunCreateRequest'
      responses:
        '201':
          description: Original queued receipt
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: Resource URL for polling the created run.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FaviconOrderingError409'
        '410':
          $ref: '#/components/responses/FaviconOrderingError410'
        '413':
          $ref: '#/components/responses/FaviconOrderingError413'
        '415':
          $ref: '#/components/responses/FaviconOrderingError415'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '429':
          $ref: '#/components/responses/FaviconOrderingError429'
        '500':
          $ref: '#/components/responses/FaviconOrderingError500'
        '503':
          $ref: '#/components/responses/FaviconOrderingError503'
  /api/v1/collections/{collectionId}/classification-runs/{runId}:
    parameters:
    - $ref: '#/components/parameters/CollectionId'
    - name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    get:
      tags:
      - Collections
      operationId: getCollectionClassificationRun
      summary: Read classification progress
      description: Owner-private C-03. Runs persist a revision snapshot, a durable job and up to 50 ordered
        actions. Execution deadline is 240 seconds including queue time; payload TTL is 30 minutes. Feature-off
