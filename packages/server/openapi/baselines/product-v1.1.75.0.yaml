      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    AnnotationId:
      name: annotationId
      in: path
      required: true
      description: Case-sensitive opaque Annotation ID.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    AnnotationResourceType:
      name: resourceType
      in: query
      required: true
      description: Subject resource kind; path Collection remains the authority domain.
      schema: { type: string, enum: [collection, node] }
    AnnotationResourceId:
      name: resourceId
      in: query
      required: true
      description: Existing live Collection or Node subject ID.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    AnnotationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AnnotationCursor:
      name: cursor
      in: query
      required: false
      description: Signed Annotation-only continuation; omit limit when present.
      schema: { $ref: '#/components/schemas/AnnotationCursorValue' }
    RelationId:
      name: relationId
      in: path
      required: true
      description: Case-sensitive opaque Relation ID.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    RelationNodeId:
      name: nodeId
      in: query
      required: true
      description: Live Node whose incident Relations are listed.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    RelationDirection:
      name: direction
      in: query
      required: true
      schema: { $ref: '#/components/schemas/RelationDirection' }
    RelationTypeFilter:
      name: type
      in: query
      required: false
      description: Comma-separated Relation types; duplicates are invalid.
      schema: { type: string, minLength: 1, maxLength: 512 }
    RelationVisibilityFilter:
      name: visibility
      in: query
      required: false
      description: Comma-separated visibility values; duplicates are invalid.
      schema: { type: string, minLength: 1, maxLength: 128 }
    RelationLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RelationCursor:
      name: cursor
      in: query
      required: false
      description: Relation-only continuation bound to node, direction, filters and principal.
      schema: { $ref: '#/components/schemas/RelationCursorValue' }
    SavedResourceTypePath:
      name: resourceType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SavedResourceType' }
    SavedResourceIdPath:
      name: resourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    SavedResourceTypeFilter:
      name: resourceType
      in: query
      required: false
      schema: { $ref: '#/components/schemas/SavedResourceType' }
    SavedResourceCollectionFilter:
      name: collectionId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OpaqueId' }
    SavedResourceCreatedAfter:
      name: createdAfter
      in: query
      required: false
      schema: { type: string, format: date-time }
    SavedResourceCreatedBefore:
      name: createdBefore
      in: query
      required: false
      schema: { type: string, format: date-time }
    SavedResourceLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SavedResourceCursor:
      name: cursor
      in: query
      required: false
      description: Account-, filter-, page-size-, comparator-, key-version-, expiry-, and purpose-bound continuation.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    ReadingProgressTypePath:
      name: resourceType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ReadingProgressResourceType' }
    ReadingProgressIdPath:
      name: resourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ReadingProgressStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ReadingProgressStatus' }
    ReadingProgressLimit:
      name: limit
      in: query
      required: false
      description: First-page size; omit when cursor is present.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ReadingProgressCursor:
      name: cursor
      in: query
      required: false
      description: Reading-Progress-only continuation bound to account, status filter, page size, comparator, key version and expiry.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    ReadingProgressIfMatch:
      name: If-Match
      in: header
      required: false
      description: Required for an update. Omission requests create-only behavior. Weak tags, lists, and * are rejected.
      schema: { $ref: '#/components/schemas/EntityTag' }
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact allowed Product Web origin. Duplicate or null values fail.
      schema:
        type: string
        format: uri
        maxLength: 2048
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by getSession.
      schema:
        $ref: '#/components/schemas/CsrfToken'
    InsightIngestCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        Required when a Session cookie is present. Anonymous insight ingest
        must omit this header.
      schema:
        $ref: '#/components/schemas/CsrfToken'
    CommandId:
      name: Known-Command-Id
      in: header
      required: true
      description: >-
        Stable ID for one user intent. Reuse only for an exact retry of that
        intent. Full replay results are retained for at least 30 days.
      schema:
        $ref: '#/components/schemas/CommandId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One strong resource ETag. Weak tags, lists, and * are rejected.
      schema:
        $ref: '#/components/schemas/EntityTag'
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    EditionId:
      name: editionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    KnownCommandId:
      name: Known-Command-Id
      in: header
      required: true
      schema: { $ref: '#/components/schemas/CommandId' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Cursor' }
    IfContentMatch:
      name: If-Content-Match
      in: header
      required: false
      description: >-
        Required exactly when recursive=true. Copy CollectionView.contentEtag
        without modification. Rejected for non-recursive requests.
      schema:
        $ref: '#/components/schemas/ContentEntityTag'
    EditorLimit:
      name: limit
      in: query
      required: false
      description: First-page item limit. Must be omitted when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    EditorCursor:
      name: cursor
      in: query
      required: false
      description: Signed Product Editor cursor. Do not log or parse.
      schema:
        $ref: '#/components/schemas/Cursor'
    Recursive:
      name: recursive
      in: query
      required: false
      description: Explicitly delete a Folder subtree.
      schema:
        type: boolean
        default: false
    ReturnTo:
      name: returnTo
      in: query
      required: false
      description: >-
        Same-origin relative path, at most 2048 code points. It must start with
        one slash and cannot contain authority, backslash, control characters,
        scheme, or userinfo.
      schema:
        type: string
        maxLength: 2048
    OidcCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OidcState:
      name: state
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    OidcError:
      name: error
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    OidcIssuer:
      name: iss
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
    OidcSessionState:
      name: session_state
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorDescription:
      name: error_description
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    OidcErrorUri:
      name: error_uri
      in: query
      required: false
      schema:
        type: string
        format: uri
        maxLength: 2048
    AttachmentBlobIdPath:
      name: blobId
      in: path
      required: true
      description: >-
        Opaque logical Attachment/blob identity. Never a physical key,
        generation id, or provider URL.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CommunityTargetKind:
      name: kind
      in: query
      required: true
      description: Community target kind discriminator.
      schema:
        type: string
        enum: [collection, bookmark, digest_series, digest_edition]
    CommunityTargetId:
      name: id
      in: query
      required: true
      description: Opaque target id (Collection, node, digest series, or digest edition id).
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CommunityCollectionId:
      name: collectionId
      in: query
      required: false
      description: Required only for kind=bookmark; forbidden for every other kind.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CommunitySeriesId:
      name: seriesId
      in: query
      required: false
      description: Required only for kind=digest_edition; forbidden for every other kind.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CommunityRankingKind:
      name: kind
      in: query
      required: false
      description: Restrict the ranking to one community target kind.
      schema:
        type: string
        enum: [collection, bookmark, digest_series, digest_edition]
    CommunityRankingCollectionId:
      name: collectionId
      in: query
      required: false
      description: Restrict bookmark ranking to one collection; only allowed when kind=bookmark.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CommunityRankingQ:
      name: q
      in: query
      required: false
      description: Literal title search (trim + NFC + locale-independent lowercase).
      schema: { type: string, minLength: 1, maxLength: 256 }
    CommunityRankingTag:
      name: tag
      in: query
      required: false
      description: Exact normalized tag match on the target catalog tags.
      schema: { type: string, minLength: 1, maxLength: 64 }
    CommunityRankingLanguage:
      name: language
      in: query
      required: false
      description: Canonical BCP47 language filter (Intl.getCanonicalLocales normalization).
      schema: { type: string, minLength: 1, maxLength: 35 }
    CommunityRankingLimit:
      name: limit
      in: query
      required: false
      description: Page size bound; the 65536-byte page budget still applies.
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    CommunityRankingCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor from the previous page's nextCursor.
      schema: { $ref: '#/components/schemas/CommunityCursor' }
    CommunityGeneration:
      name: generation
      in: query
      required: true
      description: >-
        The target generation returned by resolveCommunityTarget:
        "static-v1" for collection and digest targets; the opaque
        server-minted generation for a bookmark target.
      schema: { type: string, minLength: 1, maxLength: 128 }
    CommunityCommentIdPath:
      name: commentId
      in: path
      required: true
      description: Opaque server-minted community comment id.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CommunityCommentLimit:
      name: limit
      in: query
      required: false
      description: Page size bound; the 65536-byte page budget still applies.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CommunityCommentCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor from the previous page's nextCursor.
      schema: { $ref: '#/components/schemas/CommunityCursor' }
    CommunityNotificationRead:
      name: read
      in: query
      required: false
      description: Inbox read-state filter; all is the default.
      schema: { type: string, enum: [all, unread], default: all }
    CommunityNotificationLimit:
      name: limit
      in: query
      required: false
      description: Inbox page size bound (1..100, default 20).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CommunityNotificationCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor from the previous page's nextCursor.
      schema: { $ref: '#/components/schemas/CommunityCursor' }

  headers:
    XRequestId:
      description: Per-attempt diagnostic request ID.
      schema:
        $ref: '#/components/schemas/RequestId'
    PrivateNoStore:
      description: Private Product response cache policy.
      schema:
        type: string
        const: private, no-store
    PublicRevalidate:
      description: Anonymous public report projection cache policy.
      schema:
        type: string
        const: public, max-age=30, must-revalidate
    PublicOrPrivateCache:
      description: Public shared cache for anonymous reads; private no-store for Session reads.
      schema:
        type: string
    PublicProfileCache:
      description: Shared cache policy for the principal-invariant public Profile representation.
      schema:
        type: string
        const: public, max-age=60, stale-while-revalidate=300
    PublicImmutableImageCache:
      description: Immutable public cache for favicon object bytes.
      schema:
        type: string
        const: public, max-age=31536000, immutable
    PublicShortCache:
      description: Short public cache for favicon object misses.
      schema:
        type: string
        const: public, max-age=60
    SearchVary:
      description: >-
        Search representation varies by media type and authenticated projection inputs. The value always
        includes Accept, Cookie, and Authorization and may also include Origin when CORS applies.
      schema:
        type: string
        minLength: 29
    ContentLength:
      description: Decimal byte length of the selected representation, including on HEAD.
      schema:
        type: string
        pattern: '^(?:0|[1-9][0-9]*)$'
    VaryAccept:
      description: Representation negotiation cache key.
      schema:
        type: string
        const: Accept
    XContentTypeOptions:
      description: Prevent MIME sniffing of the JSON representation.
      schema:
        type: string
        const: nosniff
    NoStore:
      description: Browser navigation response cache policy.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag for the primary returned resource.
      schema:
        $ref: '#/components/schemas/EntityTag'
    Location:
      description: >-
        Stable Product resource or navigation URI. A created resource Location
        is not guaranteed to support GET in Phase 1.
      schema:
        type: string
        format: uri-reference
        maxLength: 4096
    RetryAfter:
      description: Retry delay in decimal seconds.
      schema:
        type: integer
        minimum: 0
    RateLimitPolicy:
      description: >-
        Fixed route-class rate-limit policy of the Attachment admission
        limiter, formatted attachments-<route-class>:<max>:<window-ms>.
        Emitted only on Attachment 429 responses; never on the 503
        rate_limit_unavailable closed state, which is not a quota fact.
      schema:
        type: string
        pattern: '^attachments-[a-z-]+:[0-9]+:[0-9]+$'
    SetCookie:
      description: Session or one-time OIDC transaction cookie.
      schema:
        type: string
        minLength: 1

  schemas:
    ClassificationRequested:
      type: object
      additionalProperties: false
      required:
      - folder
      - tags
      properties:
        folder: &id001
          type: boolean
        tags: *id001
      anyOf:
      - properties:
          folder:
            const: true
      - properties:
          tags:
            const: true
    ClassificationRunCreateRequest:
      type: object
      additionalProperties: false
      required:
      - requested
      - maxItems
      properties:
        sourceFolderIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: At most 128 UTF-8 bytes; canonical Node identity.
        nodeIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: At most 128 UTF-8 bytes; canonical Node identity.
        requested:
          $ref: '#/components/schemas/ClassificationRequested'
        maxItems:
          type: integer
          minimum: 1
          maximum: 50
      anyOf:
      - required:
        - sourceFolderIds
        properties:
          sourceFolderIds:
            minItems: 1
      - required:
        - nodeIds
        properties:
          nodeIds:
            minItems: 1
    ClassificationRunCancelRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    ClassificationRunAction:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - actionId
        - nodeId
        - nodeEtag
        - sourceParentId
        - status
        - decision
        - failureCode
        properties:
          actionId:
            $ref: '#/components/schemas/OpaqueId'
          nodeId:
            type: string
            minLength: 1
            maxLength: 128
            description: At most 128 UTF-8 bytes; canonical Node identity.
          nodeEtag:
            type: string
          sourceParentId:
            type: string
            minLength: 1
            maxLength: 128
            description: At most 128 UTF-8 bytes; canonical Node identity.
          status:
            type: string
            enum:
            - pending
            - running
          decision:
            type: 'null'
          failureCode:
            type: 'null'
      - type: object
        additionalProperties: false
        required:
        - actionId
        - nodeId
        - nodeEtag
        - sourceParentId
        - status
        - decision
        - failureCode
        properties:
          actionId:
            $ref: '#/components/schemas/OpaqueId'
          nodeId:
            type: string
            minLength: 1
            maxLength: 128
