      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentIssueRequest' }
      responses:
        '201': { $ref: '#/components/responses/AttachmentIssueResponse' }
        '400': { $ref: '#/components/responses/AttachmentBadRequest' }
        '401': { $ref: '#/components/responses/AttachmentAuthenticationRequired' }
        '403': { $ref: '#/components/responses/AttachmentForbidden' }
        '404': { $ref: '#/components/responses/AttachmentNotFound' }
        '409': { $ref: '#/components/responses/AttachmentStateConflict' }
        '413': { $ref: '#/components/responses/AttachmentPayloadTooLarge' }
        '415': { $ref: '#/components/responses/AttachmentUnsupportedMediaType' }
        '422': { $ref: '#/components/responses/AttachmentInvalidDocument' }
        '429': { $ref: '#/components/responses/AttachmentRateLimited' }
        '500': { $ref: '#/components/responses/AttachmentInternalError' }
        '503': { $ref: '#/components/responses/AttachmentServiceUnavailable' }

  /api/v1/attachments/complete:
    post:
      tags: [Attachments]
      operationId: completeAttachmentUpload
      summary: Complete one issued single-PUT upload exactly once
      description: >-
        Binds the original {intentId, generationId, blobId}; the client never
        submits a physical key and cannot change key, owner, Collection,
        declared digest, or generation. The server re-reads the committed
        ledger, attests the exact object, and converges idempotently
        (completed / idempotent / already_verified). Missing, foreign, or
        wrong-principal bindings are concealed as resource_not_found; observed
        facts that contradict the declaration are attachment_state_conflict.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentCompleteRequest' }
      responses:
        '200': { $ref: '#/components/responses/AttachmentCompleteResponse' }
        '400': { $ref: '#/components/responses/AttachmentBadRequest' }
        '401': { $ref: '#/components/responses/AttachmentAuthenticationRequired' }
        '403': { $ref: '#/components/responses/AttachmentForbidden' }
        '404': { $ref: '#/components/responses/AttachmentNotFound' }
        '409': { $ref: '#/components/responses/AttachmentStateConflict' }
        '413': { $ref: '#/components/responses/AttachmentPayloadTooLarge' }
        '415': { $ref: '#/components/responses/AttachmentUnsupportedMediaType' }
        '422': { $ref: '#/components/responses/AttachmentInvalidDocument' }
        '429': { $ref: '#/components/responses/AttachmentRateLimited' }
        '500': { $ref: '#/components/responses/AttachmentInternalError' }
        '503': { $ref: '#/components/responses/AttachmentServiceUnavailable' }

