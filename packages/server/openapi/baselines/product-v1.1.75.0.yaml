  /api/v1/community/target:
    get:
      tags: [Community]
      operationId: resolveCommunityTarget
      summary: Resolve a live public community target and its vote state
      description: >-
        Anonymous-safe resolution of one community target. kind and id are
        required; bookmark also requires collectionId, digest_edition also
        requires seriesId, and every other combination forbids the parent
        ids. The live authorized source determines the id and current
        generation: collection and digest targets return generation
        "static-v1"; a bookmark target returns the opaque server-minted
        generation that changes on every semantic source-URL mutation. In the
        Target object collectionId/seriesId are explicit null unless the kind
        requires them. Only strictly public, live targets resolve: unlisted,
        protected, private, withdrawn, deleted, or hidden nodes share the same
        404 resource_not_found. An authenticated viewer's own vote appears as
        myVote (0 when none); anonymous viewers receive myVote null. The
        response carries one strong opaque ETag; there is no 304 behavior.
      security:
        - cookieAuth: []
        - productBearer: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CommunityTargetKind'
        - $ref: '#/components/parameters/CommunityTargetId'
        - $ref: '#/components/parameters/CommunityCollectionId'
        - $ref: '#/components/parameters/CommunitySeriesId'
      responses:
        '200':
          description: The resolved target, viewer capability hints, and current vote state.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityTargetView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/community/vote:
    put:
      tags: [Community]
      operationId: setCommunityVote
      summary: Reconcile the caller's vote on a community target exactly once
      description: >-
        Session + Origin + CSRF + Known-Command-Id. The body is the closed
        object {target, value}; value is -1, 0, or 1 and 0 removes the vote.
        The supplied target must equal the currently resolved Target shape
        including parents and generation: a mismatch is 409
        revision_conflict (resolve again and confirm intent on the new
        content). A vote on the caller's own target is 403
        insufficient_permission. Reconciliation is atomic against the current
        account vote; the same desired value under a fresh command id is a
        durable no-op. Exact Known-Command-Id retries replay the saved
        outcome for at least 30 days; a changed request with a reused id is
        409 command_id_reused. Votes never move canonical content revisions.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityVoteRequest' }
      responses:
        '200':
          description: The vote state after reconciliation, including an exact replay.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityVoteState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/community/ranking:
    get:
      tags: [Community]
      operationId: listCommunityRanking
      summary: List the durable hot-v1 community ranking
      description: >-
        Anonymous-safe ranking of live community targets by the frozen
        hot-v1 score: signed Wilson-confidence vote mass with a 168-hour
        half-life decayed from the first accepted vote. Pages are served
        from the durable ranking snapshot the refresh worker rebuilds from
        retained vote authority — the response is eventually consistent,
        never a per-request rescore. There is no sort parameter and no
        view-count popular alias. Optional filters are kind (collection,
        bookmark, digest_series, digest_edition), collectionId (only
        allowed when kind=bookmark), q (literal title search after NFC +
        lowercase), tag (exact normalized tag), language (canonical
        BCP47), and limit (1..100, default 24). Filtering precedes page
        selection and current visibility is rechecked on every page, so a
        target that turns private or is concealed mid-pagination simply
        never appears. Each page is bounded by both the item limit and
        the 65536-byte page budget; nextCursor is an opaque HMAC-bound
        v1 cursor (900s TTL) that binds the endpoint, viewer, filters,
        limit and snapshot. A tampered or mismatched cursor is 400
        invalid_cursor; a validly signed cursor whose snapshot expired
        is 409 snapshot_expired with restart_from_first_page. A zero-vote
        target has hot=0 and firstVoteAt=null.
      security:
        - cookieAuth: []
        - productBearer: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CommunityRankingKind'
        - $ref: '#/components/parameters/CommunityRankingCollectionId'
        - $ref: '#/components/parameters/CommunityRankingQ'
        - $ref: '#/components/parameters/CommunityRankingTag'
        - $ref: '#/components/parameters/CommunityRankingLanguage'
        - $ref: '#/components/parameters/CommunityRankingLimit'
        - $ref: '#/components/parameters/CommunityRankingCursor'
      responses:
        '200':
          description: One page of the durable hot-v1 ranking snapshot.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityRankingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/community/comments:
    get:
      tags: [Community]
      operationId: listCommunityComments
      summary: List root comments on a live community target
      description: >-
        Anonymous-safe listing of root comments (depth 0) on one community
        target, ordered createdAt descending then id ascending. kind, id
        and generation are required and must equal the currently resolved
        Target shape: bookmark also requires collectionId, digest_edition
        also requires seriesId, and every other combination forbids the
        parent ids. The current target is resolved before any cursor
        result; comments pinned to a superseded bookmark generation are
        concealed with the content they described. Deleted and hidden
        comments remain in the page as tombstones (body null). Pages are
        bounded by both the item limit (1..100, default 20) and the
        65536-byte page budget without truncating a comment or skipping an
        eligible item. nextCursor is an opaque HMAC-bound v1 cursor (900s
        TTL) that binds the endpoint, viewer, target identity and
        generation, and limit; a tampered or mismatched cursor is 400
        invalid_cursor.
      security:
        - cookieAuth: []
        - productBearer: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CommunityTargetKind'
        - $ref: '#/components/parameters/CommunityTargetId'
        - $ref: '#/components/parameters/CommunityCollectionId'
        - $ref: '#/components/parameters/CommunitySeriesId'
        - $ref: '#/components/parameters/CommunityGeneration'
        - $ref: '#/components/parameters/CommunityCommentLimit'
        - $ref: '#/components/parameters/CommunityCommentCursor'
      responses:
        '200':
          description: One page of root comments on the resolved target.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityCommentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Community]
      operationId: createCommunityComment
      summary: Create a root comment or reply on a live community target
      description: >-
        Session + Origin + CSRF + Known-Command-Id. The body is the closed
        CreateComment object {target, body, replyToId}: body is trimmed and
        NFC-normalized to 1..4000 Unicode code points (whitespace-only is
        400 invalid_request) and replyToId is explicit null for a root
        comment. The supplied target must equal the currently resolved
        Target shape including parents and generation: a mismatch is 409
        revision_conflict. A reply must reference a visible comment on the
        same target identity and generation; replying to a depth-2 comment
        is 400 invalid_request because depth 2 is the ceiling, and any
        other parent outcome is the concealed 404 resource_not_found. The
        comment id is a durable server-minted opaque id. Exact
        Known-Command-Id retries replay the saved outcome for at least 30
        days; a changed request with a reused id is 409 command_id_reused.
        The 201 response carries one strong opaque ETag.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityCreateComment' }
      responses:
        '201':
          description: The created comment, including an exact replay of a prior create.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/community/comments/{commentId}:
    get:
      tags: [Community]
      operationId: getCommunityComment
      summary: Read one community comment by id
      description: >-
        Anonymous-safe read of a single comment. The comment resolves only
        while its recorded target still resolves as a live public target
        and the pinned generation still matches: concealed targets and
        superseded generations share the same 404 resource_not_found.
        Deleted and hidden comments return as tombstones (body null); a
        deleted comment can never return. The response carries one strong
        opaque ETag; there is no 304 behavior.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CommunityCommentIdPath'
      responses:
        '200':
          description: The comment projection with viewer capability hints.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Community]
      operationId: editCommunityComment
      summary: Edit a community comment body
      description: >-
        Author-only edit of the comment body. Session + Origin + CSRF +
        Known-Command-Id + a required If-Match carrying the comment's own
        strong ETag; a missing header is 428 precondition_required, a
        malformed tag is 400 invalid_request, and a stale tag is 412
        precondition_failed with the current tag attached for
        refresh_and_retry. The body is the closed EditComment object
        {body}: trimmed and NFC-normalized to 1..4000 Unicode code points.
        Only a visible comment authored by the caller is editable; a
        deleted or hidden comment is 400 invalid_request and a non-author
        is 403 insufficient_permission. Concealed targets and superseded
        generations are 404 resource_not_found. Exact Known-Command-Id
        retries replay the saved outcome; a changed request with a reused
        id is 409 command_id_reused. The 200 response carries the updated
        comment and its new strong ETag.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/CommunityCommentIdPath'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityEditComment' }
