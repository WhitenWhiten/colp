  /api/v1/collections/{collectionId}/versions/{versionId}/restore:
    post:
      tags: [CollectionVersions]
      operationId: restoreCollectionVersion
      summary: Restore the collection live tree from a version
      description: >-
        Session + Origin + CSRF + Known-Command-Id + If-Match. If-Match is the
        collection contentEtag (strong entity-tag of contentRevision), not the
        version-row ETag and not CollectionView.etag. Missing If-Match is 428
        precondition_required; mismatch is 412 precondition_failed. A snapshot
        node missing from the live tree is 409 revision_conflict with zero
        writes. Same Known-Command-Id replays the first receipt. Flag-off,
        non-owner, and unknown ids share 404 resource_not_found.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/CollectionVersionId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionVersionRestoreRequest' }
      responses:
        '200':
          description: The collection live tree was restored, or was already equivalent.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionVersionRestoreReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
