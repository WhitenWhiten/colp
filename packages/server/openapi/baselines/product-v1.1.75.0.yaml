  /api/v1/search:
    get:
      tags: [Search]
      operationId: searchResources
      summary: Search authorized Product resources
      description: >-
        Searches Collection, Node, public Profile, and Annotation branches. Anonymous requests receive only
        currently public opted-in resources and may use shared caching. Anonymous 200 responses carry a strong
        ETag for shared-cache validators. A valid Session broadens recall only after current authority is
        rechecked and always receives private, no-store caching; those private responses omit ETag and never
        return 304, including when If-None-Match is * or a prior anonymous validator. Search cursors are
        signed and bound to normalized query, selected types, page size, comparator, and principal projection.
        Conditional requests still execute the current authority projection before returning 304. A 304 omits
        the representation body after a fresh origin search; it does not omit candidate SQL, current-authority
        recheck, ancestor work, admission, or timeout. ETag applies to anonymous shared-cache validators only.
      security: [{}, { cookieAuth: [] }, { productBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
