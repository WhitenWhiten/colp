      operationId: acceptMyClassifyInboxItem
      summary: Accept one owned classify-inbox bookmark into a suggested folder
      description: >-
        Session + Origin + CSRF + Known-Command-Id + If-Match (GET item etag,
        which is the strong entity-tag of resourceRevision). Body suggestionId
        equals the target folderId. Same transaction: claim accept command,
        lock collection, eligibility, resolve suggestion as a same-collection
        live folder, read source/target parent revisions, call application
        moveCollectionNode (afterId/beforeId null = append), then INSERT sidecar
        status accepted with suggestion_id = folderId. Any failure leaves no
        sidecar. Exact retries reuse Known-Command-Id and replay the first
        accept receipt without a second move. Already accepted and still in
        that folder with a new command id returns 200 and does not move again.
        Target folder gone, wrong suggestionId, folder not same collection,
        ineligible, other user, and already skipped share 404 resource_not_found.
        rotateCommandOnConflict is a client option; the server replays the
        stored receipt for the same command id. Optional addTags is a closed
        array of at most three unique current live-bookmark vocabulary tags.
        When supplied, move and tag union use the shared canonical content helper
        in the same transaction as sidecar and the outer receipt. Invalid vocabulary,
        stale Node ETag or any write failure rolls back every change. Final tags
        cannot exceed 64. Old bodies keep their original fingerprint and behavior.
