        recheck, and timeout work as GET, but never sends representation bytes. Anonymous HEAD may return
        304 after that fresh origin execution and includes ETag; authenticated HEAD omits ETag and never
        returns 304. Conditional requests still execute the current authority projection before returning
        304. A 304 does not skip origin candidate SQL, authority recheck, or timeout.
      security: [{}, { cookieAuth: [] }, { productBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchType'
        - $ref: '#/components/parameters/SearchCursor'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchAccept'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
