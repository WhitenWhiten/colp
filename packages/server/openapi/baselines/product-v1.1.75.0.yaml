    LinkHealthStatus:
      type: string
      enum: [pending, healthy, redirect, broken]
    LinkHealthErrorClass:
      type: string
      enum: [invalid_url, timeout, denied, dns, http]
    LinkHealthScope:
      type: string
      enum: [owned, shared, all]
    LinkHealthMembership:
      type: string
      enum: [owner, editor, viewer]
    LinkHealthItem:
      type: object
      additionalProperties: false
      description: >-
        One live bookmark's link-health fact for the current scope.
        duplicateOfNodeId is the earliest same-collection node with the same
        normalized URL within the current scope row set, or null; it is a
        candidate suggestion, not Node identity. Optional errorClass is the
        stored probe class when the worker has observed a failure.
        Optional duplicateRelationId and duplicateRelationEtag identify the
        live private duplicate_of review created by the user, or are omitted.
        Optional membership is owner, editor, or viewer when the server can
        resolve it (owner on owned rows; editor or viewer on shared-membership
        rows). etag is the BookmarkNodeView EntityTag (strongEntityTag of
        resourceRevision), not revision.
      properties:
        nodeId: { $ref: '#/components/schemas/OpaqueId' }
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        collectionTitle: { type: string, minLength: 1, maxLength: 512 }
        title: { type: string, minLength: 1, maxLength: 512 }
        url: { type: string, minLength: 1, maxLength: 4096 }
        status: { $ref: '#/components/schemas/LinkHealthStatus' }
        duplicateOfNodeId:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueId' }
            - { type: 'null' }
        host: { type: string, minLength: 1, maxLength: 253 }
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
        finalUrl: { type: string, minLength: 1, maxLength: 4096 }
        checkedAt: { $ref: '#/components/schemas/UtcDateTime' }
        etag: { $ref: '#/components/schemas/EntityTag' }
        membership: { $ref: '#/components/schemas/LinkHealthMembership' }
        errorClass: { $ref: '#/components/schemas/LinkHealthErrorClass' }
        duplicateRelationId: { $ref: '#/components/schemas/OpaqueId' }
        duplicateRelationEtag: { $ref: '#/components/schemas/EntityTag' }
      required:
        - nodeId
        - collectionId
        - collectionTitle
        - title
        - url
        - status
        - duplicateOfNodeId
    LinkHealthPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/LinkHealthItem' }
        nextCursor:
          oneOf:
            - { $ref: '#/components/schemas/Cursor' }
            - { type: 'null' }
      required: [items, nextCursor]
    ClassifyInboxSuggestionKind:
      type: string
      enum: [existing]
    ClassifyInboxSuggestion:
      type: object
      additionalProperties: false
      description: >-
        Deterministic folder suggestion. suggestionId equals folderId.
        kind is existing only. reason is the exact template
        Title/host overlap with "{folderTitle}".
      properties:
        suggestionId: { $ref: '#/components/schemas/OpaqueId' }
        folderId: { $ref: '#/components/schemas/OpaqueId' }
        folderTitle: { type: string, minLength: 1, maxLength: 512 }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Jaccard overlap of bookmark title plus URL hostname tokens versus
            folder title tokens: NFKC, lowercase, split on non-alphanumeric,
            drop tokens shorter than 2. score = round(100 * |A∩B| / |A∪B|);
            empty union is 0. Sorted descending by score, then folderTitle
            ascending, then folderId ascending. Keep score > 0, at most 3.
            Not a semantic or AI model.
        reason: { type: string, minLength: 1, maxLength: 512 }
        kind: { $ref: '#/components/schemas/ClassifyInboxSuggestionKind' }
      required: [suggestionId, folderId, folderTitle, score, reason, kind]
    ClassifyInboxItem:
      type: object
      additionalProperties: false
      description: >-
        One owned live root-bookmark inbox item. etag is the BookmarkNodeView
        EntityTag (strongEntityTag of resourceRevision), not a revision field.
        host is the URL hostname.
      properties:
        nodeId: { $ref: '#/components/schemas/OpaqueId' }
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        collectionTitle: { type: string, minLength: 1, maxLength: 512 }
        title: { type: string, minLength: 1, maxLength: 512 }
        url: { type: string, minLength: 1, maxLength: 4096 }
        host: { type: string, minLength: 1, maxLength: 253 }
        etag: { $ref: '#/components/schemas/EntityTag' }
        createdAt: { $ref: '#/components/schemas/UtcDateTime' }
        suggestions:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ClassifyInboxSuggestion' }
      required:
        - nodeId
        - collectionId
        - collectionTitle
        - title
        - url
        - host
        - etag
        - createdAt
        - suggestions
    ClassifyInboxPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ClassifyInboxItem' }
        nextCursor:
          oneOf:
            - { $ref: '#/components/schemas/Cursor' }
            - { type: 'null' }
      required: [items, nextCursor]
    ClassifyInboxSkipRequest:
      type: object
      additionalProperties: false
      description: Empty object. Skip accepts no fields.
    ClassifyInboxAcceptRequest:
      type: object
      additionalProperties: false
      description: suggestionId equals the target folderId. Optional addTags adds only current live-bookmark vocabulary tags in the same canonical transaction.
      properties:
        suggestionId: { $ref: '#/components/schemas/OpaqueId' }
        addTags:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Case-sensitive existing tags. Final union must contain at most 64 tags. Omission preserves the legacy request fingerprint.
      required: [suggestionId]
    ClassifyInboxDecisionReceipt:
      type: object
      additionalProperties: false
      description: Command receipt for a skipped classify-inbox bookmark. Skip 200 omits folderId.
      properties:
        nodeId: { $ref: '#/components/schemas/OpaqueId' }
        decision:
          type: string
          enum: [skipped]
      required: [nodeId, decision]
    ClassifyInboxAcceptReceipt:
      type: object
      additionalProperties: false
      description: Command receipt for an accepted classify-inbox bookmark. Accept 200 always includes folderId.
      properties:
        nodeId: { $ref: '#/components/schemas/OpaqueId' }
        decision:
          type: string
          enum: [accepted]
        folderId: { $ref: '#/components/schemas/OpaqueId' }
      required: [nodeId, decision, folderId]
    LinkHealthChecksRequest:
      type: object
      additionalProperties: false
      description: >-
        Optional filters. Omitting collectionId marks every eligible owned
        bookmark pending. With collectionId, owner or shared editor of that
        Collection may enqueue; viewer and foreign ids are skipped.
      properties:
        nodeIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/OpaqueId' }
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
    LinkHealthChecksReceipt:
      type: object
      additionalProperties: false
      description: Command receipt for enqueueing authorized bookmark probes.
      properties:
        queued:
          type: integer
          minimum: 0
          description: Count of authorized live bookmark rows marked pending.
      required: [queued]
    ExportJobStatus:
      type: string
      enum: [pending, running, ready, failed, expired]
    ExportJob:
      type: object
      additionalProperties: false
      description: >-
        Owner-private export job. downloadUrl and object keys are never
        serialized. readyAt, expiresAt, and errorClass are omitted until known.
      properties:
        jobId: { $ref: '#/components/schemas/OpaqueId' }
        status: { $ref: '#/components/schemas/ExportJobStatus' }
        createdAt: { $ref: '#/components/schemas/UtcDateTime' }
        readyAt: { $ref: '#/components/schemas/UtcDateTime' }
        expiresAt: { $ref: '#/components/schemas/UtcDateTime' }
        errorClass: { type: string, minLength: 1, maxLength: 64 }
      required: [jobId, status, createdAt]
    ExportJobPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ExportJob' }
      required: [items]
    ExportLibraryDocument:
      type: object
      additionalProperties: false
      description: >-
        First-period owned live library JSON. Contains no collaborator emails,
        sessions, MCP tokens, attachment bytes, OTP, or policy JSON.
      properties:
        exportedAt: { $ref: '#/components/schemas/UtcDateTime' }
        collections:
          type: array
          items: { $ref: '#/components/schemas/ExportCollection' }
      required: [exportedAt, collections]
    ExportCollection:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        title: { type: string, minLength: 1, maxLength: 512 }
        visibility: { $ref: '#/components/schemas/CollectionVisibility' }
        publicationSlug:
          oneOf:
            - { $ref: '#/components/schemas/PublicationLocatorSlug' }
            - { type: 'null' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ExportNode' }
      required: [id, title, visibility, publicationSlug, nodes]
    ExportNode:
      type: object
      additionalProperties: false
      description: Live root, folder, or bookmark. Soft-deleted nodes are omitted.
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        parentId:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueId' }
            - { type: 'null' }
        kind: { type: string, enum: [folder, bookmark] }
        isRoot: { type: boolean }
        title: { type: [string, 'null'], maxLength: 512 }
        url: { type: [string, 'null'], maxLength: 4096 }
        description: { type: [string, 'null'], maxLength: 2000 }
        tags:
          type: array
          items: { type: string }
        visibility: { $ref: '#/components/schemas/NodeVisibility' }
      required: [id, parentId, kind, isRoot]

    OrganizePlanCreateRequest:
      type: object
      additionalProperties: false
      description: >
        Optional. Empty or omitted sourceFolderIds means all inbox-titled
        folders under root. When present, every id must be an inbox-eligible
        live folder in this collection; otherwise 404 resource_not_found.
      properties:
        sourceFolderIds:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/OpaqueId' }
      required: []
    OrganizePlan:
      type: object
      additionalProperties: false
      properties:
        planId: { $ref: '#/components/schemas/OpaqueId' }
        etag: { $ref: '#/components/schemas/EntityTag' }
        expiresAt: { $ref: '#/components/schemas/UtcDateTime' }
        collectionRevision: { $ref: '#/components/schemas/OpaqueId' }
        plannerId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^heuristic\.v1\.[a-z0-9_]+$'
        truncated: { type: boolean }
        actions:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/OrganizePlanAction' }
      required: [planId, etag, expiresAt, collectionRevision, plannerId, truncated, actions]
    OrganizePlanAction:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        sourceFolderId: { $ref: '#/components/schemas/OpaqueId' }
        sourceFolderTitle: { type: string, minLength: 1, maxLength: 512 }
        target: { $ref: '#/components/schemas/OrganizePlanActionTarget' }
        nodeIds:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/OpaqueId' }
        count: { type: integer, minimum: 1, maximum: 50 }
        reason: { type: string, minLength: 1, maxLength: 512 }
        confidence: { type: integer, minimum: 0, maximum: 100 }
      required: [id, sourceFolderId, sourceFolderTitle, target, nodeIds, count, reason, confidence]
    OrganizePlanActionTarget:
      oneOf:
        - $ref: '#/components/schemas/OrganizePlanExistingTarget'
        - $ref: '#/components/schemas/OrganizePlanCreateFolderTarget'
      discriminator:
        propertyName: type
        mapping:
          existing: '#/components/schemas/OrganizePlanExistingTarget'
          create_folder: '#/components/schemas/OrganizePlanCreateFolderTarget'
    OrganizePlanExistingTarget:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [existing] }
        folderId: { $ref: '#/components/schemas/OpaqueId' }
        title: { type: string, minLength: 1, maxLength: 512 }
      required: [type, folderId, title]
    OrganizePlanCreateFolderTarget:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [create_folder] }
        parentId: { $ref: '#/components/schemas/OpaqueId' }
        title: { type: string, minLength: 1, maxLength: 512 }
      required: [type, parentId, title]
    OrganizePlanApplyRequest:
      type: object
      additionalProperties: false
      required: [actionIds]
      properties:
        actionIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/OpaqueId' }
    OrganizePlanApplyReceipt:
      type: object
      additionalProperties: false
      required: [planId, appliedActionIds, createdFolderIds, movedNodeIds]
      properties:
        planId: { $ref: '#/components/schemas/OpaqueId' }
        appliedActionIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/OpaqueId' }
        createdFolderIds:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/OpaqueId' }
        movedNodeIds:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/OpaqueId' }
    CollectionVersionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
      required: []
    CollectionVersionChangeCounts:
      type: object
      additionalProperties: false
      properties:
        added: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        moved: { type: integer, minimum: 0 }
        renamed: { type: integer, minimum: 0 }
        retargeted: { type: integer, minimum: 0 }
      required: [added, removed, moved, renamed, retargeted]
    CollectionVersionChange:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [added, removed, moved, renamed, retargeted]
        nodeId: { $ref: '#/components/schemas/OpaqueId' }
        title: { type: string, minLength: 1, maxLength: 512 }
      required: [type, nodeId, title]
    CollectionVersion:
      type: object
      additionalProperties: false
      properties:
        versionId: { $ref: '#/components/schemas/OpaqueId' }
        etag: { $ref: '#/components/schemas/EntityTag' }
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        contentRevision: { $ref: '#/components/schemas/OpaqueId' }
        kind:
          type: string
          enum: [manual, pre_restore, pre_mutation]
        label: { type: string, minLength: 1, maxLength: 80 }
        nodeCount: { type: integer, minimum: 0, maximum: 2000 }
        createdAt: { $ref: '#/components/schemas/UtcDateTime' }
        changeCounts: { $ref: '#/components/schemas/CollectionVersionChangeCounts' }
        changes:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CollectionVersionChange' }
        truncated: { type: boolean }
      required:
        - versionId
        - etag
        - collectionId
        - contentRevision
        - kind
        - label
        - nodeCount
        - createdAt
        - changeCounts
    CollectionVersionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CollectionVersion' }
        nextCursor:
          type: ['string', 'null']
      required: [items, nextCursor]
    CollectionVersionRestoreRequest:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    CollectionVersionRestoreReceipt:
      type: object
      additionalProperties: false
      required:
        - versionId
        - noop
        - updatedNodeIds
        - movedNodeIds
        - deletedNodeIds
        - preRestoreVersionId
      properties:
        versionId: { $ref: '#/components/schemas/OpaqueId' }
        noop: { type: boolean }
        updatedNodeIds:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/OpaqueId' }
        movedNodeIds:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/OpaqueId' }
        deletedNodeIds:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/OpaqueId' }
        preRestoreVersionId:
          type: ['string', 'null']
    ReadableReplicaExtractRequest:
      type: object
      additionalProperties: false
      properties:
        force: { type: boolean }
    ReadableReplicaParagraph:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 32 }
        text: { type: string, minLength: 0, maxLength: 10000 }
      required: [id, text]
    ReadableReplicaSection:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 32 }
        heading: { type: string, minLength: 0, maxLength: 200 }
        paragraphs:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/ReadableReplicaParagraph' }
      required: [id, heading, paragraphs]
    ReadableReplicaView:
      type: object
      additionalProperties: false
      properties:
        nodeId: { $ref: '#/components/schemas/OpaqueId' }
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        status:
          type: string
          enum: [none, pending, ready, failed, unsupported]
        sourceUrl: { type: string, minLength: 1, maxLength: 4096 }
        title: { type: ['string', 'null'] }
        byline: { type: ['string', 'null'] }
        wordCount: { type: integer, minimum: 0 }
        extractedAt:
          type: ['string', 'null']
          format: date-time
        failureCode:
          type: ['string', 'null']
          enum: [not_html, empty, timeout, denied, too_large, http, dns, invalid_url, null]
        sections:
          type: array
          maxItems: 80
          items: { $ref: '#/components/schemas/ReadableReplicaSection' }
        etag:
          oneOf:
            - $ref: '#/components/schemas/EntityTag'
            - type: 'null'
      required:
        - nodeId
        - collectionId
        - status
        - sourceUrl
        - title
        - byline
        - wordCount
        - extractedAt
        - failureCode
        - sections
        - etag

    EditableNodeView:
      oneOf:
        - $ref: '#/components/schemas/FolderNodeView'
        - $ref: '#/components/schemas/BookmarkNodeView'
      discriminator:
        propertyName: kind
        mapping:
          folder: '#/components/schemas/FolderNodeView'
          bookmark: '#/components/schemas/BookmarkNodeView'
    NodeView:
      oneOf:
        - $ref: '#/components/schemas/RootNodeView'
        - $ref: '#/components/schemas/FolderNodeView'
        - $ref: '#/components/schemas/BookmarkNodeView'

    CreateCollectionRequest:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/CollectionKind' }
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: [string, 'null'], maxLength: 2000 }
      required: [kind, title, summary]
    CollectionMergePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: [string, 'null'], maxLength: 2000 }
        visibility: { $ref: '#/components/schemas/PublicationVisibility' }
        publicationSlug: { $ref: '#/components/schemas/PublicationSlug' }
        allowSearchIndexing:
          type: boolean
          description: Explicitly opt the Collection and eligible Nodes in or out of Search indexing.

    PublicationVisibility:
      type: string
      enum: [private, public, unlisted]
    PublicationSlug:
      type: string
      minLength: 3
      maxLength: 63
      pattern: '^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$'
    PublicationLocatorSlug:
      type: string
      minLength: 3
      maxLength: 263
      pattern: '^[a-z0-9](?:[a-z0-9-]{1,261}[a-z0-9])$'
    RecordInsightEventRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [eventType]
          properties:
            eventType:
              type: string
              enum: [collection_view, preview_open]
        - type: object
          additionalProperties: false
          required: [eventType, nodeId]
          properties:
            eventType:
              type: string
              const: resource_open
            nodeId:
              $ref: '#/components/schemas/OpaqueId'
    PublishingInsights:
      type: object
      additionalProperties: false
      required: [window, funnel, weekly, topResources]
      properties:
        window:
          type: object
          additionalProperties: false
          required: [days]
          properties:
            days:
              type: integer
              const: 30
              description: >-
                Exactly 30 UTC calendar days including today. Weekly views are
                four 7-day buckets ending today and do not share the funnel
                window start.
        funnel:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - type: object
              additionalProperties: false
              required: [label, value]
              properties:
                label: { type: string, const: 'Collection views' }
                value: { type: integer, minimum: 0 }
            - type: object
              additionalProperties: false
              required: [label, value]
              properties:
                label: { type: string, const: 'Preview opens' }
                value: { type: integer, minimum: 0 }
          items: false
        weekly:
          type: array
          minItems: 4
          maxItems: 4
          prefixItems:
            - type: object
              additionalProperties: false
              required: [w, views]
              properties:
                w: { type: string, const: W1 }
                views: { type: integer, minimum: 0 }
            - type: object
              additionalProperties: false
              required: [w, views]
              properties:
                w: { type: string, const: W2 }
                views: { type: integer, minimum: 0 }
            - type: object
              additionalProperties: false
              required: [w, views]
              properties:
                w: { type: string, const: W3 }
                views: { type: integer, minimum: 0 }
            - type: object
              additionalProperties: false
              required: [w, views]
              properties:
                w: { type: string, const: W4 }
                views: { type: integer, minimum: 0 }
          items: false
        topResources:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [id, collectionId, title, opens]
            properties:
              id: { $ref: '#/components/schemas/OpaqueId' }
              collectionId: { $ref: '#/components/schemas/OpaqueId' }
              title: { type: string }
              opens: { type: integer, minimum: 0 }

    CollaboratorGrantRole:
      type: string
      enum: [editor, viewer]
    CollectionMemberRole:
      type: string
      enum: [owner, editor, viewer]
    InviteCollectionMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        role:
          $ref: '#/components/schemas/CollaboratorGrantRole'
    CollectionInviteCreated:
      type: object
      additionalProperties: false
      required: [inviteId, collectionId, role, expiresAt, policyEtag]
      properties:
        inviteId: { $ref: '#/components/schemas/OpaqueId' }
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        role: { $ref: '#/components/schemas/CollaboratorGrantRole' }
        expiresAt: { $ref: '#/components/schemas/UtcDateTime' }
        policyEtag: { $ref: '#/components/schemas/PolicyEntityTag' }
    CollectionMemberRoleMergePatch:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/CollaboratorGrantRole'
    CollaborationMembershipResult:
      type: object
      additionalProperties: false
      required: [collectionId, subjectId, role, grantedAt, policyEtag]
      properties:
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        subjectId: { $ref: '#/components/schemas/OpaqueId' }
        role: { $ref: '#/components/schemas/CollaboratorGrantRole' }
        grantedAt: { $ref: '#/components/schemas/UtcDateTime' }
        policyEtag: { $ref: '#/components/schemas/PolicyEntityTag' }
    CollectionMembersPage:
      type: object
      additionalProperties: false
      required: [collection, caller, policyEtag, members, invites]
      properties:
        collection:
          type: object
          additionalProperties: false
          required: [id, title]
          properties:
            id: { $ref: '#/components/schemas/OpaqueId' }
            title: { type: string, minLength: 0, maxLength: 4096 }
        caller:
          type: object
          additionalProperties: false
          required: [subjectId, role, canManage, canLeave]
          properties:
            subjectId: { $ref: '#/components/schemas/OpaqueId' }
            role: { $ref: '#/components/schemas/CollectionMemberRole' }
            canManage: { type: boolean }
            canLeave: { type: boolean }
        policyEtag: { $ref: '#/components/schemas/PolicyEntityTag' }
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [subjectId, role, displayName, email, initials, grantedAt]
            properties:
              subjectId: { $ref: '#/components/schemas/OpaqueId' }
              role: { $ref: '#/components/schemas/CollectionMemberRole' }
              displayName: { type: string, minLength: 1, maxLength: 512 }
              email:
                type: [string, 'null']
                format: email
                maxLength: 254
              initials: { type: string, minLength: 1, maxLength: 8 }
              avatarUrl:
                oneOf:
                  - { $ref: '#/components/schemas/HttpsUrl' }
                  - { type: 'null' }
                description: >-
                  Public profile avatar URL, or null when unset or unsafe.
                  Current servers always return this field; it stays off
                  required[] so 1.43.0 clients remain additive-compatible.
              grantedAt: { $ref: '#/components/schemas/UtcDateTime' }
        invites:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [inviteId, email, role, createdAt, expiresAt]
            properties:
              inviteId: { $ref: '#/components/schemas/OpaqueId' }
              email: { type: string, format: email, maxLength: 254 }
              role: { $ref: '#/components/schemas/CollaboratorGrantRole' }
              createdAt: { $ref: '#/components/schemas/UtcDateTime' }
              expiresAt: { $ref: '#/components/schemas/UtcDateTime' }
        page:
          $ref: '#/components/schemas/CollaborationListPageState'
    CollaborationListPageState:
      type: object
      additionalProperties: false
      required: [returnedCount, hasMore, nextCursor]
      properties:
        returnedCount: { type: integer, minimum: 0, maximum: 150 }
        hasMore: { type: boolean }
        nextCursor:
          oneOf:
            - { $ref: '#/components/schemas/Cursor' }
            - { type: 'null' }
    MyCollaborationInviteItem:
      type: object
      additionalProperties: false
      required: [inviteId, collectionId, collectionTitle, role, email, expiresAt, invitedAt]
      properties:
        inviteId: { $ref: '#/components/schemas/OpaqueId' }
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        collectionTitle: { type: string, minLength: 0, maxLength: 4096 }
        role: { $ref: '#/components/schemas/CollaboratorGrantRole' }
        email: { type: string, format: email, maxLength: 254 }
        expiresAt: { $ref: '#/components/schemas/UtcDateTime' }
        invitedAt: { $ref: '#/components/schemas/UtcDateTime' }
    MyCollaborationInvitesPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyCollaborationInviteItem' }
        page:
          $ref: '#/components/schemas/CollaborationListPageState'

    FolderCreate:
      type: object
