    # ---- P4A-P01 Attachment responses (1.15.0) -----------------------------
    # Every Attachment error response uses the single AttachmentErrorEnvelope
    # so one client parser covers the whole resource family; the code enum is
    # the machine contract for each status.

    AttachmentIssueResponse:
      description: Durable upload intent issued or recovered, with the one-time grant.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentIssueResult' }
    AttachmentCompleteResponse:
      description: Upload completed, idempotently replayed, or already verified.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentCompleteResult' }
    AttachmentStatusResponse:
      description: Owner-private status and metadata view; never a malware verdict.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentStatusDto' }
    AttachmentFinalizeResponse:
      description: Attachment finalized in the canonical mutation.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentFinalizeResult' }
    AttachmentReplacementResponse:
      description: Replacement generation intent issued with a new one-time grant.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentIssueResult' }
    AttachmentRetireResponse:
      description: Attachment logically retired into retention.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentRetireResult' }
    AttachmentDownloadResponse:
      description: Short-lived owner download capability for the isolated origin.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentDownloadAdmission' }
    AttachmentBadRequest:
      description: invalid_request or invalid_json.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
    AttachmentAuthenticationRequired:
