        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
    AttachmentForbidden:
      description: csrf_failed or insufficient_permission.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
    AttachmentNotFound:
      description: >-
        resource_not_found. Foreign, absent, retired/tombstoned, and
        unauthorized Attachment identities are concealed with this stable
        external Problem: no body variation, no redirect, no capability.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
