        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }
    put:
      tags: [Favicon]
      operationId: setBookmarkFaviconSource
      summary: Set the icon source mode of one bookmark node
      description: >-
        FO-02. Session + Origin + CSRF + Known-Command-Id. Owner-only.
        Requires If-Match (one strong ETag returned by the favicon-source GET)
        that fences the current node resource revision and source revision;
        a URL change or concurrent source write makes the old ETag stale (412
        with currentEtag). sourceMode accepts inherit, online and none.
        uploaded cannot be written here — it only enters through the real
        image upload and is removed again by the explicit Product delete.
        Switching away from an uploaded image deletes the binding and its
        immutable object. Exact retries reuse Known-Command-Id and replay the
        first receipt.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaviconOrderingSetIconSource' }
      responses:
        '200':
          description: The projected icon source state after the change.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaviconOrderingIconSource' }
        '400': { $ref: '#/components/responses/FaviconOrderingError400' }
        '401': { $ref: '#/components/responses/FaviconOrderingError401' }
        '403': { $ref: '#/components/responses/FaviconOrderingError403' }
        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '409': { $ref: '#/components/responses/FaviconOrderingError409' }
        '410': { $ref: '#/components/responses/FaviconOrderingError410' }
        '412': { $ref: '#/components/responses/FaviconOrderingError412' }
        '413': { $ref: '#/components/responses/FaviconOrderingError413' }
        '415': { $ref: '#/components/responses/FaviconOrderingError415' }
        '428': { $ref: '#/components/responses/FaviconOrderingError428' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }

  /api/v1/collections/{collectionId}/nodes/{nodeId}/favicon-refresh:
    post:
      tags: [Favicon]
      operationId: refreshBookmarkFavicon
      summary: Enqueue a durable refresh of one online favicon
      description: >-
        FO-02. Session + Origin + CSRF + Known-Command-Id. Owner-only. Requires
        If-Match (one strong favicon-source ETag). No request body. Produces a
        durable refresh_one job persisted with the account, node, resolved
        provider URL, source revision and policy revision; the real worker
        fetches, decodes, fixes the immutable object and CAS-switches the
        binding out-of-band. 202 returns only { jobId }; the client tracks that
        jobId while it polls the effective source state. The effective icon
        source must be online, otherwise 400 invalid_request. Closing the UI
        never cancels the durable job. Exact retries reuse Known-Command-Id and
        replay the first 202. Feature flag KNOWN_FEATURE_FAVICON_POLICY=false
        returns 404.
      security:
        - cookieAuth: []
        - productBearer: []
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: The durable job was accepted; poll the effective source state for the version switch.
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaviconOrderingIconJobAccepted' }
        '400': { $ref: '#/components/responses/FaviconOrderingError400' }
        '401': { $ref: '#/components/responses/FaviconOrderingError401' }
        '403': { $ref: '#/components/responses/FaviconOrderingError403' }
        '404': { $ref: '#/components/responses/FaviconOrderingError404' }
        '405': { $ref: '#/components/responses/FaviconOrderingError405' }
        '409': { $ref: '#/components/responses/FaviconOrderingError409' }
        '410': { $ref: '#/components/responses/FaviconOrderingError410' }
        '412': { $ref: '#/components/responses/FaviconOrderingError412' }
        '413': { $ref: '#/components/responses/FaviconOrderingError413' }
        '415': { $ref: '#/components/responses/FaviconOrderingError415' }
        '428': { $ref: '#/components/responses/FaviconOrderingError428' }
        '429': { $ref: '#/components/responses/FaviconOrderingError429' }
        '500': { $ref: '#/components/responses/FaviconOrderingError500' }
        '503': { $ref: '#/components/responses/FaviconOrderingError503' }

