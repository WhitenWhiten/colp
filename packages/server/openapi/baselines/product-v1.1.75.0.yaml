        reused with a different binding). Retry-After is never emitted.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
    AttachmentPayloadTooLarge:
      description: payload_too_large.
      headers:
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AttachmentErrorEnvelope' }
