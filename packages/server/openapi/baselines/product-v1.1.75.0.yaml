        subject:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type: { type: string, enum: [collection, profile] }
            id: { $ref: '#/components/schemas/OpaqueId' }
        state: { type: string, enum: [read, unread] }
        stateRevision: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        readAt: { type: [string, 'null'], format: date-time }
        occurredAt: { type: string, format: date-time }
        actorHandle:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
              pattern: '^(?!\.{1,2}$)[a-z0-9._~-]+$'
