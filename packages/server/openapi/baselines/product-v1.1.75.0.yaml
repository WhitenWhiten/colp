      additionalProperties: false
      properties:
        cursor: { type: string, minLength: 1, maxLength: 2048 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    FollowRelationDto:
      type: object
      additionalProperties: false
      properties:
        actorProfileId: { $ref: '#/components/schemas/ProfileStableId' }
        targetProfileId: { $ref: '#/components/schemas/ProfileStableId' }
        following: { type: boolean }
        changedAt: { type: string, format: date-time }
      required: [actorProfileId, targetProfileId, following, changedAt]
    CollectionFollowState:
      type: object
      additionalProperties: false
      properties:
        following: { type: boolean }
        followerCount: { type: integer, minimum: 0 }
        followedAt:
          oneOf:
            - { $ref: '#/components/schemas/UtcDateTime' }
            - { type: 'null' }
      required: [following, followerCount, followedAt]
    FollowedCollectionItem:
      type: object
      additionalProperties: false
      properties:
        collectionId: { $ref: '#/components/schemas/OpaqueId' }
        slug: { $ref: '#/components/schemas/PublicationLocatorSlug' }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary:
          oneOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        kind: { $ref: '#/components/schemas/CollectionKind' }
        owner: { $ref: '#/components/schemas/ProfileSummaryDto' }
        updatedAt: { $ref: '#/components/schemas/UtcDateTime' }
        followedAt: { $ref: '#/components/schemas/UtcDateTime' }
        availability:
          type: string
          enum: [available, unavailable]
          description: >-
            unavailable means the follow row survives while its target cannot
            be opened right now (soft-deleted by the owner, no longer
            public/unlisted, or the owner account is inactive). Such rows keep
            the title and the immutable publication slug that the follower
            already knew, but summary is always null and clients must render
            them inert (greyed out, not navigable). Hard deletion cascades the
            follow row itself, so it disappears from this list entirely. The
            server always emits this field since 1.47.0; it stays optional so
            1.46.0 clients remain valid, and a missing value MUST be read as
            available.
      required: [collectionId, slug, title, summary, kind, owner, updatedAt, followedAt]
    FollowedCollectionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FollowedCollectionItem' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
      required: [items, nextCursor]
    LibraryOrderSection:
      type: string
      enum: [mine, shared, following]
      description: One collapsible sidebar section of the /library desk.
    LibraryOrderSectionIds:
      type: array
      maxItems: 200
      uniqueItems: true
      items: { $ref: '#/components/schemas/OpaqueId' }
      description: >-
        Collection ids in the order the section renders them. Ids the reader
        cannot see anymore are skipped by clients; Collections missing from
        the list append after the ordered ones in the server list order.
    LibraryOrderView:
      type: object
      additionalProperties: false
      properties:
        sections:
          type: object
          additionalProperties: false
          properties:
            mine: { $ref: '#/components/schemas/LibraryOrderSectionIds' }
            shared: { $ref: '#/components/schemas/LibraryOrderSectionIds' }
            following: { $ref: '#/components/schemas/LibraryOrderSectionIds' }
          required: [mine, shared, following]
      required: [sections]
