        beforeId:
          oneOf:
            - $ref: '#/components/schemas/OpaqueId'
            - type: 'null'
        node: { $ref: '#/components/schemas/NodeCreate' }
      required: [parentId, afterId, beforeId, node]
    NodeMergePatch:
      type: object
