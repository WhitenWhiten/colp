openapi: 3.1.0
info:
  title: Breaking Feed check fixture
  version: 1.0.0
paths:
  /api/v1/feed:
    get:
      operationId: getProductFeed
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
components:
  schemas:
    FeedPage:
      type: object
      additionalProperties: false
      properties:
        items: { type: array, items: { type: string } }
        nextCursor: { type: [string, 'null'] }
      required: [items, nextCursor]
