openapi: 3.1.0
info:
  title: Breaking check fixture
  version: 1.0.1
paths:
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema: { type: string }
        - name: detail
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Widget
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        state: { type: string, enum: [active, archived] }
      required: [id, state]
